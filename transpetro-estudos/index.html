q:[
Q("Para o conjunto de dados 2, 4, 4, 4, 5, 5, 7, 9, o desvio padrão populacional é",["1.","2.","3.","4.","5."],1,["Erro de cálculo.","Média 5; soma dos quadrados dos desvios = 32; variância = 32/8 = 4; desvio padrão = 2.","Erro de cálculo.","4 é a variância, não o desvio padrão.","5 é a média."],"Bussab e Morettin."),
Q("Um conjunto de dados tem média 5 e desvio padrão 2. Se cada valor for multiplicado por 3 e acrescido de 2, a nova média e o novo desvio padrão serão, respectivamente,",["17 e 6.","17 e 8.","15 e 6.","15 e 8.","17 e 2."],0,["Média = 3·5 + 2 = 17; desvio padrão = 3·2 = 6 (somar constante não altera a dispersão).","O desvio padrão não recebe a constante somada.","A média inclui a constante somada.","Erro em ambos.","O desvio padrão é multiplicado por 3."],"Propriedades de transformação linear."),
Q("De um grupo de 8 pessoas será escolhida uma comissão de 3 membros, sem funções distintas. O número de comissões possíveis é",["24.","56.","112.","336.","512."],1,["Erro de cálculo.","C(8,3) = 8!/(3!·5!) = 56.","Erro de cálculo.","É A(8,3), que considera a ordem.","É 8³."],"Combinação simples."),
Q("O número de anagramas da palavra TRANSPETRO é",["3.628.800.","907.200.","1.814.400.","453.600.","10."],1,["Seria 10! sem considerar letras repetidas.","Há 10 letras, com T e R repetidas duas vezes: 10!/(2!·2!) = 907.200.","Corresponde a dividir por 2 apenas uma vez.","Erro de cálculo.","Erro de cálculo."],"Permutação com repetição."),
Q("Lançando-se uma moeda honesta 3 vezes, a probabilidade de obter exatamente duas caras é",["1/8.","3/8.","1/2.","5/8.","3/4."],1,["É a probabilidade de exatamente 3 caras.","C(3,2)·(1/2)³ = 3/8.","Erro de cálculo.","É o complemento de 3/8.","Erro de cálculo."],"Distribuição binomial.")
]});

MODS.push({n:11,t:"Gases, termologia, unidades e conversões",edital:"Relações entre volume, pressão e temperatura; termologia; sistemas de unidades; conversões",
intro:"Este módulo reúne a base física do edital: comportamento de gases, escalas de temperatura, calor e conversão de unidades típicas do setor de petróleo (barril, m³, atm, psi).",
obj:["Aplicar a equação dos gases ideais e as transformações isotérmica, isobárica e isocórica.","Converter escalas de temperatura (°C, °F, K).","Calcular calor sensível e latente.","Converter unidades de volume, pressão e energia."],
secs:[
["1. Gases ideais","<p><code>PV = nRT</code>, com T sempre em <b>kelvin</b> (K = °C + 273,15; na prática, +273). R ≈ 0,082 atm·L/(mol·K) ≈ 8,314 J/(mol·K).</p><ul><li><b>Boyle</b> (T constante): P₁V₁ = P₂V₂.</li><li><b>Charles</b> (P constante): V₁/T₁ = V₂/T₂.</li><li><b>Gay-Lussac</b> (V constante): P₁/T₁ = P₂/T₂.</li><li>Geral: P₁V₁/T₁ = P₂V₂/T₂.</li><li>Volume molar nas CNTP (0 °C, 1 atm): 22,4 L/mol.</li></ul>","Física básica do ensino médio e superior (p. ex., HALLIDAY; RESNICK; WALKER, <i>Fundamentos de Física</i>, LTC)."],
["2. Termologia","<ul><li>Escalas: <code>F = 1,8·C + 32</code>; <code>K = C + 273</code>.</li><li>Calor sensível: <code>Q = m·c·ΔT</code> (muda a temperatura). Água: c = 1 cal/(g·°C) ≈ 4,18 J/(g·K).</li><li>Calor latente: <code>Q = m·L</code> (muda o estado, temperatura constante).</li><li>Dilatação linear: <code>ΔL = L₀·α·ΔT</code>; superficial ≈ 2α; volumétrica ≈ 3α. Líquidos dilatam em tanques com a temperatura, o que importa na medição de volumes.</li><li>Transmissão de calor: condução, convecção e irradiação.</li></ul>","HALLIDAY; RESNICK; WALKER."],
["3. Sistemas de unidades e conversões","<table><tr><th>Grandeza</th><th>Conversão útil</th></tr><tr><td>Volume</td><td>1 bbl (barril) = 42 galões US ≈ 158,987 L ≈ 0,159 m³; 1 m³ = 1000 L ≈ 6,29 bbl; 1 galão US ≈ 3,785 L; 1 ft³ ≈ 28,317 L</td></tr><tr><td>Pressão</td><td>1 atm = 101 325 Pa = 760 mmHg ≈ 1,013 bar; 1 bar = 10⁵ Pa; 1 psi ≈ 6895 Pa; 1 kgf/cm² ≈ 98 066 Pa</td></tr><tr><td>Energia</td><td>1 cal = 4,1868 J; 1 kWh = 3,6 MJ; 1 BTU ≈ 1055 J</td></tr><tr><td>Comprimento e velocidade</td><td>1 milha náutica = 1852 m; 1 nó = 1 milha náutica/h ≈ 0,514 m/s</td></tr><tr><td>Massa e densidade</td><td>ρ = m/V; conversão volume ↔ massa depende da densidade do produto</td></tr></table><p>SI: metro, quilograma, segundo, ampère, kelvin, mol e candela. Prefixos: k (10³), M (10⁶), G (10⁹), m (10⁻³), µ (10⁻⁶).</p>","INMETRO (Sistema Internacional de Unidades); fatores de conversão padrão."]
],
mapa:`FÍSICA APLICADA
├── Gases: PV = nRT (T em K)
│   ├── Boyle (T cte)  Charles (P cte)  Gay-Lussac (V cte)
├── Termologia: F = 1,8C + 32; K = C + 273
│   ├── Q = m·c·ΔT (sensível)   Q = m·L (latente)
│   └── Dilatação: ΔL = L0·α·ΔT
└── Unidades: 1 bbl ≈ 159 L; 1 atm = 101 325 Pa; 1 cal = 4,1868 J`,
q:[
Q("Dois mols de um gás ideal ocupam, a 300 K e 1 atm, um volume de (use R = 0,082 atm·L/mol·K)",["24,6 L.","49,2 L.","98,4 L.","4,92 L.","12,3 L."],1,["Corresponde a 1 mol.","V = nRT/P = 2·0,082·300/1 = 49,2 L.","Seria o resultado com 4 mols.","Erro de fator de 10.","Corresponde a 0,5 mol."],"Equação dos gases ideais."),
Q("Um gás ideal, mantido em volume constante, está a 27 °C e 2 atm. Ao ser aquecido até 127 °C, sua pressão, em atm, passa a ser aproximadamente",["2,67.","4,00.","9,41.","1,50.","2,00."],0,["P₂ = P₁·T₂/T₁ = 2·400/300 ≈ 2,67 atm (Gay-Lussac, com T em kelvin).","Resultaria de dobrar a pressão, sem base na relação em kelvin.","Resultaria do erro de usar as temperaturas em °C.","A pressão aumenta com o aquecimento a volume constante.","A pressão não permanece constante."],"Lei de Gay-Lussac."),
Q("Uma temperatura de 50 °C corresponde, nas escalas Kelvin e Fahrenheit, respectivamente, a",["323 K e 122 °F.","223 K e 122 °F.","323 K e 90 °F.","273 K e 50 °F.","373 K e 212 °F."],0,["K = 50 + 273 = 323; F = 1,8·50 + 32 = 122.","223 K seria −50 °C.","F = 1,8·50 + 32 = 122, não 90.","Ignora a conversão.","São os valores do ponto de ebulição da água (100 °C)."],"Conversão entre escalas termométricas."),
Q("Para aquecer 2 kg de água líquida de 20 °C a 70 °C, sem mudança de estado, considerando c = 1 cal/(g·°C), é necessária uma quantidade de calor de",["10 kcal.","50 kcal.","100 kcal.","140 kcal.","1000 kcal."],2,["Erro de escala na conta.","Usaria massa de 1 kg.","Q = m·c·ΔT = 2000·1·50 = 100 000 cal = 100 kcal.","Confunde ΔT com a soma das temperaturas (70 + 20 = 90) ou outro erro.","Erro de fator de 10."],"Calor sensível: Q = m·c·ΔT."),
Q("Considerando 1 barril ≈ 158,987 litros, um volume de 1000 barris equivale a aproximadamente",["63 m³.","159 m³.","1590 m³.","6,29 m³.","15,9 m³."],1,["Resultado de dividir por 15,9 em vez de multiplicar por 0,159.","1000 · 158,987 L = 158 987 L ≈ 159 m³.","Erro de fator de 10.","Corresponde a 1 m³ em barris (≈ 6,29), não o inverso.","Erro de fator de 10."],"Fatores de conversão padrão da indústria do petróleo.")
]});

MODS.push({n:12,t:"Gestão de estoques e materiais",fora:true,edital:"não consta por nome no Anexo IV (pode aparecer sob \"noções elementares de logística\")",
alerta:"Complemento fora do Anexo IV. Fórmulas e conceitos clássicos da literatura; não foram conferidos contra provas anteriores.",
intro:"Estoques equilibram oferta e demanda e custam dinheiro. A gestão busca o menor custo total com o nível de serviço desejado. As questões costumam envolver classificação ABC, lote econômico, ponto de pedido, estoque de segurança e indicadores.",
obj:["Distinguir tipos de estoque e de custos.","Classificar itens pela curva ABC.","Calcular lote econômico, ponto de pedido e estoque de segurança.","Calcular giro e cobertura.","Diferenciar sistemas de reposição e critérios de avaliação de estoque."],
secs:[
["1. Tipos de estoque e custos","<ul><li>Tipos: de <b>ciclo</b> (lote), de <b>segurança</b> (incertezas de demanda e prazo), <b>sazonal</b> ou de antecipação, em <b>trânsito</b> (pipeline) e especulativo.</li><li>Custos: de <b>pedido</b> (fixos por pedido), de <b>manutenção</b> (capital, armazenagem, seguros, obsolescência, perdas) e de <b>falta</b> (ruptura: vendas perdidas, paradas).</li></ul>","BALLOU, R. H., <i>Gerenciamento da Cadeia de Suprimentos/Logística Empresarial</i>; CHOPRA; MEINDL; SLACK, N. et al., <i>Administração da Produção</i>."],
["2. Classificação ABC (Pareto)","<p>Ordena os itens por valor anual de consumo (consumo × custo unitário). Classe <b>A</b>: poucos itens que concentram a maior parte do valor (controle rigoroso); <b>B</b>: intermediária; <b>C</b>: muitos itens de pequeno valor (controle simples). Os percentuais típicos (por exemplo, ~20% dos itens para ~80% do valor) são regra prática, não norma. A classificação por <b>criticidade</b> (efeito da falta) pode diferir da de valor, sobretudo em manutenção. XYZ classifica pela previsibilidade da demanda.</p>","BALLOU; SLACK et al."],
["3. Lote econômico de compra (LEC/EOQ)","<p><code>Q* = √(2·D·S / H)</code>, com D = demanda anual, S = custo por pedido, H = custo de manter uma unidade por ano. No ponto ótimo, <b>custo anual de pedir = custo anual de manter</b>. Hipóteses: demanda constante e conhecida, reposição instantânea, sem falta, preço constante. Número de pedidos por ano = D/Q*; intervalo entre pedidos = Q*/D.</p>","CHOPRA; MEINDL; BALLOU."],
["4. Ponto de pedido e estoque de segurança","<ul><li>Ponto de pedido (reposição): <code>PP = d·L + ES</code>, com d = demanda média por período e L = prazo de ressuprimento (lead time).</li><li>Estoque de segurança com demanda variável e prazo constante: <code>ES = z·σd·√L</code>. O fator z depende do nível de serviço: 90% → 1,28; 95% → 1,65; 99% → 2,33.</li><li>Sistemas: <b>revisão contínua</b> (pedido de Q quando atinge o ponto de pedido) e <b>revisão periódica</b> (a cada intervalo fixo, repõe até um nível máximo).</li></ul>","CHOPRA; MEINDL."],
["5. Indicadores, avaliação e MRP","<ul><li><b>Giro</b> = consumo (ou CMV) do período / estoque médio. <b>Cobertura</b> = estoque / consumo médio por período (em dias ou meses); giro e cobertura são inversos.</li><li><b>Acuracidade</b> do inventário = itens com saldo físico igual ao registrado / itens contados. <b>Inventário rotativo</b> (cíclico) conta parte dos itens ao longo do ano; o geral conta todos em uma data.</li><li>Avaliação: <b>PEPS</b> (primeiro que entra, primeiro que sai), <b>custo médio ponderado</b>. O <b>UEPS</b> não é admitido pelo CPC 16 (IAS 2).</li><li><b>MRP</b>: planeja necessidades de itens de <b>demanda dependente</b> a partir do plano mestre, da lista de materiais e dos estoques e prazos.</li></ul>","SLACK et al.; CPC 16 (R1) (Estoques)."]
],
mapa:`ESTOQUES
├── Tipos: ciclo, segurança, sazonal, em trânsito | Custos: pedir, manter, falta
├── ABC: valor de consumo (Pareto) | XYZ: previsibilidade | criticidade
├── LEC: Q* = √(2DS/H) | custo de pedir = custo de manter
├── PP = d·L + ES | ES = z·σ·√L
├── Giro = consumo/estoque médio | Cobertura = estoque/consumo
└── PEPS, custo médio (UEPS não admitido pelo CPC 16) | MRP`,
q:[
Q("Uma empresa consome 1.200 unidades por ano de um item, com custo de emissão de pedido de R$ 50,00 e custo de manutenção de R$ 6,00 por unidade por ano. O lote econômico de compra, em unidades, é aproximadamente",["100.","141.","200.","240.","400."],1,["Sem base no cálculo.","Q* = √(2·1200·50/6) = √20.000 ≈ 141.","Sem base no cálculo.","Sem base no cálculo.","Sem base no cálculo."],"Fórmula do LEC (Chopra e Meindl; Ballou)."),
Q("Um item tem demanda média de 20 unidades por dia, prazo de ressuprimento de 5 dias e estoque de segurança de 30 unidades. O ponto de pedido é de",["100.","110.","130.","150.","600."],2,["Ignora o estoque de segurança.","Sem base no cálculo.","PP = 20·5 + 30 = 130.","Sem base no cálculo.","Multiplicaria todos os fatores."],"Sistema de revisão contínua."),
Q("Na classificação ABC de estoques pelo valor de consumo, os itens da classe A são",["numerosos e de baixo valor, com controle simples.","poucos e responsáveis pela maior parte do valor consumido, merecendo controle mais rigoroso.","os de menor criticidade para a operação.","todos os itens de demanda constante.","os que têm giro mais baixo."],1,["Descreve a classe C.","Princípio de Pareto aplicado ao valor de consumo.","Valor e criticidade são critérios diferentes.","A classe A não depende de a demanda ser constante.","O giro não define a classe."],"Ballou; Slack et al."),
Q("Se o consumo anual de um item é de 2.400 unidades e o estoque médio é de 400 unidades, o giro anual e a cobertura são, respectivamente,",["6 vezes por ano e 2 meses.","4 vezes por ano e 3 meses.","6 vezes por ano e 6 meses.","0,17 vez por ano e 2 meses.","12 vezes por ano e 1 mês."],0,["Giro = 2400/400 = 6; cobertura = 12/6 = 2 meses.","Sem base no cálculo.","A cobertura não é 6 meses.","Inverte a razão do giro.","Sem base no cálculo."],"Indicadores de estoque."),
Q("Para um nível de serviço de 95% (z = 1,65), desvio padrão da demanda diária de 10 unidades e prazo de ressuprimento de 4 dias, o estoque de segurança é de aproximadamente",["16,5.","33.","66.","41.","20."],1,["Ignora o efeito do prazo.","ES = 1,65·10·√4 = 33.","Multiplica pelo prazo em vez de √L.","Sem base no cálculo.","Sem base no cálculo."],"ES = z·σd·√L (Chopra e Meindl).")
]});

MODS.push({n:13,t:"Incoterms 2020",fora:true,edital:"não consta por nome no Anexo IV (comércio internacional e afretamento cabem em \"logística\" e \"comercialização\")",
alerta:"Complemento fora do Anexo IV. Descrições dos termos conferidas na Tabela-resumo do Siscomex (baseada na Publicação ICC nº 723-E, de 2020). Pontos que a tabela não traz (nível de seguro ICC A/C, conhecimento de embarque no FCA, itens que os Incoterms não cobrem) vêm de conhecimento prévio: o texto oficial da ICC é pago e não foi consultado. Confira se há versão mais nova antes da prova.",
intro:"Incoterms são regras da Câmara de Comércio Internacional (ICC) que definem, em contratos de compra e venda, obrigações de entrega, transferência de riscos e divisão de custos entre vendedor e comprador. São muito usados em cargas de petróleo e derivados (FOB, CFR, CIF).",
obj:["Identificar os 11 termos e seus dois grupos.","Determinar onde o risco e os custos passam ao comprador.","Distinguir obrigações de frete, seguro e desembaraço.","Reconhecer as mudanças da versão 2020."],
secs:[
["1. Natureza e limites","<p>Os Incoterms tratam de entrega, riscos, custos, desembaraço e documentos. <b>Não tratam</b> de transferência de propriedade, preço, forma de pagamento, lei aplicável, solução de controvérsias ou consequências de quebra de contrato. Devem ser citados com o local e a versão (por exemplo, \"FOB Santos, Incoterms 2020\").</p>","ICC, <i>Incoterms 2020</i>."],
["2. Os 11 termos (Publicação ICC nº 723-E, 2020, conforme Siscomex)","<table><tr><th>Grupo</th><th>Termo</th><th>Onde termina a obrigação do vendedor</th><th>Observações</th></tr><tr><td rowspan=\"7\">Qualquer modalidade</td><td>EXW</td><td>Mercadoria à disposição do comprador no estabelecimento do vendedor</td><td>Sem desembaraço de exportação nem carregamento (regra ICC). Nas exportações brasileiras, a Receita entende que o desembaraço é feito pelo vendedor, por conta e risco dele</td></tr><tr><td>FCA</td><td>Entrega, desembaraçada para exportação, ao transportador indicado pelo comprador no local nomeado</td><td>Transporte próprio permitido em trechos</td></tr><tr><td>CPT</td><td>Como no FCA, e o vendedor contrata e paga frete e custos até o local de destino combinado</td><td></td></tr><tr><td>CIP</td><td>Como no FCA, e o vendedor contrata e paga frete, custos e seguro até o destino</td><td>Seguro de cobertura ampla (ICC A) na versão 2020*</td></tr><tr><td>DAP</td><td>Mercadoria à disposição do comprador no local de destino, pronta para descarga, <b>não desembaraçada</b> para importação</td><td>Transporte próprio permitido</td></tr><tr><td>DPU</td><td>Mercadoria <b>descarregada</b> no local de destino, não desembaraçada para importação</td><td>Substituiu o DAT: o DAT exigia entrega em terminal; o DPU admite qualquer local (por exemplo, armazém do comprador)</td></tr><tr><td>DDP</td><td>Mercadoria à disposição no destino, <b>não descarregada</b>, com o vendedor assumindo desembaraço, impostos, taxas e encargos de importação</td><td>Máxima obrigação do vendedor. <b>Não pode ser usado na importação brasileira</b>: escolher DPU ou DAP</td></tr><tr><td rowspan=\"4\">Exclusivamente aquaviário (marítimo ou hidroviário interior)</td><td>FAS</td><td>Mercadoria colocada, desembaraçada para exportação, ao longo do costado do navio indicado pelo comprador, no porto de embarque</td><td></td></tr><tr><td>FOB</td><td>Mercadoria entregue, arrumada, <b>a bordo do navio</b> no porto de embarque, desembaraçada para exportação</td><td></td></tr><tr><td>CFR</td><td>Obrigações e riscos do FOB, e o vendedor contrata e paga frete e custos até o porto de destino</td><td></td></tr><tr><td>CIF</td><td>Obrigações e riscos do FOB, e o vendedor contrata e paga frete, custos e seguro até o porto de destino</td><td>Seguro de cobertura mínima (ICC C)*</td></tr></table><p class=\"src\">* O nível de cobertura (ICC A no CIP e ICC C no CIF) não consta da tabela do Siscomex; vem de conhecimento prévio: confira no texto da ICC.</p><p>Nos termos com frete pago pelo vendedor (CPT, CIP, CFR, CIF), custo e risco se dividem em pontos diferentes: o risco passa na origem, mas o vendedor paga o transporte até o destino.</p><p><b>Condições de venda não disciplinadas pela ICC</b> que o Siscomex lista para uso em operações brasileiras: <b>C+F</b> (custo mais frete), <b>C+I</b> (custo mais seguro) e <b>OCV</b> (outra condição de venda). Elas <b>não são Incoterms</b>.</p>","Siscomex, Tabela-resumo Incoterms 2020 (gov.br), com base na Publicação ICC nº 723-E; ICC, <i>Incoterms 2020</i> (texto pago, não consultado)."],
["3. Mudanças da versão 2020","<ul><li><b>DAT</b> deu lugar ao <b>DPU</b> (Delivered at Place Unloaded): o DPU pode ser usado em terminais ou em qualquer outro local determinado (Siscomex).</li><li>Comprador e vendedor podem usar <b>transporte próprio</b> em trechos do deslocamento nos termos FCA, DAP, DPU e DDP (Siscomex).</li><li><b>CIP</b> passou a exigir seguro com cobertura máxima (ICC A); o CIF manteve cobertura mínima (ICC C). O FCA passou a prever a possibilidade de o comprador instruir o transportador a emitir conhecimento de embarque com nota de \"embarcado\". <i>Esses dois pontos vêm de conhecimento prévio.</i></li></ul>","Siscomex; ICC, <i>Incoterms 2020</i>."]
],
mapa:`INCOTERMS 2020
├── Não tratam de propriedade, preço, pagamento, lei aplicável
├── Qualquer modal: EXW, FCA, CPT, CIP, DAP, DPU, DDP
├── Aquaviário: FAS, FOB, CFR, CIF
├── Frete pago pelo vendedor: CPT, CIP, CFR, CIF (risco passa na origem)
├── Seguro: CIP (ICC A) | CIF (ICC C)
└── 2020: DAT → DPU; FCA com BL "on board"`,
q:[
Q("Em uma venda FOB (Incoterms 2020), o risco de perda ou dano da mercadoria passa do vendedor ao comprador quando a mercadoria",["é colocada à disposição no estabelecimento do vendedor.","é entregue a bordo do navio indicado pelo comprador, no porto de embarque.","chega ao porto de destino.","é descarregada no destino.","passa pela alfândega de importação."],1,["Descreve o EXW.","FOB: entrega a bordo do navio no porto de embarque.","No CFR/CIF o risco também passa no embarque; o destino é ponto de custo, não de risco.","Descreve o DPU.","Descreve o DDP em parte (desembaraço de importação)."],"ICC, Incoterms 2020."),
Q("No Incoterm CIF (2020), o vendedor",["assume o risco até o porto de destino.","contrata e paga frete e seguro com cobertura mínima, mas o risco passa ao comprador quando a mercadoria está a bordo no porto de embarque.","apenas coloca a mercadoria à disposição no seu estabelecimento.","é responsável pelo desembaraço de importação.","descarrega a mercadoria no destino."],1,["O risco passa no embarque.","Vendedor paga frete e seguro (ICC C); risco passa a bordo no embarque.","Descreve o EXW.","O desembaraço de importação é do comprador, salvo DDP.","Descreve o DPU."],"ICC, Incoterms 2020."),
Q("Entre os termos abaixo, é utilizável exclusivamente em transporte marítimo e hidroviário:",["EXW.","FCA.","CPT.","DAP.","FOB."],4,["EXW serve a qualquer modal.","FCA serve a qualquer modal.","CPT serve a qualquer modal.","DAP serve a qualquer modal.","FOB, FAS, CFR e CIF são exclusivos do modal aquaviário."],"ICC, Incoterms 2020."),
Q("O Incoterm em que o vendedor assume a máxima obrigação, incluindo o desembaraço para importação e o pagamento de tributos de importação no país de destino, é",["EXW.","FOB.","CIF.","DPU.","DDP."],4,["No EXW o vendedor tem a mínima obrigação.","No FOB o comprador contrata o frete.","No CIF o vendedor paga frete e seguro, sem desembaraço de importação.","No DPU o vendedor descarrega no destino, sem desembaraço de importação.","DDP: entrega desembaraçada para importação, com tributos pelo vendedor."],"ICC, Incoterms 2020."),
Q("Segundo a Tabela-resumo de Incoterms 2020 do Siscomex, é correto afirmar que",["o DDP pode ser utilizado normalmente nas importações brasileiras.","o DDP não pode ser utilizado na importação brasileira, devendo-se escolher DPU ou DAP se houver preferência por condição disciplinada pela ICC.","C+F, C+I e OCV são Incoterms da ICC.","o FOB é utilizável em qualquer modalidade de transporte.","o DAP exige que o vendedor faça o desembaraço de importação."],1,["O vendedor estrangeiro não dispõe de condições legais para o desembaraço de entrada no Brasil.","Nota do Siscomex ao DDP.","C+F, C+I e OCV são condições de venda não disciplinadas pela ICC.","FOB é exclusivo do transporte aquaviário (marítimo ou hidroviário interior).","No DAP a mercadoria não é desembaraçada para importação."],"Siscomex, Tabela-resumo Incoterms 2020."),
Q("Em relação às mudanças trazidas pelos Incoterms 2020, é correto afirmar que",["o termo DAT foi substituído pelo DPU e o CIP passou a exigir cobertura de seguro ampla (Institute Cargo Clauses A).","o CIF passou a exigir cobertura de seguro máxima.","foram criados os termos DES e DEQ.","os Incoterms passaram a regular a transferência de propriedade.","o FOB passou a ser permitido para transporte rodoviário."],0,["DAT → DPU; CIP com ICC A.","O CIF manteve cobertura mínima (ICC C).","DES e DEQ foram retirados na versão de 2010.","Os Incoterms não tratam de propriedade.","O FOB continua exclusivo do modal aquaviário."],"ICC, Incoterms 2020.")
]});

MODS.push({n:14,t:"Negociação",fora:true,edital:"não consta por nome no Anexo IV (útil para comercialização e contratos)",
alerta:"Complemento fora do Anexo IV. Conceitos consagrados (Harvard, Thomas-Kilmann); nada aqui vem de norma da Transpetro.",
intro:"Negociar é buscar um acordo entre partes com interesses parcialmente conflitantes. Em comercialização e suprimentos, a qualidade da preparação costuma decidir o resultado.",
obj:["Diferenciar negociação distributiva e integrativa.","Aplicar os quatro princípios do método de Harvard.","Definir BATNA, ZOPA e ponto de reserva.","Reconhecer estilos de negociação.","Relacionar negociação e licitação nas estatais."],
secs:[
["1. Conceitos básicos","<ul><li><b>Negociação distributiva</b> (soma zero): ganho de um é perda do outro, foco em uma variável (em geral preço). <b>Integrativa</b> (ganha-ganha): amplia o valor total combinando várias variáveis (prazo, volume, qualidade, serviços).</li><li><b>Posições</b> (o que se pede) × <b>interesses</b> (por que se pede).</li><li><b>BATNA</b> (MAPAN, melhor alternativa à negociação de um acordo): o que a parte fará se não houver acordo. Define o <b>ponto de reserva</b>, o pior acordo aceitável.</li><li><b>ZOPA</b> (zona de possível acordo): intervalo entre os pontos de reserva das partes; só existe se houver sobreposição.</li><li><b>Ancoragem</b>: a primeira oferta influencia o resultado.</li></ul>","FISHER, R.; URY, W.; PATTON, B., <i>Como Chegar ao Sim</i>; LEWICKI, R. et al., <i>Fundamentos da Negociação</i>."],
["2. Método de Harvard (negociação baseada em princípios)","<ol><li>Separar as <b>pessoas</b> do problema.</li><li>Focar em <b>interesses</b>, não em posições.</li><li>Inventar <b>opções de ganho mútuo</b>.</li><li>Insistir em <b>critérios objetivos</b> (preços de mercado, normas, precedentes).</li></ol><p>Complemento: conhecer e melhorar a própria BATNA.</p>","FISHER; URY; PATTON."],
["3. Fases e preparação","<p>Preparação (objetivos, BATNA, ponto de reserva, informações sobre a outra parte), abertura, exploração de interesses, barganha e concessões, fechamento e implementação/acompanhamento. Em compras, pontos de alavancagem: volume, prazo de contrato, especificação, condições de pagamento e <b>custo total de propriedade</b>.</p>","LEWICKI et al."],
["4. Estilos de conflito (Thomas-Kilmann)","<table><tr><th>Estilo</th><th>Assertividade</th><th>Cooperação</th></tr><tr><td>Competição</td><td>Alta</td><td>Baixa</td></tr><tr><td>Colaboração</td><td>Alta</td><td>Alta</td></tr><tr><td>Compromisso</td><td>Média</td><td>Média</td></tr><tr><td>Evitação</td><td>Baixa</td><td>Baixa</td></tr><tr><td>Acomodação</td><td>Baixa</td><td>Alta</td></tr></table>","THOMAS, K.; KILMANN, R. (Instrumento de modos de conflito)."],
["5. Negociação em estatais","<p>Nas licitações da Lei 13.303, a negociação é <b>fase obrigatória</b>: a empresa deve negociar condições mais vantajosas com o primeiro colocado e, se o preço continuar acima do orçamento estimado, com os demais na ordem; se ninguém chegar ao orçamento, a licitação é revogada (art. 57). A negociação não pode violar os princípios da igualdade e da vinculação ao instrumento convocatório. Nas contratações diretas, a justificativa do preço é exigida (art. 30, §3º).</p>","Lei 13.303/2016, arts. 30 e 57 (texto conferido)."]
],
mapa:`NEGOCIAÇÃO
├── Distributiva (soma zero) × integrativa (ganha-ganha)
├── Posições × interesses | BATNA → ponto de reserva | ZOPA
├── Harvard: pessoas ≠ problema; interesses; opções; critérios objetivos
├── Estilos: competição, colaboração, compromisso, evitação, acomodação
└── Estatais: negociação obrigatória com o 1º colocado (art. 57, Lei 13.303)`,
q:[
Q("Na literatura de negociação, a BATNA (ou MAPAN) representa",["o preço inicial que uma das partes apresenta.","a melhor alternativa disponível para a parte caso não haja acordo.","o intervalo entre as ofertas das duas partes.","a concessão máxima que a outra parte aceita.","o critério objetivo de mercado."],1,["Descreve a oferta inicial ou âncora.","Melhor alternativa à negociação de um acordo.","Descreve a ZOPA em parte.","A concessão máxima da outra parte é o ponto de reserva dela.","Critérios objetivos são outro princípio do método de Harvard."],"Fisher, Ury e Patton."),
Q("A zona de possível acordo (ZOPA) existe quando",["os pontos de reserva das partes se sobrepõem.","as duas partes têm a mesma posição inicial.","uma das partes abandona a negociação.","as partes adotam o estilo de evitação.","há mediador presente."],0,["ZOPA é a sobreposição entre os pontos de reserva.","A posição inicial não define a ZOPA.","Sem acordo não há ZOPA por definição, mas não é essa a definição.","Estilos não definem ZOPA.","A mediação é independente da ZOPA."],"Lewicki et al."),
Q("Segundo o método de Harvard, uma negociação baseada em princípios deve",["concentrar-se em posições, para evitar exposição de interesses.","separar as pessoas do problema, focar em interesses, gerar opções de ganho mútuo e insistir em critérios objetivos.","adotar sempre a postura competitiva.","evitar critérios externos de mercado.","dispensar a preparação prévia."],1,["O método recomenda focar em interesses, não em posições.","Os quatro princípios do método.","A competição é apenas um dos estilos.","Critérios objetivos são um dos princípios.","A preparação é central."],"Fisher, Ury e Patton."),
Q("No modelo de Thomas-Kilmann, o estilo caracterizado por alta assertividade e alta cooperação é",["competição.","evitação.","acomodação.","colaboração.","compromisso."],3,["Competição: alta assertividade e baixa cooperação.","Evitação: baixas em ambas.","Acomodação: baixa assertividade e alta cooperação.","Colaboração: alta em ambas.","Compromisso: nível médio em ambas."],"Thomas e Kilmann."),
Q("De acordo com o art. 57 da Lei 13.303/2016, se, após a negociação com o primeiro colocado, o preço continuar acima do orçamento estimado, a empresa",["deve contratar mesmo assim, por ser o menor preço.","deve negociar com os demais licitantes, segundo a ordem inicialmente estabelecida.","deve dispensar a licitação automaticamente.","deve alterar o orçamento estimado.","deve sortear o vencedor."],1,["Preço acima do orçamento é causa de desclassificação (art. 56, IV), ressalvado o art. 34.","Art. 57, §1º.","A dispensa por preços superiores ao de mercado exige o caso do art. 29, IV, e não é automática.","A lei não autoriza ajustar o orçamento para acomodar a proposta.","Sorteio é critério de desempate."],"Lei 13.303/2016, arts. 56 e 57.")
]});

MODS.push({n:15,t:"Compras, sourcing e gestão de contratos",fora:true,edital:"não consta por nome, mas a finalidade da ênfase inclui \"fiscalização técnica e administrativa dos contratos de bens e serviços\"",
alerta:"Complemento. A parte de conceitos (Kraljic, TCO) é da literatura; a parte de contratos usa o texto conferido da Lei 13.303. Atribuições de gestor e fiscal de contrato seguem o regulamento interno da Transpetro, que não foi lido.",
intro:"O edital descreve a atuação da ênfase como comercialização, marketing, logística e fiscalização técnica e administrativa de contratos. Este módulo conecta compras estratégicas e gestão de contratos.",
obj:["Descrever o ciclo de compras.","Aplicar a matriz de Kraljic.","Explicar custo total de propriedade (TCO) e opções de sourcing.","Reconhecer as regras de execução, alteração e responsabilização em contratos da Lei 13.303."],
secs:[
["1. Ciclo de compras e sourcing","<p>Necessidade e especificação → pesquisa e qualificação de fornecedores → cotação ou licitação → negociação → contrato ou pedido → recebimento → pagamento → avaliação do fornecedor. Decisões de <b>make or buy</b> (fazer ou comprar), <b>sourcing único, duplo ou múltiplo</b> e avaliação de desempenho (prazo, qualidade, preço, serviço). <b>Custo total de propriedade (TCO)</b> soma ao preço de compra os custos de aquisição, uso, manutenção, riscos e descarte ao longo do ciclo de vida. A Lei 13.303 valoriza o ciclo de vida do objeto (art. 31) e a maior vantagem competitiva considerando custos diretos e indiretos (art. 32, II).</p>","CHOPRA; MEINDL; MONCZKA, R. et al., <i>Purchasing and Supply Chain Management</i>; Lei 13.303/2016, arts. 31 e 32."],
["2. Matriz de Kraljic","<table><tr><th></th><th>Baixo risco de suprimento</th><th>Alto risco de suprimento</th></tr><tr><th>Alto impacto no resultado</th><td><b>Alavancagem</b>: explorar poder de compra, concorrência entre fornecedores</td><td><b>Estratégicos</b>: parcerias e contratos de longo prazo</td></tr><tr><th>Baixo impacto</th><td><b>Não críticos (rotina)</b>: simplificar, padronizar, automatizar</td><td><b>Gargalo</b>: garantir suprimento, estoques, fontes alternativas</td></tr></table>","KRALJIC, P. \"Purchasing Must Become Supply Management\", <i>Harvard Business Review</i>, 1983."],
["3. Execução do contrato na Lei 13.303","<ul><li>O contratado <b>repara os vícios</b> às suas expensas e responde por danos independentemente de culpa ou dolo (art. 76). Encargos trabalhistas, fiscais e comerciais são dele; a inadimplência <b>não transfere</b> responsabilidade à estatal (art. 77).</li><li><b>Subcontratação</b> só até o limite admitido no edital, com qualificação técnica da subcontratada (art. 78).</li><li>O contratado deve manter as condições de habilitação durante a execução (art. 69, IX).</li><li>Alterações <b>por acordo</b> (art. 72), até 25% ou 50% conforme o caso (art. 81, §1º); <b>reajuste</b> por apostila (art. 81, §7º); vedado aditivo por evento alocado ao contratado na <b>matriz de riscos</b> (art. 81, §8º).</li><li>Fiscalização e recebimento do objeto são matéria do <b>regulamento interno</b> (art. 40, VII e IX).</li><li>Descumprimento: advertência, multa e suspensão até 2 anos, com defesa prévia (arts. 82 e 83).</li></ul>","Lei 13.303/2016, arts. 40, 69, 72, 76 a 78, 81 a 83 (texto conferido)."],
["4. Fiscalização técnica e administrativa (conceitos)","<p>De modo geral: a fiscalização <b>técnica</b> verifica se o objeto atende às especificações, aos prazos e à qualidade (medições, testes, recebimento); a <b>administrativa</b> acompanha aspectos documentais e financeiros (habilitação mantida, garantias, prazos contratuais, reajustes, encargos, pagamentos e sanções). Registros formais, indicadores e níveis de serviço (SLA) sustentam medições e eventual aplicação de penalidades. A definição exata de papéis (gestor, fiscal) é do regulamento da empresa.</p>","Conceito geral de gestão de contratos; regulamento interno da empresa (não lido)."]
],
mapa:`COMPRAS E CONTRATOS
├── Ciclo de compras | make or buy | sourcing | TCO
├── Kraljic: alavancagem | estratégicos | gargalo | rotina
└── Contrato (Lei 13.303): vícios (art. 76) | encargos (art. 77) | subcontratação (art. 78)
    ├── alteração por acordo (25%/50%) | matriz de riscos: sem aditivo p/ risco do contratado
    └── sanções (arts. 82-83) | fiscalização e recebimento: regulamento (art. 40)`,
q:[
Q("Na matriz de Kraljic, os itens de alto impacto no resultado e baixo risco de suprimento, para os quais se recomenda explorar o poder de compra e a concorrência entre fornecedores, são os",["estratégicos.","de alavancagem.","gargalo.","não críticos (rotina).","obsoletos."],1,["Estratégicos têm alto impacto e alto risco.","Alavancagem: alto impacto e baixo risco.","Gargalo: baixo impacto e alto risco.","Não críticos: baixo impacto e baixo risco.","Não é categoria da matriz."],"Kraljic (1983)."),
Q("O custo total de propriedade (TCO) de um bem ou serviço corresponde",["apenas ao preço pago ao fornecedor.","ao preço de compra somado aos demais custos ao longo do ciclo de vida, como uso, manutenção, riscos e descarte.","ao custo de armazenagem.","à margem do fornecedor.","ao custo de transporte até a fábrica."],1,["O TCO vai além do preço.","Visão de ciclo de vida.","Armazenagem é apenas um componente.","Margem do fornecedor não define o TCO.","Transporte é apenas um componente."],"Monczka et al.; Lei 13.303/2016, art. 31."),
Q("Segundo o art. 77 da Lei 13.303/2016, a inadimplência do contratado quanto aos encargos trabalhistas, fiscais e comerciais",["transfere automaticamente à empresa estatal a responsabilidade pelo pagamento.","não transfere à estatal a responsabilidade por seu pagamento, nem pode onerar o objeto do contrato.","extingue o contrato de pleno direito.","autoriza a estatal a reter a garantia sem processo.","isenta o contratado de qualquer sanção."],1,["O art. 77, §1º afirma o contrário.","Art. 77, §1º.","A lei não prevê extinção automática.","Multas aplicadas exigem regular processo (art. 82, §2º).","Não isenta de sanção."],"Lei 13.303/2016, art. 77."),
Q("De acordo com a Lei 13.303/2016, é vedada a celebração de aditivos decorrentes de eventos supervenientes",["de qualquer natureza.","alocados, na matriz de riscos, como de responsabilidade da contratada.","que aumentem o preço em menos de 25%.","apenas em contratos com prazo inferior a um ano.","solicitados pelo fiscal do contrato."],1,["A lei admite aditivos em vários casos (art. 81).","Art. 81, §8º.","O percentual não é o critério do §8º.","O prazo não é o critério.","Quem solicita não é o critério."],"Lei 13.303/2016, art. 81, §8º."),
Q("Segundo o art. 78 da Lei 13.303/2016, sobre subcontratação é correto afirmar que",["é livre e sem limites em qualquer contrato.","é possível até o limite admitido pela empresa, previsto no edital, e a subcontratada deve atender às exigências de qualificação técnica relativas ao objeto subcontratado.","é sempre proibida.","pode recair sobre quem elaborou o projeto básico.","dispensa a responsabilidade do contratado."],1,["Há limite previsto no edital.","Art. 78, caput e §1º.","A lei a admite, nos limites do edital.","O art. 78, §2º veda a subcontratação de quem participou da licitação ou do projeto.","O contratado continua responsável (caput: sem prejuízo das responsabilidades)."],"Lei 13.303/2016, art. 78.")
]});

MODS.push({n:16,t:"Comercialização de petróleo e derivados (noções)",fora:true,edital:"decorre da finalidade da ênfase (comercialização, mercados nacional e internacional); sem tópico nomeado no Anexo IV",
alerta:"Complemento. Conteúdo conceitual de mercado, sem citar preços, contratos ou políticas comerciais específicas da Transpetro ou da Petrobras (não consultei fontes sobre elas).",
intro:"Conceitos de mercado para entender como petróleo e derivados são negociados e precificados, e como a cadeia de derivados é organizada no Brasil.",
obj:["Explicar benchmarks e diferenciais de qualidade.","Distinguir mercado spot, contratos de prazo e derivativos.","Descrever a cadeia de derivados no Brasil.","Conectar comercialização a Incoterms, tributos e regulação."],
secs:[
["1. Formação de preço do petróleo","<p>Petróleo é uma <i>commodity</i> negociada com base em <b>benchmarks</b> (referências), como Brent e WTI. O preço de cada carga é o benchmark mais um <b>diferencial</b> (prêmio ou desconto) que reflete qualidade (°API, teor de enxofre), localização e custos logísticos. Em geral, petróleos mais leves (°API alto) e de menor teor de enxofre (doces) tendem a valer mais.</p>","Conceito de mercado (p. ex., THOMAS (org.), <i>Fundamentos de Engenharia de Petróleo</i>)."],
["2. Tipos de mercado e gestão de risco","<ul><li><b>Spot</b>: entrega imediata a preço do dia. <b>Contratos de prazo</b>: volumes e fórmula de preço acordados para um período.</li><li><b>Mercado futuro e derivativos</b> (futuros, opções, swaps) permitem <b>hedge</b>: reduzir a exposição a variações de preço. <b>Contango</b>: preços futuros acima do spot; <b>backwardation</b>: abaixo.</li><li>Termos comerciais (FOB, CFR, CIF) definem quem contrata frete e seguro e onde passa o risco (módulo 13).</li></ul>","Conceitos de mercado de commodities."],
["3. Derivados e margem de refino","<p>O preço dos derivados acompanha o do petróleo e o das condições de oferta e demanda de cada produto. O <b>crack spread</b> (ou margem de refino) é a diferença entre o valor dos derivados obtidos e o custo do petróleo processado. O preço na bomba inclui custos de refino ou importação, logística, distribuição e revenda, biocombustível adicionado e <b>tributos</b> (ICMS, PIS/COFINS, CIDE, módulo 6).</p>","Conceitos de mercado; módulo 6."],
["4. Cadeia no Brasil e regulação","<p>Produção e refino (ou importação) → <b>distribuição</b> (atacado, Lei 9.478, art. 6º, XX) → <b>revenda</b> (varejo, art. 6º, XXI). A política energética busca proteger o consumidor quanto a preço, qualidade e oferta e promover a <b>livre concorrência</b> (art. 1º); a ANP regula e fiscaliza. A Transpetro atua na movimentação e armazenagem (dutos, terminais, navios), sujeita às regras de acesso de terceiros (módulo 4). A <b>comercialização</b> direta de produtos relacionados ao objeto social não se submete ao capítulo de licitações da Lei 13.303 (art. 28, §3º, I).</p>","Lei 9.478/1997, arts. 1º e 6º; Lei 13.303/2016, art. 28, §3º (textos conferidos)."]
],
mapa:`COMERCIALIZAÇÃO
├── Benchmark (Brent, WTI) ± diferencial (qualidade, local, logística)
├── Spot × contratos de prazo × derivativos (hedge); contango × backwardation
├── Derivados: crack spread; tributos na formação de preço
└── Brasil: refino/importação → distribuição (atacado) → revenda (varejo); ANP`,
q:[
Q("Na comercialização internacional de petróleo, o preço de uma carga é frequentemente fixado como",["valor único e imutável, independente do mercado.","o preço de um benchmark (por exemplo, Brent) acrescido de um diferencial que reflete qualidade, localização e logística.","o custo de extração acrescido de margem fixa.","o preço do derivado mais vendido.","o preço da menor cotação no varejo."],1,["Preços seguem referências de mercado.","Benchmark mais diferencial.","O preço de mercado não se baseia só em custo de extração.","O derivado não é a base de preço do petróleo bruto.","O varejo não referencia o preço do petróleo."],"Conceito de mercado."),
Q("Em geral, um petróleo com maior grau API e menor teor de enxofre tende a",["ter menor valor de mercado.","ter maior valor de mercado, por render mais derivados nobres e exigir menos tratamento.","ser impossível de refinar.","ser classificado como pesado e azedo.","ter o mesmo valor de qualquer outro."],1,["Tende a ser mais valorizado.","Petróleo leve e doce é, em geral, mais valorizado.","É refinável.","Leve e doce é o oposto de pesado e azedo.","Qualidade influencia o diferencial de preço."],"Thomas (org.)."),
Q("Segundo a Lei 9.478/1997, a atividade de venda a varejo de combustíveis, lubrificantes e GLP envasado, exercida por postos de serviços ou revendedores, denomina-se",["distribuição.","revenda.","transferência.","estocagem.","refino."],1,["Distribuição é o atacado.","Art. 6º, XXI.","Transferência é movimentação de interesse exclusivo.","Estocagem é armazenamento.","Refino é atividade industrial."],"Lei 9.478/1997, art. 6º, XX e XXI."),
Q("Um agente utiliza contratos de mercado futuro para reduzir sua exposição às variações do preço do petróleo. Essa operação é conhecida como",["arbitragem cambial.","hedge.","alavancagem operacional.","contango.","dumping."],1,["Arbitragem busca lucro com diferença de preços.","Hedge é a proteção contra variação de preços.","Alavancagem operacional relaciona custos fixos e resultado.","Contango é uma estrutura de preços futuros acima do spot.","Dumping é venda abaixo do custo para excluir concorrentes."],"Conceitos de mercado de commodities."),
Q("A diferença entre o valor dos derivados obtidos e o custo do petróleo processado, usada como indicador de margem de refino, é chamada de",["crack spread.","contango.","royalty.","ship-or-pay.","laytime."],0,["Margem de refino.","Contango é a estrutura de preços futuros.","Royalty é participação governamental.","Ship-or-pay é modalidade contratual de terminais.","Laytime é tempo de carga e descarga no afretamento."],"Conceitos de mercado.")
]});

MODS.push({n:17,t:"Qualidade (ISO 9001), integridade e Lei Anticorrupção",fora:true,edital:"a finalidade da ênfase cita \"normas e procedimentos técnicos, de qualidade, segurança, meio ambiente e saúde\"",
alerta:"Complemento fora do Anexo IV. Conferidos nos textos enviados: ABNT NBR ISO 9001:2015, Lei 12.846/2013 e Lei 13.303 (art. 9º). ISO 14001, ISO 45001, hierarquia de controles e licenciamento ambiental vêm de conhecimento prévio: confira.",
intro:"A finalidade da ênfase exige atuar em conformidade com normas de qualidade, segurança, meio ambiente e saúde (QSMS). Este módulo cobre a ISO 9001:2015 e o tema de integridade nas estatais (Lei 13.303, art. 9º, e Lei 12.846/2013).",
obj:["Descrever os princípios, o PDCA e a estrutura da ISO 9001:2015.","Aplicar o controle de provedores externos (8.4) a suprimentos.","Distinguir ISO 9001, 14001 e 45001.","Identificar atos lesivos, sanções e o acordo de leniência da Lei 12.846/2013.","Reconhecer as exigências de integridade da Lei 13.303."],
secs:[
["1. ABNT NBR ISO 9001:2015: fundamentos","<p>Norma de <b>sistemas de gestão da qualidade — requisitos</b> (3ª edição brasileira, 2015). Baseia-se em <b>sete princípios</b> de gestão da qualidade: <b>foco no cliente</b>, <b>liderança</b>, <b>engajamento das pessoas</b>, <b>abordagem de processo</b>, <b>melhoria</b>, <b>tomada de decisão baseada em evidência</b> e <b>gestão de relacionamento</b>.</p><ul><li><b>Abordagem de processo</b>: definição e gestão sistemáticas de processos e suas interações para alcançar os resultados pretendidos, conforme a política da qualidade e o direcionamento estratégico. Combina o ciclo PDCA com a <b>mentalidade de risco</b>.</li><li><b>PDCA</b>: <b>Plan</b> (estabelecer objetivos do sistema e processos e os recursos necessários); <b>Do</b> (implementar o planejado); <b>Check</b> (monitorar e, quando aplicável, medir processos, produtos e serviços em relação a políticas, objetivos e requisitos, e reportar); <b>Act</b> (agir para melhorar o desempenho).</li><li><b>Mentalidade de risco</b>: a organização deve planejar e implementar ações para abordar <b>riscos e oportunidades</b>. Risco é o efeito da incerteza, que pode ser positivo ou negativo.</li></ul>","ABNT NBR ISO 9001:2015, itens 0.2, 0.3 e 0.3.3 (texto conferido)."],
["2. Estrutura da ISO 9001:2015 (seções 4 a 10)","<table><tr><th>Seção</th><th>Tema</th><th>Fase do PDCA (Figura 2 da norma)</th></tr><tr><td>4</td><td>Contexto da organização (contexto, partes interessadas, escopo, sistema e processos)</td><td>Base do sistema</td></tr><tr><td>5</td><td>Liderança (comprometimento, foco no cliente, política, papéis e responsabilidades)</td><td>Suporte à gestão</td></tr><tr><td>6</td><td>Planejamento (riscos e oportunidades, objetivos da qualidade, planejamento de mudanças)</td><td>Plan</td></tr><tr><td>7</td><td>Apoio (recursos, competência, conscientização, comunicação, informação documentada)</td><td>Plan/Do</td></tr><tr><td>8</td><td>Operação</td><td>Do</td></tr><tr><td>9</td><td>Avaliação de desempenho (monitoramento e medição, satisfação do cliente, auditoria interna, análise crítica pela direção)</td><td>Check</td></tr><tr><td>10</td><td>Melhoria (não conformidade e ação corretiva, melhoria contínua)</td><td>Act</td></tr></table><p>Na Figura 2 da norma, o SGQ (4) contém Liderança (5), Planejamento (6), Apoio (7) e Operação (8), Avaliação de desempenho (9) e Melhoria (10), agrupados em Planejar, Fazer, Checar e Agir.</p>","ABNT NBR ISO 9001:2015, sumário e Figura 2."],
["3. Itens de maior interesse para suprimentos","<ul><li><b>8.4 Controle de processos, produtos e serviços providos externamente</b>: a organização deve assegurar a conformidade com os requisitos e determinar os controles quando os produtos ou serviços externos forem incorporados aos seus, providos diretamente ao cliente em seu nome, ou quando um processo (ou parte dele) for provido externamente por decisão da organização. Deve <b>determinar e aplicar critérios para avaliação, seleção, monitoramento de desempenho e reavaliação</b> de provedores externos e reter informação documentada. A organização define os controles sobre o provedor e sobre as saídas (8.4.2) e informa os requisitos ao provedor (8.4.3).</li><li><b>9.2 Auditoria interna</b>: a intervalos planejados, para informar se o SGQ está conforme (com requisitos próprios e da norma) e eficazmente implementado e mantido; programa de auditoria; auditores objetivos e imparciais.</li><li><b>9.3 Análise crítica pela direção</b>: a Alta Direção analisa o SGQ a intervalos planejados.</li><li><b>10.2 Não conformidade e ação corretiva</b>: reagir (controlar, corrigir, lidar com as consequências), avaliar a necessidade de eliminar a causa, implementar ação, <b>analisar criticamente a eficácia</b> e reter informação documentada. Ações corretivas devem ser apropriadas aos efeitos.</li><li><b>10.3 Melhoria contínua</b> da adequação, suficiência e eficácia do SGQ.</li></ul>","ABNT NBR ISO 9001:2015, itens 8.4, 9.2, 9.3, 10.2 e 10.3 (texto conferido)."],
["4. Outras normas e SMS (conhecimento prévio)","<ul><li><b>ISO 14001</b>: gestão ambiental. <b>ISO 45001</b>: gestão de saúde e segurança ocupacional. A ISO 9001:2015 adota a estrutura comum das normas de sistemas de gestão, o que facilita integrar os sistemas (item 0.4).</li><li><b>Hierarquia de controles</b> de riscos ocupacionais, do mais para o menos eficaz: eliminação; substituição; controles de engenharia; controles administrativos; EPI.</li><li><b>Licenciamento ambiental</b>: licença prévia (localização e concepção), de instalação (construção) e de operação (funcionamento).</li></ul>","ISO 14001; ISO 45001; Resolução CONAMA 237/1997 (não conferidas)."],
["5. Integridade nas estatais (Lei 13.303, art. 9º)","<p>As estatais adotam regras de gestão de riscos e controle interno: ação cotidiana de administradores e empregados, área de conformidade e gestão de riscos, auditoria interna e Comitê de Auditoria Estatutário. Devem elaborar e divulgar <b>Código de Conduta e Integridade</b> com: princípios e valores, prevenção de conflito de interesses e vedação a corrupção e fraude; instâncias responsáveis; <b>canal de denúncias</b> (internas e externas); mecanismos contra <b>retaliação</b>; sanções; e <b>treinamento periódico, no mínimo anual</b>. A área de conformidade e riscos é vinculada ao diretor-presidente e liderada por diretor estatutário (§2º). A auditoria interna é vinculada ao Conselho de Administração, diretamente ou pelo Comitê de Auditoria (§3º).</p>","Lei 13.303/2016, art. 9º (texto conferido)."],
["6. Lei Anticorrupção (Lei 12.846/2013)","<ul><li><b>Objeto</b> (art. 1º): responsabilização <b>objetiva</b>, administrativa e civil, de pessoas jurídicas por atos contra a administração pública, nacional ou estrangeira. Abrange sociedades empresárias e simples, personificadas ou não, fundações, associações e sociedades estrangeiras com sede, filial ou representação no Brasil. A responsabilidade é por atos praticados <b>em seu interesse ou benefício, exclusivo ou não</b> (art. 2º) e não exclui a de dirigentes e pessoas naturais (art. 3º). Subsiste em caso de alteração contratual, fusão, incorporação e cisão (art. 4º).</li><li><b>Atos lesivos</b> (art. 5º): prometer, oferecer ou dar vantagem indevida a agente público; financiar ou subvencionar os atos ilícitos; usar interposta pessoa para ocultar interesses; em licitações e contratos, frustrar ou fraudar o caráter competitivo, impedir ou perturbar atos, afastar licitante, fraudar licitação ou contrato, criar pessoa jurídica de modo fraudulento, obter vantagem indevida em modificações ou prorrogações de contratos e manipular o equilíbrio econômico-financeiro; dificultar investigação ou fiscalização.</li><li><b>Sanções administrativas</b> (art. 6º): <b>multa</b> de 0,1% a 20% do faturamento bruto do último exercício anterior ao da instauração do processo, excluídos os tributos, que nunca será inferior à vantagem auferida quando estimável; e <b>publicação extraordinária</b> da decisão. Sem base de faturamento, multa de R$ 6 mil a R$ 60 milhões (§4º). A reparação integral do dano não é excluída (§3º). Na dosimetria considera-se, entre outros, a <b>existência de mecanismos internos de integridade</b>, auditoria e incentivo à denúncia e a aplicação efetiva de códigos de ética (art. 7º, VIII).</li><li><b>Processo</b>: cabe à autoridade máxima do órgão; comissão de 2 ou mais servidores estáveis conclui em <b>180 dias</b> (prorrogáveis); defesa em <b>30 dias</b> (arts. 8º a 11). A CGU tem competência concorrente no Executivo federal e competência sobre atos contra a administração pública estrangeira (arts. 8º, §2º, e 9º).</li><li><b>Acordo de leniência</b> (art. 16): a pessoa jurídica deve ser a primeira a se manifestar, cessar o envolvimento, admitir a participação e cooperar; isenta da publicação extraordinária e da proibição de receber incentivos e <b>reduz em até 2/3</b> a multa, sem eximir da reparação do dano. Descumprindo, fica impedida de novo acordo por 3 anos.</li><li><b>Responsabilização judicial</b> (art. 19): perdimento de bens, suspensão ou interdição parcial, dissolução compulsória e proibição de receber incentivos, subsídios ou empréstimos públicos por <b>1 a 5 anos</b>.</li><li><b>Cadastros</b>: CNEP (empresas punidas, art. 22) e CEIS (inidôneas e suspensas, art. 23). <b>Prescrição</b> em <b>5 anos</b> (art. 25).</li></ul><p>A Lei 13.303 cita o cadastro de empresas inidôneas dessa lei (art. 37). O texto consultado remete ao Decreto 11.129/2022 e traz dispositivos com vigência encerrada: confira a redação vigente.</p>","Lei 12.846/2013 (texto conferido no arquivo enviado); Lei 13.303/2016, art. 37."]
],
mapa:`QUALIDADE E INTEGRIDADE
├── ISO 9001:2015: 7 princípios; processo + PDCA + risco
│   ├── Seções 4-10; PDCA: Plan(6,7) Do(8) Check(9) Act(10)
│   └── 8.4 provedores externos: avaliar, selecionar, monitorar, reavaliar
├── ISO 14001 (ambiental) | ISO 45001 (SSO) | hierarquia de controles
├── Lei 13.303 art. 9º: código de conduta, canal de denúncias, treinamento anual
└── Lei 12.846/2013: responsabilidade objetiva; multa 0,1%-20% do faturamento
    ├── atos lesivos (art. 5º) | processo: 180 dias, defesa 30 dias
    └── leniência: até 2/3 da multa | prescrição 5 anos | CNEP e CEIS`,
q:[
Q("Um dos sete princípios de gestão da qualidade em que se baseia a ABNT NBR ISO 9001:2015 é",["a verticalização da produção.","a tomada de decisão baseada em evidência.","a redução obrigatória de estoques.","a terceirização integral.","o benchmarking competitivo."],1,["Não é princípio da norma.","Princípios: foco no cliente, liderança, engajamento das pessoas, abordagem de processo, melhoria, tomada de decisão baseada em evidência e gestão de relacionamento.","Não é princípio da norma.","Não é princípio da norma.","Não é princípio da norma."],"ABNT NBR ISO 9001:2015, item 0.2."),
Q("No ciclo PDCA descrito na ABNT NBR ISO 9001:2015, a etapa Check consiste em",["estabelecer objetivos e recursos necessários.","implementar o que foi planejado.","monitorar e, onde aplicável, medir processos, produtos e serviços em relação a políticas, objetivos e requisitos, e reportar os resultados.","executar ações para melhorar o desempenho.","documentar a política da qualidade."],2,["Descreve Plan.","Descreve Do.","Descrição de Check (item 0.3.2).","Descreve Act.","Não define a etapa Check."],"ABNT NBR ISO 9001:2015, item 0.3.2."),
Q("Segundo o item 8.4 da ABNT NBR ISO 9001:2015, quanto a provedores externos, a organização deve",["aceitar qualquer provedor sem critérios.","determinar e aplicar critérios para avaliação, seleção, monitoramento de desempenho e reavaliação de provedores externos, retendo informação documentada.","transferir integralmente a responsabilidade pela qualidade ao provedor.","avaliar provedores apenas na contratação inicial.","evitar informar requisitos aos provedores."],1,["A norma exige critérios.","Item 8.4.1.","Os processos providos externamente permanecem sob o controle do SGQ (8.4.2).","A norma inclui monitoramento e reavaliação.","A organização informa requisitos aos provedores (8.4.3)."],"ABNT NBR ISO 9001:2015, item 8.4."),
Q("De acordo com o art. 6º da Lei 12.846/2013, a multa administrativa aplicável à pessoa jurídica é de",["1% a 5% do lucro líquido.","0,1% a 20% do faturamento bruto do último exercício anterior ao da instauração do processo administrativo, excluídos os tributos, nunca inferior à vantagem auferida quando estimável.","10% fixos do valor do contrato.","R$ 1.000,00 a R$ 10.000,00 em qualquer caso.","até 50% do patrimônio líquido."],1,["Não é o critério legal.","Art. 6º, I.","Não é o critério legal.","Só na falta de base de faturamento a multa é de R$ 6 mil a R$ 60 milhões (§4º).","Não é o critério legal."],"Lei 12.846/2013, art. 6º."),
Q("A responsabilidade da pessoa jurídica prevista na Lei 12.846/2013 é",["subjetiva, exigindo prova de dolo ou culpa.","objetiva, nas esferas administrativa e civil.","exclusivamente penal.","restrita a pessoas físicas.","aplicável somente a empresas estrangeiras."],1,["Art. 1º e 2º: responsabilização objetiva.","Art. 1º: responsabilização objetiva administrativa e civil.","A lei não trata de responsabilização penal da pessoa jurídica.","A lei trata de pessoas jurídicas, sem excluir a responsabilidade individual (art. 3º).","Alcança pessoas jurídicas nacionais e estrangeiras com sede, filial ou representação no Brasil."],"Lei 12.846/2013, arts. 1º a 3º."),
Q("Segundo a Lei 12.846/2013, a celebração de acordo de leniência",["exime a pessoa jurídica de reparar o dano.","reduz em até 2/3 o valor da multa e isenta a pessoa jurídica da publicação extraordinária da decisão, sem eximi-la da reparação integral do dano.","é possível a qualquer momento, sem requisitos.","extingue a responsabilidade individual dos dirigentes.","independe de a pessoa jurídica cessar o envolvimento na infração."],1,["O art. 16, §3º afirma o contrário.","Art. 16, §2º e §3º.","Há requisitos cumulativos (art. 16, §1º), como ser a primeira a se manifestar e cessar o envolvimento.","O acordo não extingue a responsabilidade individual (art. 3º).","Cessar completamente o envolvimento é requisito (art. 16, §1º, II)."],"Lei 12.846/2013, art. 16."),
Q("Prescrevem, segundo a Lei 12.846/2013, as infrações nela previstas em",["1 ano.","2 anos.","5 anos, contados da data da ciência da infração ou, se permanente ou continuada, do dia em que cessou.","10 anos.","não prescrevem."],2,["Não é o prazo legal.","Não é o prazo legal.","Art. 25.","Não é o prazo legal.","Há prazo prescricional."],"Lei 12.846/2013, art. 25."),
Q("Segundo o art. 9º da Lei 13.303/2016, o Código de Conduta e Integridade das empresas estatais deve prever, entre outros elementos,",["apenas princípios e missão da empresa.","canal de denúncias, proteção contra retaliação, sanções e treinamento periódico, no mínimo anual.","a dispensa de auditoria interna.","a vedação de canal externo de denúncias.","a subordinação da área de conformidade ao Conselho Fiscal."],1,["Há outros elementos obrigatórios.","Art. 9º, §1º, III a VI.","A auditoria interna é obrigatória (art. 9º, III).","O canal deve receber denúncias internas e externas.","A área é vinculada ao diretor-presidente (art. 9º, §2º)."],"Lei 13.303/2016, art. 9º.")
]});

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudos Transpetro Ênfase 9</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#5b6675;--bd:#dde2e8;--ac:#0b6b4f;--acbg:#e3f3ed;--ok:#137a3a;--okbg:#e4f5ea;--er:#b3261e;--erbg:#fbe9e7;--warn:#8a5a00;--warnbg:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--tx:#e6eaf0;--mut:#9aa6b6;--bd:#2c3542;--ac:#4cc79b;--acbg:#173428;--ok:#5fd68a;--okbg:#153223;--er:#ff8a80;--erbg:#3a1e1c;--warn:#f2c265;--warnbg:#3a2e12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:18px 16px}
@media (prefers-color-scheme:dark){header{color:#0b1f17}}
header h1{margin:0;font-size:1.25rem}header p{margin:4px 0 0;opacity:.9;font-size:.88rem}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:5}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding:8px 16px}
nav a{color:var(--mut);padding:8px 12px;border-radius:8px;text-decoration:none;white-space:nowrap}
nav a.on{background:var(--acbg);color:var(--ac);font-weight:600}
main{padding:12px 0 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin:14px 0}
h2{font-size:1.3rem;margin:22px 0 8px}h3{font-size:1.05rem;margin:0 0 6px}
.src{font-size:.85rem;color:var(--mut);border-left:3px solid var(--bd);padding-left:10px;margin-top:8px}
.alert{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:.93rem}
table{border-collapse:collapse;width:100%;font-size:.92rem;display:block;overflow-x:auto}th,td{border:1px solid var(--bd);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--acbg)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;overflow-x:auto;font-size:.85rem;line-height:1.45}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:.9em}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--acbg);color:var(--ac);vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.mod:hover{border-color:var(--ac)}.mod b{display:block}.mod small{color:var(--mut)}
.q{margin:16px 0}.q p.en{font-weight:600}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input{margin-top:5px}.opt.sel{border-color:var(--ac);background:var(--acbg)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:700}.opt.miss{border-color:var(--warn);background:var(--warnbg)}.opt.miss::after{content:"✕";margin-left:auto;color:var(--warn);font-weight:700}.verdict{font-weight:700;margin:6px 0}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--warn)}
.cm{font-size:.9rem;margin:2px 0 6px 28px;color:var(--mut)}.cm b{color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
@media (prefers-color-scheme:dark){.btn{color:#0b1f17}}
.btn.sec{background:none;color:var(--ac);border:1px solid var(--ac)}
.res{font-weight:700;font-size:1.1rem;margin:12px 0}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
li{margin:3px 0}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}

<header><div class="wrap"><h1>Estudos Transpetro: Ênfase 9, Comércio e Suprimentos</h1>
<p>Edital TRANSPETRO/PSP/TERRA Nível Superior 2026.4 · Banca: Fundação Cesgranrio</p></div></header>

<main class="wrap"></main>
<script>
const EDITAL=`<h2>O que o edital diz (conferido no PDF)</h2>
<div class="card"><table>
<tr><th>Banca</th><td>Fundação Cesgranrio</td></tr>
<tr><th>Prova objetiva</th><td>70 questões de 1 ponto, com 5 alternativas (A a E) e uma única correta: <b>50 de Conhecimentos Específicos</b> (Fase 1) e <b>20 de Conhecimentos Gerais</b> (Fase 2: 10 de Língua Portuguesa e 10 de Língua Inglesa).</td></tr>
<tr><th>Eliminação</th><td>Aproveitamento inferior a 50% em Específicos, ou inferior a 50% em Gerais, ou nota zero em qualquer matéria de Gerais (item 7.1.4.3).</td></tr>
<tr><th>Classificação</th><td>Passam à Fase 2 os mais bem colocados em Específicos, até 2 vezes o número de vagas mais cadastro de reserva. A ordenação final usa a soma das notas das duas fases (itens 7.1.2 e 7.1.4).</td></tr>
<tr><th>Local</th><td>Rio de Janeiro</td></tr>
<tr><th>Finalidade da ênfase</th><td>Atuar em comercialização, marketing e logística dos produtos e serviços da companhia (mercados nacional e internacional) e executar a fiscalização técnica e administrativa dos contratos de bens e serviços.</td></tr>
<tr><th>Formação exigida</th><td>Bacharelado em Administração, Ciências Contábeis, Comércio Exterior, Economia, Engenharia, Estatística, Física, Química, Marketing, Matemática ou Relações Internacionais, com registro no conselho de classe.</td></tr>
</table><p class="src">Fonte: Edital TRANSPETRO/PSP/TERRA Nível Superior 2026.4, itens 1.9, 7.1 e Anexo IV.</p></div>
<h2>Conteúdo programático oficial da Ênfase 9 (Anexo IV) e onde estudar</h2>
<div class="card"><table>
<tr><th>Item do edital</th><th>Módulo</th></tr>
<tr><td>Noções elementares de marketing e logística</td><td><a href="#m1">1</a></td></tr>
<tr><td>Principais características do petróleo e derivados (GLP, gasolina, diesel); gás natural; biocombustíveis</td><td><a href="#m2">2</a></td></tr>
<tr><td>Serviços de apoio portuário e agentes marítimos; mercado mundial de afretamentos; portos e terminais; transporte marítimo de granéis líquidos; navegação regular e livre; avarias marítimas</td><td><a href="#m3">3</a></td></tr>
<tr><td>Transporte dutoviário; Lei 9.478/1997 e alterações; "Portaria" ANP nº 881/2022 (o ato com esse número é a Resolução ANP nº 881/2022)</td><td><a href="#m4">4</a></td></tr>
<tr><td>Contratação: Lei 13.303/2016, arts. 28 a 91; LC 123/2006, arts. 42 a 49; LC 147/2014</td><td><a href="#m5">5</a></td></tr>
<tr><td>Tributos: IRPJ e CSLL, IRRF, ICMS, participações governamentais, PIS/PASEP, COFINS, CIDE (Leis 10.336/2001 e 10.636/2002), ISS, contribuição previdenciária, EC 132/2023, LC 214/2025</td><td><a href="#m6">6</a></td></tr>
<tr><td>Matemática financeira; métodos de avaliação econômica; VPL e TIR</td><td><a href="#m7">7</a></td></tr>
<tr><td>Noções elementares de micro e macroeconomia</td><td><a href="#m8">8</a></td></tr>
<tr><td>Lógica; conjuntos; relações; funções; logaritmos; trigonometria; cálculo vetorial e matricial; progressões; sistemas de numeração</td><td><a href="#m9">9</a></td></tr>
<tr><td>Análise combinatória; probabilidade; estatística descritiva</td><td><a href="#m10">10</a></td></tr>
<tr><td>Relações entre volume, pressão e temperatura; termologia; sistemas de unidades; conversões</td><td><a href="#m11">11</a></td></tr>
</table></div>
<h2>Complementos fora do Anexo IV</h2>
<div class="card"><table>
<tr><th>Assunto</th><th>Módulo</th><th>Por que entrou</th></tr>
<tr><td>Gestão de estoques</td><td><a href="#m12">12</a></td><td>Pode aparecer em "noções de logística"</td></tr>
<tr><td>Incoterms 2020</td><td><a href="#m13">13</a></td><td>Comercialização e mercado internacional (finalidade da ênfase)</td></tr>
<tr><td>Negociação</td><td><a href="#m14">14</a></td><td>Comercialização, compras e contratos</td></tr>
<tr><td>Compras, sourcing e gestão de contratos</td><td><a href="#m15">15</a></td><td>Finalidade da ênfase: fiscalização técnica e administrativa de contratos</td></tr>
<tr><td>Comercialização de petróleo e derivados</td><td><a href="#m16">16</a></td><td>Finalidade da ênfase: comercialização nos mercados nacional e internacional</td></tr>
<tr><td>Qualidade (ISO 9001), integridade e Lei Anticorrupção</td><td><a href="#m17">17</a></td><td>Finalidade da ênfase cita QSMS</td></tr>
</table></div>
<div class="alert"><b>Sobre os complementos:</b> não constam por nome no Anexo IV e o edital não informa pesos nem profundidade. Estudar primeiro os módulos 1 a 11 é o mais seguro. Os complementos reduzem o risco de surpresa em questões amplas de logística e comercialização, mas não são garantia de que caiam.</div>
<div class="alert"><b>Fontes:</b> a Lei 13.303 (arts. 28 a 91), a Lei 9.478 e a Resolução ANP 881/2022 foram conferidas no texto oficial enviado. Tributos, LC 123/2006, Incoterms e demais conteúdos vêm de conhecimento prévio: confira na aba Fontes. Língua Portuguesa e Inglesa (Conhecimentos Gerais) não fazem parte desta plataforma.</div>`;

const Q=(e,o,a,c,f)=>({e,o,a,c,f});
const MODS=[];
const L="ABCDE";
const $=s=>document.querySelector(s);
const store={get(k){try{return JSON.parse(localStorage.getItem("tp-"+k))}catch(e){return null}},set(k,v){try{localStorage.setItem("tp-"+k,JSON.stringify(v))}catch(e){}}};
const mods=()=>MODS.slice().sort((a,b)=>a.n-b.n);

function quiz(host,qs,key){
  let marc=[];
  host.innerHTML=`<div class="qs"></div><p><button class="btn" data-a="ok">Ver resultado</button> <button class="btn sec" data-a="re">Refazer</button></p><div class="res" aria-live="polite"></div>`;
  const box=host.querySelector(".qs"),res=host.querySelector(".res");
  function draw(){
    marc=qs.map(()=>-1);res.textContent="";
    box.innerHTML=qs.map((q,i)=>`<div class="q card"><p class="en">Questão ${i+1}${q.m?` <span class="tag">${q.m}</span>`:""}. ${q.e}</p>`+
      q.o.map((t,j)=>`<label class="opt"><input type="radio" name="${key}q${i}" value="${j}"><span><b>(${L[j]})</b> ${t}</span></label>`).join("")+`<div class="fb"></div></div>`).join("");
  }
  function finish(){
    const ac=qs.filter((q,i)=>marc[i]===q.a).length;
    const un=marc.filter(m=>m<0).length;
    res.textContent=`Resultado: ${ac} de ${qs.length} (${Math.round(100*ac/qs.length)}%)`+(un?` · ${un} sem resposta`:"");
    const p=store.get("prog")||{};p[key]={ac,n:qs.length};store.set("prog",p);
  }
  box.addEventListener("change",e=>{
    if(e.target.type!=="radio")return;
    const b=e.target.closest(".q"),i=[...box.children].indexOf(b),q=qs[i],j=+e.target.value;
    if(marc[i]>=0)return;
    marc[i]=j;
    b.querySelectorAll(".opt").forEach((o,k)=>{o.querySelector("input").disabled=true;
      if(k===q.a)o.classList.add("right");else if(k===j)o.classList.add("miss")});
    b.querySelector(".fb").innerHTML=`<p class="verdict ${j===q.a?"ok":"no"}">${j===q.a?"✓ Certo!":`✕ Errado. A resposta correta é a (${L[q.a]}).`}</p><details open><summary>Gabarito comentado: ${L[q.a]}</summary>`+
      q.c.map((t,k)=>`<div class="cm"><b>(${L[k]}) ${k===q.a?"certa":"errada"}:</b> ${t}</div>`).join("")+
      (q.f?`<div class="cm"><b>Fonte:</b> ${q.f}</div>`:"")+`</details>`;
    if(marc.every(m=>m>=0))finish();
  });
  host.addEventListener("click",e=>{
    const a=e.target.dataset.a;if(!a)return;
    if(a==="re")return draw();
    finish();
  });
  draw();
}

const views={
  edital:()=>EDITAL,
  modulos(){
    const p=store.get("prog")||{};
    const card=m=>{const r=p["m"+m.n];
      return `<a class="mod" href="#m${m.n}"><b>${m.n}. ${m.t}</b><small>${m.edital}</small><br><span class="tag">${r?`última nota: ${r.ac}/${r.n}`:"não feito"}</span></a>`};
    return `<h2>Conteúdo do edital (Anexo IV)</h2><div class="grid">`+mods().filter(m=>!m.fora).map(card).join("")+`</div>
      <h2>Complementos fora do Anexo IV</h2><p class="src">Assuntos úteis para a atuação na área, mas que não constam por nome no edital da Ênfase 9. Estude depois do conteúdo oficial.</p><div class="grid">`+mods().filter(m=>m.fora).map(card).join("")+`</div>
      <p class="src">A ordem segue a dependência entre assuntos, não o peso na prova (o edital não informa pesos por assunto).</p>`;
  },
  modulo(n){
    const list=mods(),m=list.find(x=>x.n===n);if(!m)return "<p>Módulo não encontrado.</p>";
    const i=list.indexOf(m),prev=list[i-1],next=list[i+1];
    return `<p><a href="#modulos">← Módulos</a></p><h2>Módulo ${m.n}: ${m.t}</h2><p><span class="tag">${m.fora?"Complemento fora do Anexo IV":"Edital"}: ${m.edital}</span></p>`+
      (m.alerta?`<div class="alert">${m.alerta}</div>`:"")+
      `<div class="card"><h3>Introdução</h3><p>${m.intro}</p></div>
       <div class="card"><h3>Objetivos de aprendizagem</h3><ul>${m.obj.map(o=>`<li>${o}</li>`).join("")}</ul></div>`+
      m.secs.map(s=>`<div class="card"><h3>${s[0]}</h3>${s[1]}${s[2]?`<p class="src">Fonte: ${s[2]}</p>`:""}</div>`).join("")+
      `<h2>Mapa mental</h2><pre>${m.mapa}</pre><h2>Quiz do módulo <span class="tag">5 questões, padrão Cesgranrio (A a E)</span></h2>
       <div class="alert">Questões autorais e inéditas, não são de provas reais. Ao clicar em uma alternativa, ela fica verde se estiver certa ou amarela se estiver errada (e a certa fica verde), e o gabarito comentado da questão aparece na hora.</div><div id="quizhost"></div>
       <p class="row"><span>${prev?`<a class="btn sec" href="#m${prev.n}">← ${prev.n}. ${prev.t}</a>`:""}</span><span>${next?`<a class="btn sec" href="#m${next.n}">${next.n}. ${next.t} →</a>`:""}</span></p>`;
  },
  simulado:()=>`<h2>Simulado</h2><div class="card"><p>Sorteia questões dos módulos. Escolha:</p>
     <p><button class="btn" data-sim="10">10 do edital</button> <button class="btn" data-sim="25">25 do edital</button> <button class="btn" data-sim="edital">Todas do edital</button> <button class="btn sec" data-sim="todas">Todas (com complementos)</button></p>
     <p class="src">Referência: a prova real tem 50 questões específicas e exige mínimo de 50% de acerto por fase (item 7.1.4.3 do edital).</p></div><div id="quizhost"></div>`,
  fontes(){
    const all=mods().map(m=>`<div class="card"><h3>Módulo ${m.n}: ${m.t}</h3><ul>`+
      [...new Set(m.secs.map(s=>s[2]).filter(Boolean))].map(f=>`<li>${f}</li>`).join("")+`</ul></div>`).join("");
    return `<h2>Fontes e pontos a conferir</h2><div class="alert">Nos módulos 4, 5, 13 e 17 e na parte de CIDE do módulo 6 a teoria foi conferida no texto oficial enviado. Nos demais (principalmente tributos e LC 123) os números vêm de conhecimento prévio: <b>confira no texto vigente antes de decorar</b>.</div>`+all+
      `<div class="card"><h3>Situação das fontes</h3><ul><li><b>Lidas no texto oficial (enviado por você):</b> Lei 13.303/2016 (arts. 28 a 91), Lei 9.478/1997, Resolução ANP nº 881/2022, LC 147/2014, Lei 10.336/2001, Lei 10.636/2002, Lei 12.846/2013, ABNT NBR ISO 9001:2015 e a Tabela-resumo de Incoterms 2020 do Siscomex.</li><li><b>Não lidas (conhecimento prévio, conferir):</b> LC 123/2006 (arts. 42, 44 a 46 e 49, I a III), LC 214/2025, EC 132/2023, demais normas tributárias, ISO 14001/45001, texto da ICC dos Incoterms (nível de seguro ICC A/C e conhecimento de embarque no FCA) e referências bibliográficas. O texto da LC 123 não foi enviado (enviei apenas a LC 147, que a altera).</li><li>O edital chama o ato 881/2022 de \"Portaria\", mas o documento com esse número é a <b>Resolução</b> ANP nº 881/2022. Confirme se é essa a norma pretendida.</li><li>O edital não traz pesos por assunto nem a profundidade de cada item.</li><li>Módulos 12 a 17 são complementos fora do Anexo IV.</li></ul></div>`;
  }
};

function route(){
  const h=(location.hash||"#edital").slice(1);
  let html,after;
  const mm=h.match(/^m(\d+)$/);
  if(mm){html=views.modulo(+mm[1]);after=()=>{const m=mods().find(x=>x.n===+mm[1]);if(m)quiz($("#quizhost"),m.q,"m"+m.n)}}
  else if(views[h]){html=views[h]();after=null}
  else{html=views.edital();after=null}
  $("main").innerHTML=html;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+(mm?"modulos":h)));
  window.scrollTo(0,0);
  if(after)after();
  if(h==="simulado")$("main").onclick=e=>{const n=e.target.dataset.sim;if(!n)return;
    const pool=[];mods().filter(m=>n==="todas"||!m.fora).forEach(m=>m.q.forEach(q=>pool.push(Object.assign({m:"M"+m.n},q))));
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    quiz($("#quizhost"),n==="todas"||n==="edital"?pool:pool.slice(0,+n),"sim");$("#quizhost").scrollIntoView()};
  else $("main").onclick=null;
}
addEventListener("hashchange",route);
addEventListener("DOMContentLoaded",route);

MODS.push({n:1,t:"Noções de logística e marketing",edital:"Noções elementares de marketing e logística",
alerta:"O edital cobra apenas \"noções elementares\". Não há detalhamento de SCM, estoques ou Incoterms no Anexo IV; este módulo cobre as noções conceituais mais prováveis.",
intro:"A Transpetro atua no transporte e armazenamento de petróleo, derivados, gás e biocombustíveis. Logística e marketing formam a base conceitual da atuação em comercialização. Por serem noções elementares, esperam-se definições, comparações entre conceitos e aplicações simples.",
obj:["Diferenciar logística de gestão da cadeia de suprimentos (SCM).","Identificar os fluxos da cadeia e o trade-off entre eficiência e responsividade.","Explicar o efeito chicote e suas causas.","Definir marketing, segmentação, posicionamento e o composto de marketing (4 Ps), ligando \"praça\" à logística."],
secs:[
["1. Logística × SCM","<p><b>Logística</b> é a parte do processo da cadeia que planeja, implementa e controla o fluxo e a armazenagem eficientes e eficazes de bens, serviços e informações, do ponto de origem ao ponto de consumo, para atender às exigências do cliente. <b>SCM</b> abrange o planejamento e a gestão de sourcing, compras, conversão e logística, incluindo a coordenação e colaboração com parceiros. <b>Logística é subconjunto da SCM.</b></p>","definições do CSCMP; BALLOU, R. H. <i>Gerenciamento da Cadeia de Suprimentos/Logística Empresarial</i>, Bookman; CHOPRA, S.; MEINDL, P. <i>Gestão da Cadeia de Suprimentos</i>, Pearson (cap. 1)."],
["2. Fluxos e elos","<p>Fluxos: físico, de informação e financeiro.</p><pre>UPSTREAM           MIDSTREAM                      DOWNSTREAM\nExploração e   →   Transporte (dutos, navios)  →  Refino → Distribuição\nprodução           e armazenagem (terminais)      → Varejo/consumidor</pre>","segmentação upstream/midstream/downstream é convenção de mercado, não definição legal nem do edital."],
["3. Estratégia, trade-off e direcionadores","<p>Objetivo da cadeia: maximizar o <b>excedente</b> (valor para o cliente menos custo da cadeia). Deve haver <b>ajuste estratégico</b> entre a estratégia competitiva e a da cadeia. Mais <b>responsividade</b> tende a elevar o custo; mais <b>eficiência</b> reduz a responsividade.</p><p>Direcionadores: instalações, estoque, transporte, informação, fontes de suprimento (sourcing) e preço.</p>","CHOPRA; MEINDL, <i>Gestão da Cadeia de Suprimentos</i>, caps. 1 a 3."],
["4. Efeito chicote (bullwhip)","<p>A variabilidade dos pedidos aumenta conforme se sobe na cadeia. Causas: (1) processamento da previsão de demanda; (2) formação de lotes; (3) flutuação de preços e promoções; (4) racionamento e jogo de escassez. Mitigação: compartilhar informação de demanda, reduzir lotes e prazos, estabilizar preços e colaborar.</p>","LEE, PADMANABHAN e WHANG, \"The Bullwhip Effect in Supply Chains\", <i>Sloan Management Review</i>, 1997."],
["5. Conceito de marketing","<p>Segundo a AMA (2017), marketing é a atividade, o conjunto de instituições e os processos para criar, comunicar, entregar e trocar ofertas que tenham valor para consumidores, clientes, parceiros e a sociedade em geral. Para Kotler, é o processo social e gerencial pelo qual pessoas e grupos obtêm o que necessitam e desejam por meio da criação, oferta e troca de produtos de valor.</p>","American Marketing Association (definição de 2017); KOTLER, P.; KELLER, K. <i>Administração de Marketing</i>, Pearson."],
["6. Segmentação, mercado-alvo e posicionamento (STP)","<ul><li><b>Segmentação:</b> dividir o mercado em grupos com necessidades, características ou comportamentos semelhantes.</li><li><b>Seleção de mercado-alvo:</b> escolher o(s) segmento(s) a atender.</li><li><b>Posicionamento:</b> definir a imagem e o valor da oferta na mente do cliente-alvo em relação aos concorrentes.</li></ul>","KOTLER; KELLER, <i>Administração de Marketing</i>."],
["7. Composto de marketing (4 Ps)","<table><tr><th>P</th><th>Decisões</th></tr><tr><td>Produto</td><td>Atributos, qualidade, variedade, serviços associados</td></tr><tr><td>Preço</td><td>Política de preços, descontos, prazos de pagamento</td></tr><tr><td>Praça (distribuição)</td><td>Canais, cobertura, localização, estoques e transporte: o elo com a logística</td></tr><tr><td>Promoção (comunicação)</td><td>Propaganda, vendas pessoais, promoção de vendas, relações públicas</td></tr></table>","McCARTHY, E. J. <i>Basic Marketing</i>, 1960 (origem dos 4 Ps); KOTLER; KELLER."]
],
mapa:`NOÇÕES DE LOGÍSTICA E MARKETING
├── Logística ⊂ SCM
├── Fluxos: físico | informação | financeiro
├── Trade-off: eficiência ⇄ responsividade
├── Direcionadores: instalações, estoque, transporte,
│                   informação, sourcing, preço
├── Efeito chicote: previsão, lotes, preços, racionamento
└── Marketing
    ├── Conceito (AMA / Kotler)
    ├── STP: segmentação → alvo → posicionamento
    └── 4 Ps: produto, preço, praça (⇄ logística), promoção`,
q:[
Q("Sobre a relação entre logística e gestão da cadeia de suprimentos (SCM), é correto afirmar que",["a logística é mais ampla que a SCM, pois abrange fornecedores e clientes finais.","a SCM restringe-se às atividades de transporte e armazenagem dentro da empresa.","a logística é parte da SCM, que também envolve coordenação e colaboração com parceiros da cadeia.","SCM e logística são sinônimos perfeitos em qualquer literatura.","a SCM trata apenas do fluxo financeiro entre elos da cadeia."],2,["Inverte a relação: a logística é subconjunto da SCM.","A SCM é interorganizacional, não se limita ao interior da empresa.","Logística ⊂ SCM, e a SCM inclui coordenação com parceiros.","Não são sinônimos perfeitos, embora o uso coloquial os misture.","A SCM integra fluxos físicos, de informação e financeiros."],"CSCMP; Ballou; Chopra e Meindl (cap. 1)."),
Q("O aumento da variabilidade dos pedidos à medida que se caminha do varejo em direção aos fornecedores é conhecido como efeito chicote. Uma medida coerente para reduzi-lo é",["aumentar o tamanho dos lotes de pedido para reduzir a frequência.","compartilhar dados de demanda ao longo da cadeia.","intensificar promoções sazonais de preço.","cada elo trabalhar exclusivamente com sua própria previsão isolada.","racionar o produto para forçar os clientes a anteciparem pedidos."],1,["Lotes maiores (batching) são causa do efeito chicote.","O compartilhamento de informação reduz a distorção da demanda.","Promoções e flutuações de preço são causa.","Previsões isoladas amplificam a distorção.","Racionamento e jogo de escassez são causa."],"Lee, Padmanabhan e Whang (1997)."),
Q("Segundo Chopra e Meindl, ao se optar por uma cadeia com alto nível de responsividade, espera-se, em regra,",["maior eficiência de custo, pois a responsividade elimina estoques e capacidade ociosa.","irrelevância do ajuste estratégico entre a estratégia da cadeia e a competitiva.","maior custo da cadeia, pois responsividade tende a exigir capacidade, estoque ou flexibilidade adicionais.","eliminação do trade-off entre custo e serviço.","redução automática do excedente da cadeia."],2,["Afirma o oposto do que o modelo prevê.","O ajuste estratégico é central no modelo.","Há trade-off entre responsividade e custo.","O trade-off existe justamente nesse ponto.","O excedente pode até aumentar se o valor gerado superar o custo adicional; não há redução automática."],"Chopra e Meindl, cap. 1."),
Q("Em marketing, o processo de dividir o mercado em grupos de consumidores com necessidades, características ou comportamentos semelhantes é denominado",["posicionamento.","segmentação.","promoção.","precificação.","distribuição."],1,["Posicionamento é definir a imagem e o valor da oferta na mente do cliente-alvo.","Segmentação é a divisão do mercado em grupos homogêneos.","Promoção é um dos 4 Ps (comunicação).","Precificação é o P de preço.","Distribuição é o P de praça."],"Kotler e Keller."),
Q("No composto de marketing (4 Ps), as decisões sobre canais de distribuição, cobertura de mercado, localização, estoques e transporte relacionam-se ao P de",["produto.","preço.","promoção.","praça.","posicionamento."],3,["Produto trata de atributos, qualidade e serviços associados.","Preço trata de política de preços, descontos e prazos.","Promoção trata de comunicação com o mercado.","Praça (place) engloba canais e logística de distribuição.","Posicionamento faz parte do STP, não do composto dos 4 Ps."],"McCarthy (1960); Kotler e Keller.")
]});

MODS.push({n:2,t:"Petróleo, derivados, gás natural e biocombustíveis",edital:"Características do petróleo e derivados (GLP, gasolina, diesel); gás natural; biocombustíveis",
alerta:"Percentuais de mistura (etanol na gasolina, biodiesel no diesel) e faixas de classificação por °API mudam por norma. Confira os valores vigentes no CNPE/ANP antes da prova.",
intro:"A Transpetro movimenta petróleo, derivados, gás e biocombustíveis. O edital pede as características principais desses produtos, então o foco é composição, propriedades que distinguem cada um e como são obtidos.",
obj:["Calcular e interpretar o grau API.","Relacionar o refino às frações obtidas.","Distinguir GLP, gasolina e diesel (composição e indicadores como octanagem e cetano).","Diferenciar gás natural, GNL e GNC.","Explicar etanol e biodiesel."],
secs:[
["1. Petróleo: composição e grau API","<p>Mistura complexa de hidrocarbonetos (parafínicos, naftênicos e aromáticos), com compostos de enxofre, nitrogênio, oxigênio e metais em menor teor. O <b>grau API</b> mede a densidade: <code>°API = 141,5 / d(60°F/60°F) − 131,5</code>.</p><ul><li>A água tem 10 °API. Maior °API significa petróleo <b>menos denso</b> (mais leve), em geral de maior valor.</li><li>Classificação usual: leve, médio e pesado (os cortes exatos variam conforme o critério adotado).</li><li>Quanto ao enxofre: <b>doce</b> (baixo teor) e <b>azedo</b> (alto teor).</li></ul>","THOMAS, J. E. (org.). <i>Fundamentos de Engenharia de Petróleo</i>, Interciência; ANP."],
["2. Refino e frações","<p>A destilação atmosférica separa o petróleo por faixa de temperatura de ebulição, do mais leve ao mais pesado: gases, GLP, nafta/gasolina, querosene, diesel, gasóleos e resíduo. A destilação a vácuo processa o resíduo. O craqueamento catalítico (FCC) converte frações pesadas em frações mais leves e valiosas, como GLP e gasolina.</p>","THOMAS (org.); SZKLO, A.; ULLER, V. <i>Fundamentos do Refino de Petróleo</i>, Interciência."],
["3. GLP","<p>Gás liquefeito de petróleo: mistura predominantemente de <b>propano e butano</b>, obtida no refino e no processamento de gás natural. É armazenado <b>liquefeito sob pressão moderada</b>. É mais denso que o ar (vazamentos acumulam em pontos baixos) e, por ser inodoro, recebe odorizante (compostos de enxofre, como mercaptanas) para permitir a detecção.</p>","THOMAS (org.); ANP."],
["4. Gasolina","<p>Hidrocarbonetos de cadeia média (aproximadamente C5 a C12). A <b>octanagem</b> mede a resistência à detonação (knocking) em motores de ciclo Otto, usando como referência o isoctano (100) e o n-heptano (0). A gasolina automotiva brasileira leva <b>etanol anidro</b> em percentual definido por norma.</p>","THOMAS (org.); ANP (especificação e mistura vigentes)."],
["5. Óleo diesel","<p>Fração mais pesada que a gasolina, usada em motores de ignição por compressão (ciclo Diesel). O indicador de qualidade de ignição é o <b>índice de cetano</b>, que é o oposto conceitual da octanagem: quanto maior o cetano, mais fácil a autoignição. As variantes S10 e S500 indicam o teor máximo de enxofre (10 e 500 mg/kg). O diesel comercial recebe <b>biodiesel</b> em percentual definido por norma.</p>","THOMAS (org.); ANP."],
["6. Gás natural","<p>Mistura de hidrocarbonetos gasosos com predomínio do <b>metano</b>. Pode ser <b>associado</b> (produzido junto com o petróleo) ou <b>não associado</b>. O processamento em UPGN separa o gás seco (metano e etano) das frações mais pesadas, como o GLP. <b>GNL</b>: gás resfriado a cerca de −162 °C, quando vira líquido e reduz o volume em aproximadamente 600 vezes, facilitando o transporte marítimo. <b>GNC</b>: gás comprimido a alta pressão. A Lei 14.134/2021 é o marco legal atual do gás natural.</p>","THOMAS (org.); ANP; Lei 14.134/2021."],
["7. Biocombustíveis","<ul><li><b>Etanol</b>: obtido por fermentação de açúcares (no Brasil, principalmente cana-de-açúcar). O anidro é misturado à gasolina; o hidratado é usado puro.</li><li><b>Biodiesel</b>: ésteres obtidos por <b>transesterificação</b> de óleos vegetais ou gorduras animais com álcool (metanol ou etanol), com glicerina como coproduto.</li><li><b>RenovaBio</b> (Lei 13.576/2017): política de incentivo à descarbonização com metas para distribuidores e créditos de descarbonização (CBIOs).</li></ul>","Lei 13.576/2017; ANP; EPE."]
],
mapa:`PETRÓLEO E DERIVADOS
├── Petróleo: hidrocarbonetos; °API = 141,5/d − 131,5
│   └── maior °API = mais leve; água = 10 °API
├── Refino: destilação → gases, GLP, nafta, querosene, diesel, resíduo
├── GLP: propano + butano, liquefeito sob pressão
├── Gasolina: octanagem (Otto) + etanol anidro
├── Diesel: cetano (ignição por compressão), S10/S500 + biodiesel
├── Gás natural: metano; associado × não associado; GNL (−162 °C) × GNC
└── Biocombustíveis: etanol (fermentação), biodiesel (transesterificação)`,
q:[
Q("Um petróleo com densidade relativa (60°F/60°F) de 0,85 possui grau API mais próximo de",["25.","30.","35.","40.","45."],2,["141,5/0,85 − 131,5 ≈ 35; o valor 25 corresponde a densidade maior (cerca de 0,90).","Corresponderia a densidade de cerca de 0,876.","141,5/0,85 = 166,5; 166,5 − 131,5 = 35 °API.","Corresponderia a densidade de cerca de 0,825.","Corresponderia a densidade de cerca de 0,802."],"Definição de grau API (Thomas, Fundamentos de Engenharia de Petróleo)."),
Q("Sobre o GLP, é correto afirmar que é",["composto majoritariamente por metano e armazenado a −162 °C.","uma mistura de propano e butano, armazenada liquefeita sob pressão moderada.","produzido exclusivamente pela fermentação de açúcares.","menos denso que o ar, o que faz vazamentos se dissiparem para cima.","naturalmente odorizado, sem necessidade de aditivos."],1,["Descreve o GNL, não o GLP.","O GLP é de propano e butano, liquefeito sob pressão moderada.","A fermentação de açúcares gera etanol.","O GLP é mais denso que o ar e tende a se acumular em pontos baixos.","O GLP é inodoro e recebe odorizante para permitir a detecção de vazamentos."],"Thomas (org.); ANP."),
Q("A octanagem e o índice de cetano são indicadores de qualidade, respectivamente, de",["gasolina (resistência à detonação) e diesel (facilidade de autoignição).","diesel e gasolina, nessa ordem.","GLP e gás natural.","etanol e biodiesel, exclusivamente.","querosene de aviação e óleo combustível."],0,["A octanagem mede a resistência à detonação da gasolina; o cetano mede a qualidade de ignição por compressão do diesel.","Inverte os indicadores.","Não são indicadores usuais de GLP e gás natural.","São indicadores de gasolina e diesel, independentemente da origem do combustível.","Não são os indicadores clássicos desses produtos."],"Thomas (org.); ANP."),
Q("O GNL (gás natural liquefeito) caracteriza-se por",["ser gás natural comprimido a cerca de 200 bar.","ser resfriado a aproximadamente −162 °C, reduzindo drasticamente o volume para facilitar o transporte.","ser composto majoritariamente por propano e butano.","ser obtido por transesterificação de óleos vegetais.","não poder ser transportado por navios."],1,["Descreve o GNC.","A −162 °C o metano liquefaz e o volume cai cerca de 600 vezes.","Propano e butano compõem o GLP.","Transesterificação gera biodiesel.","O transporte marítimo em navios metaneiros é uma das principais aplicações do GNL."],"Thomas (org.); ANP."),
Q("O biodiesel é obtido, em regra, pelo processo de",["destilação fracionada do petróleo.","craqueamento catalítico de gasóleo.","transesterificação de óleos ou gorduras com álcool.","fermentação da cana-de-açúcar.","hidrogenação do gás natural."],2,["Destilação fracionada é etapa do refino do petróleo.","O craqueamento catalítico gera frações leves a partir de pesadas no refino.","Na transesterificação formam-se ésteres (biodiesel) e glicerina.","A fermentação da cana gera etanol.","Não é o processo que define o biodiesel."],"ANP; Lei 13.576/2017 (contexto do RenovaBio).")
]});

MODS.push({n:3,t:"Transporte marítimo, afretamento e portos",edital:"Apoio portuário e agentes marítimos; afretamentos; portos e terminais; granéis líquidos; navegação regular e livre; avarias",
alerta:"O edital não detalha subtópicos. Faixas de porte de navios (DWT) e cláusulas de contratos-padrão variam por fonte; use como referência de ordem de grandeza.",
intro:"O transporte marítimo de petróleo e derivados é feito em petroleiros, contratados no mercado de afretamento. A Transpetro opera frota e terminais, e o edital cobra estrutura do mercado, tipos de navegação, avarias e apoio portuário.",
obj:["Diferenciar navegação regular e livre.","Explicar os principais tipos de afretamento e a lógica de frete, hire, laytime e demurrage.","Descrever o papel do agente marítimo e dos serviços de apoio portuário.","Definir avaria simples e avaria grossa.","Reconhecer a estrutura de portos e terminais de granéis líquidos."],
secs:[
["1. Navegação regular × livre","<ul><li><b>Regular (liner)</b>: linhas com rotas, escalas e frequência pré-definidas e tarifas publicadas. Típica de carga geral e contêineres.</li><li><b>Livre (tramp)</b>: sem rota nem calendário fixos; o navio vai onde a carga está, contratado por afretamento. Típica de granéis (petróleo, minérios, grãos). O transporte de petróleo bruto é predominantemente livre.</li></ul>","STOPFORD, M. <i>Maritime Economics</i>, Routledge; LUDOVICO, N. <i>Logística Internacional</i>, Saraiva."],
["2. Mercado de afretamento","<p>Agentes: <b>armador</b> (proprietário do navio), <b>afretador</b> (quem contrata o navio) e <b>corretor</b> (broker), que intermedeia. O mercado responde à oferta e demanda de tonelagem: o frete oscila com o ciclo de transporte, a disponibilidade de navios e o preço do combustível (bunker). Em petroleiros, o frete costuma ser cotado em escala de referência (Worldscale) ou em valor global (lump sum).</p><table><tr><th>Modalidade</th><th>Ideia</th></tr><tr><td>Por viagem (voyage charter)</td><td>Afretador paga o <b>frete</b> (por tonelada ou valor global) e o armador arca com a operação do navio, incluindo o combustível e, em regra, as despesas de porto</td></tr><tr><td>Por tempo (time charter)</td><td>Afretador paga o <b>hire</b> (diária) e, em regra, combustível e despesas portuárias; o armador mantém a gestão náutica</td></tr><tr><td>Casco nu (bareboat)</td><td>Afretador assume posse, tripulação e gestão do navio; equivale a um arrendamento</td></tr><tr><td>Contrato de volume (COA)</td><td>Compromisso de transportar volumes ao longo do tempo, com navios definidos a cada embarque</td></tr></table><p><b>Laytime</b> é o tempo permitido para carga/descarga. Se excedido, o afretador paga <b>demurrage</b> (sobre-estadia); se houver economia de tempo, pode haver <b>despatch</b>.</p>","STOPFORD; contratos-padrão de mercado (BIMCO, INTERTANKO); gestão náutica × comercial: conceito de mercado."],
["3. Petroleiros e granéis líquidos","<p>Classes usuais por porte: <b>VLCC</b> (aprox. 200 a 320 mil DWT), <b>Suezmax</b> (aprox. 120 a 200 mil), <b>Aframax</b> (aprox. 80 a 120 mil), <b>Panamax</b> e navios menores para derivados (produtos limpos). Os limites variam por fonte. A poluição por óleo é regulada pela Convenção MARPOL (Anexo I, óleo; Anexo II, substâncias líquidas nocivas a granel), que exige, entre outros, casco duplo, tanques de lastro segregado e lavagem com óleo cru (COW).</p>","STOPFORD; IMO (MARPOL 73/78)."],
["4. Portos e terminais","<p>No Brasil, a Lei 12.815/2013 distingue o <b>porto organizado</b> (bem público, com autoridade portuária e operadores portuários, e exploração por concessão ou arrendamento) do <b>terminal de uso privado (TUP)</b>, explorado por autorização. Terminais de granéis líquidos têm píeres, dolphins e boias de amarração (monobóias), com dutos ligando o navio aos tanques em terra. A ANTAQ regula a atividade portuária.</p>","Lei 12.815/2013; ANTAQ."],
["5. Apoio portuário e agente marítimo","<ul><li><b>Agente marítimo</b>: representa o armador ou afretador no porto, cuidando das formalidades com autoridades, provisões, coordenação dos serviços e documentação da escala.</li><li><b>Praticagem</b>: assessoria técnica local ao comandante para manobras seguras em zonas de praticagem (Lei 9.537/1997, LESTA).</li><li><b>Rebocadores, amarração, lanchas e fornecimento (supply, bunker)</b>: demais serviços de apoio.</li></ul>","Lei 9.537/1997; LUDOVICO."],
["6. Avarias marítimas","<ul><li><b>Avaria simples (particular)</b>: dano ou despesa suportado apenas pelo interessado que o sofreu (navio ou carga).</li><li><b>Avaria grossa (comum)</b>: sacrifício ou despesa <b>intencional e razoável</b> feito em favor da segurança comum da expedição, e que é rateado entre todos os interessados (navio, frete e carga). Regulada por regras como as de York-Antuérpia e pelo Código Comercial. Ex.: alijamento de carga para salvar o navio.</li></ul>","Código Comercial (Lei 556/1850, parte marítima); Regras de York-Antuérpia."]
],
mapa:`TRANSPORTE MARÍTIMO
├── Navegação: regular (liner, rota fixa) × livre (tramp, granéis)
├── Afretamento: viagem | tempo | casco nu | COA
│   └── frete/hire; laytime → demurrage / despatch
├── Petroleiros: VLCC, Suezmax, Aframax; MARPOL
├── Portos: organizado × TUP; terminais de granéis líquidos
├── Apoio: agente marítimo, praticagem, rebocadores
└── Avarias: simples (só quem sofreu) × grossa (rateada)`,
q:[
Q("A navegação em que o navio não tem rota nem calendário fixos, sendo contratado por afretamento para levar granéis como petróleo e minérios, denomina-se",["regular (liner).","livre (tramp).","de cabotagem exclusivamente.","interior.","de apoio marítimo."],1,["Na regular há rotas, escalas e frequência pré-definidas.","Na navegação livre (tramp) o navio segue a carga, contratado por afretamento.","Cabotagem refere-se à navegação entre portos do mesmo país; não é sinônimo de navegação livre.","Navegação interior é a realizada em hidrovias interiores.","Apoio marítimo atende plataformas e instalações offshore."],"Stopford, Maritime Economics."),
Q("No afretamento por tempo (time charter), o afretador",["assume a posse, a tripulação e toda a gestão do navio.","paga o hire e, em regra, o combustível e as despesas portuárias, enquanto o armador mantém a gestão náutica.","paga apenas um frete por tonelada e nada mais.","não tem qualquer direito de determinar a rota comercial do navio.","transfere ao armador todos os custos de combustível."],1,["Descreve o afretamento a casco nu (bareboat).","No time charter o afretador paga o hire e os custos de viagem; a gestão náutica permanece com o armador.","Descreve o afretamento por viagem.","No time charter o afretador dirige o emprego comercial do navio (rotas e cargas), dentro dos limites do contrato.","O combustível costuma ser custo do afretador no time charter."],"Stopford; contratos-padrão de mercado."),
Q("Diz-se que há demurrage quando",["a carga é rateada entre os interessados após sacrifício voluntário.","o afretador excede o tempo permitido para carga e descarga (laytime) e paga ao armador a sobre-estadia.","o armador entrega o navio sem tripulação.","o navio segue sem escala em rota regular.","o agente marítimo cobra taxa de praticagem."],1,["Descreve a avaria grossa.","Demurrage é a quantia paga pelo afretador ao armador pelo tempo que excede o laytime.","Descreve o afretamento a casco nu.","Não guarda relação com o conceito.","Não guarda relação com o conceito."],"Stopford; prática de mercado (BIMCO)."),
Q("A avaria grossa (comum) caracteriza-se por",["dano sofrido apenas pela carga, sem participação dos demais.","sacrifício ou despesa intencional e razoável em favor da segurança comum da expedição, rateado entre navio, frete e carga.","qualquer dano à carga, independentemente da causa.","despesas rotineiras de manutenção do navio.","multas aplicadas pela autoridade portuária."],1,["Descreve a avaria simples (particular).","A avaria grossa é o ato voluntário de sacrifício comum, rateado entre os interessados.","Danos comuns sem sacrifício intencional geralmente são avaria simples.","Manutenção rotineira é custo do armador.","Não é avaria."],"Código Comercial (parte marítima); Regras de York-Antuérpia."),
Q("O agente marítimo é o profissional ou empresa que",["representa o armador ou afretador no porto, cuidando das formalidades e serviços da escala.","assessora tecnicamente o comandante nas manobras em zonas de praticagem.","explora o terminal de uso privado por autorização.","determina o valor do frete nas bolsas de mercadorias.","fiscaliza a atividade portuária como agência reguladora."],0,["O agente marítimo atua como representante local do armador ou afretador.","Descreve o prático (praticagem).","Descreve o titular de um TUP.","Os fretes se formam no mercado, com participação de corretores.","Descreve a ANTAQ."],"Ludovico, Logística Internacional; Lei 9.537/1997.")
]});

MODS.push({n:4,t:"Dutos, terminais e regulação do setor (Lei 9.478/1997 e Resolução ANP 881/2022)",edital:"Transporte dutoviário; Lei 9.478/1997 e alterações; \"Portaria ANP nº 881/2022\"",
alerta:"Teoria da Lei 9.478 e da Resolução ANP nº 881/2022 conferida no texto oficial enviado (Lei atualizada até 2025). <b>O edital cita \"Portaria\" ANP nº 881/2022, mas o ato com esse número é a Resolução ANP nº 881, de 8/7/2022</b> (sobre o uso de terminais aquaviários). Confirme no edital/retificações se é essa a norma pretendida. Prazos e números de artigos da Resolução podem ser alterados por atos posteriores da ANP.",
intro:"A Transpetro tem base legal na Lei do Petróleo. Este módulo trata dos dutos (características técnicas), do monopólio da União, do papel da CNPE e da ANP, das regras de transporte e acesso de terceiros e da Resolução ANP 881/2022, que regula o acesso não discriminatório a terminais aquaviários.",
obj:["Descrever tipos de dutos e vantagens e limitações do modal.","Situar o monopólio da União e a possibilidade de contratação.","Reconhecer as atribuições do CNPE e da ANP.","Diferenciar transporte de transferência, distribuição e revenda.","Explicar o acesso não discriminatório a terminais e a preferência do proprietário (Res. ANP 881/2022)."],
secs:[
["1. Transporte dutoviário: conceitos","<ul><li><b>Oleoduto</b> (petróleo), <b>poliduto</b> (vários derivados, em bateladas), <b>gasoduto</b> (gás natural), além de minerodutos e alcooldutos.</li><li><b>Batelada</b>: lote de um produto empurrado pelo duto. <b>Interface</b>: zona de mistura entre bateladas consecutivas, tratada no destino.</li><li><b>Pig</b>: dispositivo introduzido no duto para limpeza, separação de produtos ou inspeção.</li><li>Estações de <b>bombeamento</b> (líquidos) e de <b>compressão</b> (gás) mantêm pressão e vazão.</li><li>Tanques de teto flutuante reduzem perdas por evaporação de produtos voláteis nos terminais.</li></ul><p><b>Vantagens:</b> baixo custo unitário em grandes volumes, operação contínua, segurança e baixa emissão. <b>Limitações:</b> alto investimento inicial, rota fixa, poucos tipos de produto e necessidade de grandes volumes.</p>","THOMAS (org.), <i>Fundamentos de Engenharia de Petróleo</i>; BALLOU, R. H., <i>Logística Empresarial</i> (comparação de modais)."],
["2. Monopólio da União (Lei 9.478, art. 4º)","<p>Constituem monopólio da União: (I) pesquisa e lavra de jazidas de petróleo e gás natural e outros hidrocarbonetos fluidos; (II) refinação de petróleo nacional ou estrangeiro; (III) importação e exportação dos produtos e derivados básicos dessas atividades; (IV) o <b>transporte marítimo</b> do petróleo bruto de origem nacional ou de derivados básicos produzidos no País, e o <b>transporte, por meio de conduto</b>, de petróleo bruto, seus derivados e de gás natural. As atividades são reguladas e fiscalizadas pela União e podem ser exercidas por concessão, autorização ou partilha, por empresas constituídas sob as leis brasileiras, com sede e administração no País (art. 5º).</p>","Lei 9.478/1997, arts. 4º e 5º; CF, art. 177."],
["3. CNPE e ANP (arts. 1º, 2º, 7º e 8º)","<ul><li>A política energética visa, entre outros, a preservar o interesse nacional, proteger o consumidor quanto a preço, qualidade e oferta, proteger o meio ambiente, garantir o fornecimento de derivados em todo o território, incrementar o uso do gás natural e <b>promover a livre concorrência</b> (art. 1º).</li><li><b>CNPE</b>: vinculado à Presidência da República e presidido pelo Ministro de Minas e Energia; atribuição de <b>propor ao Presidente da República</b> políticas nacionais e medidas específicas (art. 2º).</li><li><b>ANP</b>: entidade da Administração Federal Indireta, sob regime <b>autárquico especial</b>, órgão regulador da indústria do petróleo, gás natural, derivados e biocombustíveis, vinculada ao Ministério de Minas e Energia (art. 7º). Sede no Distrito Federal e escritórios centrais no Rio de Janeiro (art. 7º, §1º). Finalidade: <b>promover a regulação, a contratação e a fiscalização</b> das atividades econômicas da indústria (art. 8º, redação atual inclui combustíveis sintéticos, hidrogênio de baixo carbono e captura e estocagem de carbono).</li></ul>","Lei 9.478/1997, arts. 1º, 2º, 7º e 8º (redação atualizada)."],
["4. Definições do art. 6º","<ul><li><b>Transporte</b>: movimentação de petróleo, derivados, biocombustíveis ou gás natural em meio ou percurso considerado de <b>interesse geral</b>.</li><li><b>Transferência</b>: movimentação em meio ou percurso de <b>interesse específico e exclusivo</b> do proprietário ou explorador das facilidades.</li><li><b>Distribuição</b>: comercialização <b>por atacado</b> com a rede varejista ou grandes consumidores de combustíveis, lubrificantes, asfaltos e GLP envasado, exercida por empresas especializadas.</li><li><b>Revenda</b>: venda <b>a varejo</b> de combustíveis, lubrificantes e GLP envasado, por postos de serviços ou revendedores.</li></ul>","Lei 9.478/1997, art. 6º."],
["5. Transporte, acesso e a Transpetro (arts. 56 a 65)","<ul><li>Art. 56: qualquer empresa ou consórcio que atenda ao art. 5º pode receber <b>autorização da ANP</b> para construir instalações e efetuar qualquer modalidade de transporte de petróleo, derivados e gás natural, para suprimento interno ou importação e exportação. A ANP baixa normas sobre habilitação e condições, observados proteção ambiental e segurança de tráfego.</li><li>Art. 58: <b>facultado a qualquer interessado o uso dos dutos de transporte e dos terminais marítimos</b>, existentes ou a construir, mediante <b>remuneração ao titular</b>. Se não houver acordo, a ANP fixa o valor e a forma de pagamento (§1º). A ANP regula a <b>preferência do proprietário</b> das instalações para movimentar seus próprios produtos, visando à máxima utilização da capacidade (§2º).</li><li>Art. 59: dutos de transferência serão <b>reclassificados</b> como dutos de transporte se houver comprovado interesse de terceiros em sua utilização.</li><li>Art. 65: a Petrobras <b>deverá constituir subsidiária</b> com atribuições específicas de operar e construir seus dutos, terminais marítimos e embarcações para transporte de petróleo, derivados e gás natural, podendo essa subsidiária associar-se a outras empresas. É a base legal da <b>Transpetro</b>.</li></ul>","Lei 9.478/1997, arts. 56 a 59 e 65 (redação atualizada)."],
["6. Participações governamentais (art. 45 em diante)","<p>O contrato de concessão dispõe sobre: <b>bônus de assinatura</b>, <b>royalties</b>, <b>participação especial</b> e <b>pagamento pela ocupação ou retenção de área</b>. São obrigatórios os royalties e o pagamento pela ocupação ou retenção de área (art. 45, §1º). Royalties: 10% da produção, com possibilidade de redução até 5% (art. 47). Participação especial: em casos de grande volume de produção ou grande rentabilidade (art. 50).</p>","Lei 9.478/1997, arts. 45, 47 e 50."],
["7. Resolução ANP nº 881/2022: terminais aquaviários","<p><b>Objeto</b>: critérios para o uso dos terminais aquaviários autorizados pela ANP para movimentação de petróleo, derivados de petróleo, derivados de gás natural e biocombustíveis, <b>mediante remuneração ao operador</b> (art. 1º). Alcança terminais dentro ou fora do porto organizado. <b>Não se aplica</b> a instalações usadas exclusivamente para apoio offshore, operações STS não atracadas, terminais de metanol sem produtos regulados e <b>terminais de GNL</b> (art. 1º, §2º). <b>Produto regulado</b>: petróleo, derivados de petróleo, derivados de gás natural e biocombustíveis, excluídos gás natural e GNL (art. 2º, XXIII).</p><ul><li><b>Acesso não discriminatório</b> (art. 3º): o operador deve permitir o acesso ao terminal a qualquer interessado, mediante remuneração, em condições não discriminatórias entre carregadores, inclusive o carregador proprietário. Acesso deve ser dado sempre que houver capacidade de movimentação <b>ociosa ou disponível</b> (art. 4º). É vedada preferência injustificada; considera-se a <b>ordem de chegada</b> das solicitações.</li><li><b>Prazos</b>: operador responde à solicitação em até 3 dias úteis após a data limite (art. 4º, §4º); confirma (podendo propor ajustes) ou emite <b>negativa de acesso</b>, que deve ser motivada e enviada à ANP até o décimo dia do mês seguinte (art. 5º). A negativa por risco ao abastecimento nacional só tem eficácia com manifestação prévia favorável da ANP (art. 5º, §5º).</li><li><b>Preferência do proprietário</b> (arts. 8º a 13): o carregador proprietário tem direito a contratar o terminal para movimentar seus próprios produtos, dentro de limites mensais fixados pela ANP. Nos primeiros <b>10 anos</b> da primeira autorização de operação, a preferência é igual à capacidade máxima; depois a ANP a <b>revisa a cada 5 anos</b>. Não é transferível.</li><li><b>Terceiro interessado majoritário</b> (uso &gt; 50% da capacidade máxima): o operador deve comunicar à ANP e fazer <b>oferta pública</b> de capacidade por no mínimo 30 dias; contrato com um único carregador acima de 50% tem prazo máximo de 10 anos (art. 18).</li><li><b>Desverticalização</b> (art. 28): o operador não pode comprar, vender, importar ou exportar produtos, salvo exceções (uso próprio, reposição por perda ou contaminação etc.); deve ter constituição societária cujo objeto principal seja a operação logística de terminais. Operadores <b>verticalizados</b> (ligados a produtor, distribuidor, refinador etc.) têm obrigações adicionais de transparência e data limite no dia 15 do mês anterior (art. 27).</li><li><b>Conexão dutoviária</b> (art. 29): o operador deve permitir a conexão do terminal com instalações de terceiros; custos da conexão são do terceiro interessado; a conexão integra os ativos do titular do terminal.</li><li><b>Ship-or-pay</b>: modalidade em que o carregador paga pelo serviço independentemente de usá-lo (art. 2º, XXVI). <b>Fungibilidade</b>: substituição do produto por outro de mesmo gênero, quantidade e qualidade. <b>CGST</b>: Condições Gerais de Serviço do Terminal, parte integrante dos contratos, com conteúdo mínimo no Anexo (art. 17 e 23).</li><li><b>Remuneração</b> (art. 7º): deve refletir modalidades e complexidade do serviço, considerar a carga tributária e retorno justo do investimento, <b>não ser discriminatória</b> e não incorporar subsídios ou custos de outros carregadores ou instalações.</li></ul>","Resolução ANP nº 881, de 8 de julho de 2022 (DOU 12/07/2022), arts. 1º a 45 e Anexo."]
],
mapa:`DUTOS, TERMINAIS E REGULAÇÃO
├── Dutos: oleoduto | poliduto (bateladas, interface) | gasoduto; pig
├── Lei 9.478/97
│   ├── Art. 4º: monopólio (inclui transporte por conduto); art. 5º: empresa brasileira
│   ├── CNPE: propõe políticas ao Presidente; ANP: autarquia especial (MME)
│   ├── Transporte (interesse geral) × Transferência (interesse exclusivo)
│   ├── Distribuição (atacado) × Revenda (varejo)
│   ├── Art. 56 autorização | Art. 58 acesso de terceiros + preferência do proprietário
│   └── Art. 65: subsidiária da Petrobras para dutos, terminais e navios (Transpetro)
├── Participações: bônus, royalties (10%), participação especial, área
└── Res. ANP 881/2022: acesso não discriminatório a terminais aquaviários
    ├── ociosa/disponível; ordem de chegada; negativa motivada (à ANP)
    ├── Preferência do proprietário: 10 anos, revisão a cada 5; oferta pública > 50%
    └── Desverticalização; conexão dutoviária; ship-or-pay; CGST`,
q:[
Q("A ANP, criada pela Lei 9.478/1997, é",["órgão vinculado à Presidência da República, presidido pelo Ministro de Minas e Energia, que propõe políticas energéticas ao Presidente.","entidade da Administração Federal Indireta, sob regime autárquico especial, vinculada ao Ministério de Minas e Energia, com a finalidade de promover a regulação, a contratação e a fiscalização das atividades da indústria.","empresa pública que executa o monopólio do petróleo.","subsidiária integral da Petrobras.","órgão do Tribunal de Contas da União."],1,["Descreve o CNPE (art. 2º).","Descrição do art. 7º e do art. 8º.","O monopólio é da União, que pode contratar; a ANP é reguladora, não empresa executora.","A ANP é autarquia especial, não subsidiária de empresa.","A ANP integra a Administração Federal Indireta."],"Lei 9.478/1997, arts. 2º, 7º e 8º."),
Q("A Lei 9.478/1997 determina que a Petrobras constitua subsidiária com atribuições específicas de operar e construir seus dutos, terminais marítimos e embarcações para o transporte de petróleo, derivados e gás natural. Essa previsão é a base legal da",["ANP.","Transpetro.","CNPE.","EPE.","ANTAQ."],1,["A ANP é a agência reguladora.","Art. 65: subsidiária para dutos, terminais marítimos e embarcações.","O CNPE propõe políticas ao Presidente.","A EPE faz estudos de planejamento energético.","A ANTAQ regula transporte aquaviário e portos."],"Lei 9.478/1997, art. 65."),
Q("Segundo a Lei 9.478/1997, a movimentação de petróleo, derivados, biocombustíveis ou gás natural em meio ou percurso de interesse específico e exclusivo do proprietário ou explorador das facilidades é denominada",["transporte.","transferência.","distribuição.","revenda.","estocagem."],1,["Transporte refere-se a interesse geral.","Definição de transferência (art. 6º, VIII).","Distribuição é comercialização por atacado.","Revenda é a venda a varejo.","Estocagem não é a definição pedida."],"Lei 9.478/1997, art. 6º."),
Q("Na Lei 9.478/1997, a atividade de comercialização por atacado com a rede varejista ou com grandes consumidores de combustíveis, lubrificantes, asfaltos e GLP envasado denomina-se",["revenda.","distribuição.","transferência.","refinação.","importação."],1,["Revenda é venda a varejo, feita por postos e revendedores.","Definição de distribuição (art. 6º, XX).","Refere-se a movimentação em percurso de interesse exclusivo.","Refinação é atividade industrial.","Importação é entrada do produto no País."],"Lei 9.478/1997, art. 6º, XX e XXI."),
Q("Em um poliduto que movimenta diferentes derivados em sequência, a zona de mistura entre dois lotes consecutivos é chamada de",["pig.","interface.","batelada.","estação de compressão.","monobóia."],1,["Pig é dispositivo de limpeza/inspeção.","Interface é a mistura entre bateladas consecutivas.","Batelada é o lote de um produto.","Compressão é etapa de gasodutos.","Monobóia é ponto de amarração em terminais."],"Thomas (org.)."),
Q("De acordo com a Resolução ANP nº 881/2022, o operador de terminal aquaviário deve permitir o acesso ao terminal a qualquer interessado, mediante remuneração e em condições não discriminatórias, sempre que houver",["exigência do carregador proprietário.","capacidade de movimentação ociosa ou disponível.","autorização prévia do Ministério da Infraestrutura em cada solicitação.","contrato de arrendamento portuário com prazo mínimo de 25 anos.","interesse de terceiros majoritários, apenas."],1,["O acesso deve ser não discriminatório entre carregadores, inclusive o proprietário; não depende de exigência dele.","Arts. 3º e 4º: acesso sempre que houver capacidade ociosa ou disponível.","A Resolução não exige autorização prévia do Ministério em cada solicitação.","Não há exigência de contrato de arrendamento como condição de acesso.","O acesso não se limita a terceiros majoritários."],"Resolução ANP nº 881/2022, arts. 3º e 4º."),
Q("Segundo a Resolução ANP nº 881/2022, durante 10 anos contados da primeira autorização de operação da instalação, o carregador proprietário tem direito à preferência do proprietário igual a",["50% da capacidade máxima de movimentação do terminal.","100% da capacidade máxima de movimentação do terminal.","zero.","25% da capacidade operacional.","o volume médio dos últimos 36 meses."],1,["Não é o percentual do art. 9º.","Art. 9º: preferência igual à capacidade máxima, por 10 anos; depois a ANP revisa a cada 5 anos.","A preferência fica igual a zero de ofício se o operador não apresentar a proposta no prazo (art. 12, §2º).","Não é o percentual do art. 9º.","A média de 36 meses entra como um dos parâmetros nas revisões posteriores (art. 10, §3º)."],"Resolução ANP nº 881/2022, arts. 9º, 10 e 12."),
Q("Pela Resolução ANP nº 881/2022, antes de firmar contrato com terceiro interessado majoritário (uso superior a 50% da capacidade máxima de movimentação), o operador deve",["obter aprovação do CADE, em todos os casos.","comunicar à ANP e realizar oferta pública de capacidade, por no mínimo 30 dias.","reduzir a preferência do proprietário a zero.","exigir contrato ship-or-pay.","cobrar remuneração dobrada."],1,["A ANP comunica ao sistema de defesa da concorrência se houver indício de infração (art. 16), mas a aprovação prévia não é exigida em todos os casos.","Art. 18: comunicação à ANP e oferta pública por no mínimo 30 dias.","Não há essa exigência.","Ship-or-pay é modalidade acordada entre as partes.","A remuneração não pode ser discriminatória (art. 7º)."],"Resolução ANP nº 881/2022, art. 18."),
Q("Quanto à Resolução ANP nº 881/2022, é correto afirmar que",["aplica-se aos terminais de GNL, mas não aos de biocombustíveis.","não se aplica a terminais de GNL, e o operador, em regra, não pode comprar nem vender produtos regulados (desverticalização).","permite que o operador compre e revenda livremente os produtos movimentados.","exige que toda negativa de acesso seja apenas comunicada ao Ministério de Minas e Energia.","dispensa o operador de publicar as Condições Gerais de Serviço do Terminal (CGST)."],1,["Os terminais de GNL estão excluídos; biocombustíveis fazem parte do produto regulado.","Art. 1º, §2º, IV (exclui GNL) e art. 28 (o operador não compra, não vende, não importa nem exporta, salvo exceções).","O art. 28 veda, em regra, comprar e vender.","A negativa de acesso é encaminhada à ANP (art. 5º).","O operador deve elaborar e divulgar as CGST (art. 23)."],"Resolução ANP nº 881/2022, arts. 1º, 5º, 23 e 28.")
]});

MODS.push({n:5,t:"Contratação nas estatais: Lei 13.303/2016 (arts. 28 a 91) e LC 123/2006",edital:"Lei 13.303/2016, arts. 28 a 91; LC 123/2006, arts. 42 a 49; LC 147/2014",
alerta:"Teoria da Lei 13.303 conferida no texto oficial enviado (arts. 28 a 91). A LC 147/2014 (que alterou os arts. 43, 47, 48 e 49 da LC 123) foi conferida; os demais artigos da LC 123 (42, 44 a 46) ainda vêm de conhecimento prévio: confira o texto. Os valores em reais do art. 29 podem ter sido atualizados pelo Conselho de Administração (art. 29, §3º) ou por norma interna. A Transpetro tem regulamento próprio de licitações e contratos (art. 40).",
intro:"A Transpetro, subsidiária de sociedade de economia mista, contrata bens e serviços com base no Estatuto das Estatais e em seu regulamento interno. O edital cobra os arts. 28 a 91 da lei (licitação, contratos e fiscalização) e os arts. 42 a 49 da LC 123/2006, que o art. 28, §1º manda aplicar às licitações das estatais.",
obj:["Identificar quando a licitação é exigida, dispensada ou inexigível.","Reconhecer princípios, diretrizes e vedações.","Ordenar as fases e conhecer critérios de julgamento, prazos e recursos.","Conhecer as regras de contratos: garantia, duração, alteração, subcontratação e sanções.","Entender fiscalização e controle, e o tratamento a ME e EPP."],
secs:[
["1. Regra geral e exceções (art. 28)","<p>Os contratos com terceiros para prestação de serviços (inclusive de engenharia e publicidade), aquisição e locação de bens, alienação de bens e ativos ou execução de obras a serem integradas ao patrimônio, e a implementação de ônus real, são <b>precedidos de licitação</b>, ressalvados os arts. 29 e 30. O §1º manda aplicar às licitações das estatais os <b>arts. 42 a 49 da LC 123/2006</b>. O §3º <b>dispensa</b> a observância do capítulo quando: (I) a empresa <b>comercializa, presta ou executa de forma direta</b> produtos, serviços ou obras <b>especificamente relacionados com seus objetos sociais</b>; (II) a escolha do parceiro está associada a suas características particulares, vinculada a <b>oportunidades de negócio</b> definidas e específicas, justificada a inviabilidade de procedimento competitivo (§4º: formação e extinção de parcerias, participações societárias, mercado de capitais).</p>","Lei 13.303/2016, art. 28, §§1º, 3º e 4º."],
["2. Dispensa (art. 29)","<p>É dispensável a licitação, entre outros casos:</p><ul><li>I: obras e serviços de engenharia de valor até <b>R$ 100.000,00</b>, desde que não sejam parcelas de uma mesma obra ou de obras de mesma natureza e local realizáveis conjuntamente.</li><li>II: outros serviços e compras até <b>R$ 50.000,00</b>, e alienações nos casos previstos, sem fracionamento de objeto de maior vulto.</li><li>III: licitação anterior <b>deserta</b> que não possa ser repetida sem prejuízo, mantidas as condições.</li><li>IV: propostas com preços manifestamente superiores aos de mercado.</li><li>V: compra ou locação de imóvel cujas necessidades de instalação e localização condicionem a escolha, com preço compatível com avaliação prévia.</li><li>VI: contratação de remanescente de obra, serviço ou fornecimento em caso de rescisão, respeitada a ordem de classificação.</li><li>VIII: peças e componentes durante a <b>garantia técnica</b>, junto ao fornecedor original quando a exclusividade for indispensável.</li><li>X: concessionário ou permissionário de energia elétrica ou <b>gás natural</b> e outras prestadoras de serviço público, com pertinência ao serviço.</li><li>XI: contratações entre a empresa e suas <b>subsidiárias</b>, com preços de mercado e objeto ligado à atividade estatutária da contratada.</li><li>XV: <b>emergência</b>, somente para bens necessários e parcelas de obras e serviços concluíveis em até <b>180 dias consecutivos e ininterruptos</b>, vedada a prorrogação.</li></ul><p>§3º: os valores dos incisos I e II podem ser alterados por deliberação do <b>Conselho de Administração</b>, admitindo-se valores diferentes por empresa. Ver também os demais incisos (VII, IX, XII a XIV, XVI a XVIII).</p>","Lei 13.303/2016, art. 29."],
["3. Inexigibilidade (art. 30)","<p>Contratação direta quando houver <b>inviabilidade de competição</b>, em especial: (I) aquisição de materiais, equipamentos ou gêneros que só possam ser fornecidos por produtor, empresa ou representante comercial <b>exclusivo</b>; (II) contratação de <b>serviços técnicos especializados</b> com profissionais ou empresas de <b>notória especialização</b>, vedada a inexigibilidade para publicidade e divulgação: estudos técnicos, planejamentos e projetos básicos ou executivos; pareceres, perícias e avaliações; assessorias ou consultorias técnicas e auditorias financeiras ou tributárias; <b>fiscalização, supervisão ou gerenciamento de obras ou serviços</b>; patrocínio ou defesa de causas; treinamento e aperfeiçoamento de pessoal; restauração de obras de arte. Se o órgão de controle externo comprovar sobrepreço ou superfaturamento, respondem <b>solidariamente</b> quem decidiu pela contratação direta e o contratado (§2º). O processo de contratação direta é instruído com situação emergencial (se for o caso), razão da escolha do fornecedor e justificativa do preço (§3º).</p>","Lei 13.303/2016, art. 30."],
["4. Princípios e diretrizes (arts. 31 a 33)","<p>A licitação assegura a proposta <b>mais vantajosa</b>, inclusive quanto ao <b>ciclo de vida do objeto</b>, e evita sobrepreço e superfaturamento. Princípios: impessoalidade, moralidade, igualdade, publicidade, eficiência, probidade administrativa, economicidade, desenvolvimento nacional sustentável, vinculação ao instrumento convocatório, obtenção de competitividade e julgamento objetivo (art. 31).</p><ul><li><b>Sobrepreço</b>: preços orçados ou contratados expressivamente superiores aos referenciais de mercado. <b>Superfaturamento</b>: dano ao patrimônio da empresa (medição de quantidade superior à executada, deficiência de execução, desequilíbrio a favor do contratado, alterações financeiras indevidas). Obras: custos unitários menores ou iguais à mediana do Sinapi (construção civil) ou Sicro (rodoviárias) (art. 31, §2º).</li><li>Diretrizes (art. 32): padronização; busca da <b>maior vantagem competitiva</b> (custos e benefícios diretos e indiretos, econômicos, sociais e ambientais); <b>parcelamento</b> do objeto sem perder economia de escala; <b>preferência pelo pregão</b> para bens e serviços comuns; observação da política de integridade. Pregão eletrônico em portais de acesso público (§3º).</li><li>O objeto é definido de forma sucinta e clara no instrumento convocatório (art. 33).</li></ul>","Lei 13.303/2016, arts. 31 a 33."],
["5. Orçamento, impedimentos, prazos e regulamento (arts. 34 a 41)","<ul><li><b>Valor estimado sigiloso</b>, podendo ser divulgado mediante justificativa na fase de preparação; no critério de <b>maior desconto</b> consta do instrumento convocatório. Sempre disponível aos órgãos de controle (art. 34).</li><li>Empresas que aplicarem sanções informam o cadastro de inidôneas da Lei 12.846/2013 (art. 37).</li><li><b>Impedimentos</b> (art. 38): empresa cujo administrador ou sócio com <b>mais de 5%</b> do capital seja diretor ou empregado da contratante; suspensa pela contratante; declarada inidônea; vinculada por sócios ou administradores a empresa suspensa, impedida ou inidônea. A vedação alcança o empregado ou dirigente como pessoa física, parentes até o <b>terceiro grau civil</b> de dirigentes, de empregados da área responsável e de autoridade do ente controlador, e quem tenha saído da empresa há <b>menos de 6 meses</b>.</li><li><b>Prazos mínimos de propostas</b> (art. 39), contados da divulgação: bens, <b>5 dias úteis</b> (menor preço ou maior desconto) ou <b>10</b> (demais); obras e serviços, <b>15 dias úteis</b> (menor preço ou maior desconto) ou <b>30</b> (demais); <b>45 dias úteis</b> para melhor técnica, técnica e preço, e contratação semi-integrada ou integrada.</li><li><b>Regulamento interno</b> de licitações e contratos (art. 40): glossário, cadastro de fornecedores, minutas-padrão, procedimentos de licitação e contratação direta, recursos, formalização, <b>gestão e fiscalização de contratos</b>, penalidades e recebimento do objeto.</li><li>Aplicam-se as normas penais dos arts. 89 a 99 da Lei 8.666/1993 (art. 41).</li></ul>","Lei 13.303/2016, arts. 34 a 41."],
["6. Obras e serviços de engenharia (arts. 42 a 46)","<ul><li>Regimes (art. 43): empreitada por preço unitário (imprecisão inerente de quantitativos); por preço global (quantidades definíveis no projeto básico); tarefa (autônomos e pequenas empresas, serviços comuns e curtos); empreitada integral (empreendimento pronto para operar); <b>semi-integrada</b> (projeto básico definido; a contratada elabora o executivo); <b>integrada</b> (natureza predominantemente intelectual e de inovação tecnológica, ou tecnologias de domínio restrito; a contratada elabora básico e executivo a partir de anteprojeto).</li><li>Regra: usar a <b>contratação semi-integrada</b>, com justificativa para outro regime; a falta de projeto básico não justifica a integrada (art. 42, §§4º e 5º).</li><li><b>Matriz de riscos</b>: cláusula que define riscos e responsabilidades e caracteriza o equilíbrio econômico-financeiro inicial (art. 42, X). Nas integradas e semi-integradas os riscos ligados à solução do projeto básico da contratante são dela (§3º).</li><li>Licitações de obras exigem <b>projeto básico</b> (exceto integrada), e é vedada a execução sem projeto executivo (art. 43, §§1º e 2º). É vedada a participação de quem elaborou o anteprojeto ou projeto básico (art. 44).</li><li>Permite-se <b>remuneração variável</b> por desempenho (art. 45) e mais de um contrato para serviço de mesma natureza, com justificativa (art. 46).</li></ul>","Lei 13.303/2016, arts. 42 a 46."],
["7. Bens e alienações (arts. 47 a 50)","<p>Na aquisição de bens pode-se indicar <b>marca ou modelo</b> (padronização; única capaz de atender; referência, com \"ou similar ou de melhor qualidade\"), exigir <b>amostra</b> e <b>certificação de qualidade</b> (art. 47). A relação das aquisições é publicada com periodicidade mínima <b>semestral</b> (art. 48). A alienação exige avaliação formal e licitação, ressalvados casos legais (art. 49).</p>","Lei 13.303/2016, arts. 47 a 50."],
["8. Procedimento (arts. 51 a 62)","<p><b>Fases</b> (art. 51): (I) preparação; (II) divulgação; (III) apresentação de lances ou propostas; (IV) julgamento; (V) verificação de efetividade; (VI) negociação; (VII) <b>habilitação</b>; (VIII) recursos; (IX) adjudicação; (X) homologação ou revogação. A habilitação pode, <b>excepcionalmente</b>, anteceder as fases III a VI, <b>desde que expressamente prevista no instrumento convocatório</b> (§1º). Atos preferencialmente por meio eletrônico.</p><ul><li><b>Modos de disputa</b> (art. 52): aberto ou fechado, ou combinação quando o objeto puder ser parcelado. No aberto, lances públicos e sucessivos; o reinício da disputa pode ocorrer se a diferença entre os melhores lances for de pelo menos 10% (art. 53).</li><li><b>Critérios de julgamento</b> (art. 54): menor preço; maior desconto; melhor combinação de técnica e preço; melhor técnica; melhor conteúdo artístico; maior oferta de preço; maior retorno econômico; melhor destinação de bens alienados. Na técnica e preço, a ponderação mais relevante é limitada a <b>70%</b> (§5º).</li><li><b>Desempate</b> (art. 55), na ordem: disputa final; desempenho contratual prévio; critérios da Lei 8.248/1991 e da Lei 8.666/1993, art. 3º, §2º; sorteio.</li><li><b>Verificação de efetividade</b> (art. 56): desclassificam-se propostas com vícios insanáveis, que descumprem especificações técnicas, com preços manifestamente inexequíveis ou acima do orçamento estimado, sem exequibilidade demonstrada ou em desconformidade com o instrumento. Em obras e serviços de engenharia, são inexequíveis as propostas com valor global inferior a <b>70%</b> do menor entre a média das propostas acima de 50% do orçamento e o valor do orçamento (§3º).</li><li><b>Negociação</b> (art. 57): confirmada a efetividade da primeira colocada, a empresa <b>deverá negociar</b> condições mais vantajosas. Se o preço permanecer acima do orçamento, negocia com os demais, na ordem; se ninguém chegar a valor igual ou inferior, a licitação é revogada.</li><li><b>Habilitação</b> (art. 58): documentos aptos a comprovar capacidade jurídica, qualificação técnica restrita a parcelas relevantes, capacidade econômica e financeira.</li><li><b>Recursos</b> (art. 59): fase recursal <b>única</b>, salvo inversão de fases; prazo de <b>5 dias úteis</b> após a habilitação.</li><li><b>Homologação</b> (art. 60) gera direito à celebração do contrato; é vedado contratar com preterição da classificação ou com terceiros estranhos (art. 61). Revogação por interesse público decorrente de fato superveniente, anulação por ilegalidade; a nulidade da licitação induz à do contrato (art. 62).</li></ul>","Lei 13.303/2016, arts. 51 a 62."],
["9. Procedimentos auxiliares (arts. 63 a 67)","<ul><li>São quatro: <b>pré-qualificação permanente</b>, <b>cadastramento</b>, <b>sistema de registro de preços</b> e <b>catálogo eletrônico de padronização</b> (art. 63).</li><li>Pré-qualificação: pública e permanentemente aberta; validade de até <b>1 ano</b> (art. 64). Registros cadastrais: validade máxima de <b>1 ano</b> (art. 65).</li><li>Registro de preços: ampla pesquisa de mercado; controle e atualização periódicos; a existência de preços registrados <b>não obriga</b> a contratar (art. 66).</li></ul>","Lei 13.303/2016, arts. 63 a 67."],
["10. Contratos (arts. 68 a 84)","<ul><li>Regem-se por suas cláusulas, pela lei e pelos <b>preceitos de direito privado</b> (art. 68). Cláusulas necessárias (art. 69): objeto, regime de execução, preço e reajuste, prazos, garantias, direitos e responsabilidades, penalidades, rescisão, vinculação ao instrumento convocatório e à proposta, manutenção das condições de habilitação, <b>matriz de riscos</b>.</li><li><b>Garantia</b> (art. 70): caução em dinheiro, seguro-garantia ou fiança bancária, à escolha do contratado; até <b>5%</b> do valor do contrato, podendo chegar a <b>10%</b> em objetos de grande vulto com complexidade técnica e riscos financeiros elevados.</li><li><b>Duração</b> (art. 71): até <b>5 anos</b>, exceto projetos do plano de negócios e investimentos ou quando prazo maior for prática rotineira de mercado; vedado prazo indeterminado.</li><li>Alteração apenas <b>por acordo</b> entre as partes, sem violar o dever de licitar (art. 72). Assinatura: o convocado que não assinar no prazo perde o direito (decadência); prazo prorrogável uma vez (art. 75).</li><li>O contratado <b>repara vícios</b> às suas expensas e responde por danos a terceiros e à empresa <b>independentemente de culpa ou dolo</b> (art. 76). É responsável pelos encargos trabalhistas, fiscais e comerciais; a inadimplência <b>não transfere</b> à estatal a responsabilidade (art. 77).</li><li><b>Subcontratação</b> até o limite previsto no edital, com qualificação técnica da subcontratada; vedada a subcontratação de quem participou da licitação ou do projeto (art. 78).</li><li><b>Alterações</b> (art. 81): por acordo, nos casos de modificação de projeto, variação quantitativa, substituição de garantia, mudança do regime de execução, da forma de pagamento e para restabelecer o <b>equilíbrio econômico-financeiro</b>. Acréscimos ou supressões até <b>25%</b> do valor inicial atualizado e, em reforma de edifício ou equipamento, até <b>50%</b> para acréscimos (§1º). Reajuste previsto no contrato registra-se por <b>apostila</b> (§7º). É <b>vedado aditivo</b> por evento superveniente alocado na matriz de riscos como responsabilidade da contratada (§8º).</li><li><b>Sanções</b>: multa de mora por atraso injustificado (art. 82). Por inexecução total ou parcial, com prévia defesa: <b>advertência</b>, <b>multa</b> e <b>suspensão temporária</b> de participação em licitação e impedimento de contratar com a entidade sancionadora por prazo <b>não superior a 2 anos</b>; defesa prévia em <b>10 dias úteis</b> quando cumulada com multa (art. 83). O art. 84 estende a suspensão a quem praticar fraude fiscal dolosa ou atos ilícitos contra a licitação.</li></ul>","Lei 13.303/2016, arts. 68 a 84."],
["11. Fiscalização e controle (arts. 85 a 91)","<ul><li>Os órgãos de controle <b>externo e interno</b> fiscalizam quanto à legitimidade, economicidade e eficácia na aplicação de recursos, com acesso irrestrito a documentos, inclusive sigilosos (art. 85).</li><li>Informações de licitações e contratos constam de bancos de dados eletrônicos com acesso em tempo real aos órgãos de controle (art. 86).</li><li>O controle das despesas é feito pelo controle interno e pelo <b>tribunal de contas</b> (art. 87). <b>Qualquer cidadão</b> pode impugnar edital até <b>5 dias úteis</b> antes da data do certame, e a entidade responde em até <b>3 dias úteis</b> (§1º). Qualquer licitante ou pessoa pode representar ao tribunal de contas (§2º).</li><li>Divulgação mensal, por meio eletrônico, de informação sobre a execução de contratos e do orçamento, com retardo admitido de até 2 meses (art. 88).</li><li>A supervisão pelo órgão vinculador e o controle não podem gerar ingerência na gestão (arts. 89 e 90).</li><li>Art. 91: prazo de 24 meses para adaptação das empresas já existentes; licitações e contratos iniciados até o fim desse prazo seguem a legislação anterior.</li></ul>","Lei 13.303/2016, arts. 85 a 91."],
["12. LC 123/2006, arts. 42 a 49 (ME e EPP) e LC 147/2014","<p>O art. 28, §1º da Lei 13.303 manda aplicar às licitações das estatais os arts. 42 a 49 da LC 123/2006. A LC 147/2014 alterou o Capítulo V da LC 123 (\"Do acesso aos mercados\"); o texto da LC 147 foi conferido, o da LC 123 não.</p><ul><li><b>Art. 43, §1º</b> (redação da LC 147): havendo restrição na comprovação da regularidade fiscal, assegura-se prazo de <b>5 dias úteis</b>, cujo termo inicial corresponde ao momento em que o proponente é declarado <b>vencedor</b>, <b>prorrogável por igual período</b>, a critério da administração, para regularizar a documentação, pagar ou parcelar o débito e emitir certidões negativas ou positivas com efeito de negativa. (A referência a regularidade trabalhista foi acrescida por lei posterior: confira o texto vigente da LC 123.)</li><li><b>Art. 47</b> (redação da LC 147): nas contratações públicas da administração direta e indireta deve ser concedido tratamento diferenciado e simplificado às ME e EPP, para promover o desenvolvimento econômico e social no âmbito municipal e regional, ampliar a eficiência das políticas públicas e incentivar a inovação tecnológica. Antes da LC 147, a redação usava \"poderá\"; hoje é \"deverá\".</li><li><b>Art. 48</b> (redação da LC 147): a administração <b>deverá</b> realizar licitação <b>exclusiva</b> para ME e EPP nos itens de valor até <b>R$ 80.000,00</b> (I); <b>poderá</b> exigir subcontratação de ME ou EPP em obras e serviços (II); <b>deverá</b> estabelecer <b>cota de até 25%</b> do objeto para ME e EPP em bens de natureza divisível (III). §3º: os benefícios podem, justificadamente, priorizar ME e EPP sediadas <b>local ou regionalmente</b>, até <b>10%</b> do melhor preço válido.</li><li><b>Art. 49, IV</b> (redação da LC 147): o tratamento diferenciado não se aplica quando a licitação for dispensável ou inexigível (arts. 24 e 25 da Lei 8.666), exceto as dispensas por valor (incisos I e II do art. 24), em que a compra deve ser feita <b>preferencialmente</b> de ME e EPP, aplicando-se o inciso I do art. 48.</li><li><b>Art. 49-A</b>: regime de exportação simplificado para ME e EPP do Simples.</li><li><b>Empate ficto</b> (art. 44): propostas de ME/EPP até 10% acima da melhor (5% no pregão), com direito a cobrir a melhor oferta. <i>Este ponto e os arts. 42, 45 e 46 vêm de conhecimento prévio: confira o texto da LC 123.</i></li></ul>","LC 147/2014 (texto conferido no arquivo enviado); LC 123/2006 (texto não verificado)."]
],
mapa:`CONTRATAÇÃO (Lei 13.303/2016)
├── Art. 28: regra = licitar; §1º LC 123 (arts. 42-49); §3º comercialização/objeto social e
│            oportunidades de negócio dispensam o capítulo
├── Art. 29 dispensa (R$ 100 mil obras / R$ 50 mil demais; emergência 180 dias)
├── Art. 30 inexigibilidade (exclusivo; serviços técnicos de notória especialização)
├── Arts. 31-33: princípios, sobrepreço, parcelamento, pregão
├── Art. 34: valor estimado sigiloso | Art. 38: impedimentos (5%; parentes 3º grau; 6 meses)

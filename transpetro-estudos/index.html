├── Art. 39 prazos: 5/10 (bens) | 15/30 (obras e serviços) | 45 (técnica; integrada)
├── Fases (art. 51): preparação → divulgação → lances → julgamento → efetividade
│      → negociação → HABILITAÇÃO → recursos (5 d.u., fase única) → adjudicação → homologação
├── Art. 54 critérios | Art. 55 desempate | Art. 56 desclassificação | Art. 57 negociação
├── Art. 63 auxiliares: pré-qualificação, cadastro, SRP, catálogo
├── Contratos: direito privado; garantia 5% (10%); 5 anos; alteração 25% (50%); sanções ≤ 2 anos
└── Controle: TCU/controle interno; impugnação por cidadão (art. 87: 5 d.u.; resposta 3 d.u.)`,
q:[
Q("Nos termos do art. 28, §3º, da Lei 13.303/2016, as empresas públicas e sociedades de economia mista são dispensadas da observância dos dispositivos do capítulo de licitações, entre outras hipóteses, na",["compra de qualquer bem, independentemente de valor.","comercialização, prestação ou execução, de forma direta, de produtos, serviços ou obras especificamente relacionados com seus objetos sociais.","contratação de serviços de limpeza de suas instalações.","contratação de obras de escritórios administrativos.","aquisição de material de escritório de grande valor."],1,["Compras em geral seguem a regra de licitar, salvo dispensa ou inexigibilidade.","Hipótese do art. 28, §3º, I.","Serviços de limpeza são atividade-meio e seguem o regime de licitação.","Obras administrativas não estão especificamente relacionadas ao objeto social.","Compras de grande valor são licitadas."],"Lei 13.303/2016, art. 28, §3º, I."),
Q("Na redação original do art. 29 da Lei 13.303/2016, é dispensável a licitação para obras e serviços de engenharia e para outros serviços e compras, respectivamente, de valor até",["R$ 50.000,00 e R$ 100.000,00.","R$ 100.000,00 e R$ 50.000,00.","R$ 80.000,00 e R$ 80.000,00.","R$ 200.000,00 e R$ 100.000,00.","R$ 10.000,00 e R$ 8.000,00."],1,["Inverte os valores.","Art. 29, I (R$ 100 mil para engenharia) e II (R$ 50 mil para outros serviços e compras).","R$ 80 mil é o limite de licitação exclusiva para ME/EPP (LC 123, art. 48).","Não são os valores do art. 29.","Não são os valores do art. 29."],"Lei 13.303/2016, art. 29, I e II e §3º (valores podem ser alterados pelo Conselho de Administração)."),
Q("Na sequência de fases prevista no art. 51 da Lei 13.303/2016, a habilitação ocorre, como regra,",["antes da apresentação de lances ou propostas.","depois do julgamento, da verificação de efetividade e da negociação, podendo excepcionalmente antecedê-los se expressamente previsto no instrumento convocatório.","somente após a homologação.","apenas em licitações de obras.","depois da adjudicação."],1,["Só ocorre excepcionalmente, se prevista no instrumento convocatório.","Art. 51, VII e §1º.","A homologação é a última fase.","Aplica-se a qualquer objeto.","A adjudicação vem depois da habilitação e dos recursos."],"Lei 13.303/2016, art. 51 e §1º."),
Q("Segundo o art. 57 da Lei 13.303/2016, confirmada a efetividade da proposta que ficou em primeiro lugar na etapa de julgamento, a empresa estatal",["deve adjudicar imediatamente, sem qualquer negociação.","deve negociar condições mais vantajosas com quem a apresentou e, se o preço permanecer acima do orçamento, negociar com os demais licitantes, na ordem, revogando a licitação se ninguém chegar a valor igual ou inferior ao orçamento.","deve sortear entre os licitantes.","deve abrir nova licitação obrigatoriamente.","pode negociar somente com o último colocado."],1,["A negociação é obrigatória (\"deverão negociar\").","Art. 57, caput, §1º e §3º.","Sorteio é o último critério de desempate (art. 55, IV), não regra de negociação.","A revogação só ocorre se ninguém chegar ao orçamento estimado.","A negociação começa com o primeiro colocado."],"Lei 13.303/2016, art. 57."),
Q("Quanto às garantias contratuais previstas na Lei 13.303/2016, é correto afirmar que",["a garantia é sempre obrigatória e de 30% do contrato.","o limite geral é de 5% do valor do contrato, podendo chegar a 10% em objetos de grande vulto com complexidade técnica e riscos financeiros elevados.","somente é aceita caução em dinheiro.","não pode ser exigida garantia em contratos de obras.","o limite é de 25% em qualquer contrato."],1,["A garantia pode ser exigida, mas não é de 30%.","Art. 70, §§2º e 3º.","A escolha da modalidade (caução, seguro-garantia ou fiança) é do contratado (§1º).","Pode ser exigida em obras, serviços e compras (caput).","25% é o limite de acréscimos e supressões (art. 81, §1º)."],"Lei 13.303/2016, art. 70."),
Q("Um contrato regido pela Lei 13.303/2016 tem, como regra geral, limite de acréscimos ou supressões nas mesmas condições contratuais de",["10% do valor inicial atualizado.","25% do valor inicial atualizado, e até 50% para acréscimos em reforma de edifício ou de equipamento.","50% para qualquer obra nova.","100% do valor inicial atualizado.","não há limite."],1,["Não é o percentual do art. 81.","Art. 81, §1º.","O limite de 50% vale só para acréscimos em reforma de edifício ou equipamento.","Excede os limites legais.","Há limites legais, salvo supressões por acordo (art. 81, §2º)."],"Lei 13.303/2016, art. 81, §§1º e 2º."),
Q("A respeito das sanções administrativas da Lei 13.303/2016, pela inexecução total ou parcial do contrato, garantida a prévia defesa, a empresa pode aplicar",["apenas advertência.","advertência, multa e suspensão temporária de participação em licitação e impedimento de contratar com a entidade sancionadora por prazo não superior a 2 anos.","declaração de inidoneidade por prazo indeterminado, em qualquer caso.","apenas multa de até 10% do contrato.","prisão administrativa do representante legal."],1,["Há três sanções previstas.","Art. 83, I a III.","A declaração de inidoneidade não consta do rol do art. 83; a lei fala em cadastro de empresas inidôneas em outra sede (art. 37).","O art. 83 não fixa esse teto para a multa.","Não existe."],"Lei 13.303/2016, art. 83."),
Q("Segundo o art. 87, §1º, da Lei 13.303/2016, qualquer cidadão é parte legítima para impugnar edital de licitação por irregularidade na aplicação da lei, devendo protocolar o pedido até",["30 dias antes da data do certame.","5 dias úteis antes da data fixada para a ocorrência do certame, cabendo à entidade responder em até 3 dias úteis.","o dia seguinte à publicação.","2 dias corridos após a abertura das propostas.","não há prazo."],1,["Não é o prazo legal.","Art. 87, §1º.","Não é o prazo legal.","Não é o prazo legal.","Há prazo legal."],"Lei 13.303/2016, art. 87, §1º."),
Q("Segundo o art. 48 da LC 123/2006, na redação da LC 147/2014, a administração pública deverá realizar processo licitatório destinado exclusivamente à participação de ME e EPP nos itens de contratação cujo valor seja de até",["R$ 8.000,00.","R$ 80.000,00.","R$ 800.000,00.","R$ 100.000,00.","R$ 50.000,00."],1,["Valor abaixo do limite legal.","Art. 48, I: até R$ 80.000,00.","Valor acima do limite legal.","R$ 100 mil é o limite de dispensa para obras e serviços de engenharia (Lei 13.303, art. 29, I).","R$ 50 mil é o limite de dispensa para outros serviços e compras (Lei 13.303, art. 29, II)."],"LC 123/2006, art. 48, I (redação da LC 147/2014)."),
Q("Segundo a LC 123/2006, em licitação na modalidade pregão, considera-se empate ficto quando a proposta de microempresa ou empresa de pequeno porte for",["igual ou até 5% superior à melhor proposta classificada.","igual ou até 10% superior à melhor proposta classificada.","até 20% superior à melhor proposta.","inferior à melhor proposta.","igual à melhor proposta, apenas."],0,["No pregão, o intervalo é de até 5% (art. 44, §2º).","10% é o intervalo geral para as demais modalidades.","Não é o percentual legal.","Proposta inferior já seria a melhor.","O empate ficto abrange também propostas até o limite percentual superior."],"LC 123/2006, art. 44 (conferir texto).")
]});

MODS.push({n:6,t:"Tributos aplicáveis ao setor",edital:"IRPJ/CSLL, IRRF, ICMS, participações governamentais, PIS/PASEP, COFINS, CIDE, ISS, contribuição previdenciária, EC 132/2023, LC 214/2025",
alerta:"Alíquotas, limites e regimes mudam com frequência (especialmente na reforma tributária, em transição). A CIDE (Leis 10.336/2001 e 10.636/2002) foi conferida nos textos enviados. <b>O restante (IRPJ, PIS/COFINS, ICMS, ISS, previdência, reforma tributária) vem de conhecimento prévio</b>: confirme cada número na legislação vigente. O edital pede \"conhecimentos básicos\".",
intro:"O item de tributos do edital é amplo. O foco aqui é: qual tributo é de qual ente, o que tributa, o que é retenção na fonte e o que muda com a reforma (EC 132/2023 e LC 214/2025).",
obj:["Identificar competência, incidência e natureza de cada tributo listado.","Distinguir regime cumulativo e não cumulativo de PIS/COFINS.","Entender a CIDE-combustíveis e as participações governamentais do petróleo.","Compreender IRRF e retenções na contratação de serviços.","Conhecer a estrutura da reforma tributária: CBS, IBS e Imposto Seletivo."],
secs:[
["1. IRPJ e CSLL","<ul><li><b>IRPJ</b>: tributo federal sobre o lucro das pessoas jurídicas. Alíquota de 15%, mais <b>adicional de 10%</b> sobre a parcela do lucro que exceder R$ 20 mil por mês (R$ 240 mil por ano). Regimes: lucro real, presumido e arbitrado (Lei 9.249/1995).</li><li><b>CSLL</b>: contribuição social sobre o lucro líquido, com alíquota geral de 9% (Lei 7.689/1988), maior para instituições financeiras.</li></ul>","Lei 9.249/1995 (art. 3º); Lei 7.689/1988; RIR/2018 (Decreto 9.580)."],
["2. IRRF (Imposto de Renda Retido na Fonte)","<p>Mecanismo em que a fonte pagadora <b>retém e recolhe</b> o imposto de renda devido pelo beneficiário do rendimento (salários, serviços, aluguéis, juros, remessas ao exterior etc.). Funciona como <b>antecipação</b> do imposto devido ou como tributação definitiva, conforme o rendimento. Nos pagamentos de PJ a PJ por certos serviços, há retenção de IRRF e ainda das contribuições PIS, COFINS e CSLL (retenção conjunta de 4,65% sobre os pagamentos sujeitos à regra, Lei 10.833/2003, art. 30). Alíquotas de IRRF variam conforme a natureza do rendimento (consulte o RIR).</p>","RIR/2018; Lei 10.833/2003, art. 30."],
["3. PIS/PASEP e COFINS","<p>Contribuições federais sobre receita/faturamento. Regime <b>não cumulativo</b> (geral para lucro real): PIS 1,65% e COFINS 7,6%, com direito a crédito sobre insumos e despesas listadas (Leis 10.637/2002 e 10.833/2003). Regime <b>cumulativo</b>: PIS 0,65% e COFINS 3% (Lei 9.718/1998), sem créditos. Combustíveis têm regime especial (incidência concentrada/monofásica) definido em lei.</p>","Leis 10.637/2002, 10.833/2003 e 9.718/1998."],
["4. ICMS","<p>Imposto <b>estadual e distrital</b> sobre operações relativas à circulação de mercadorias e serviços de transporte interestadual e intermunicipal e de comunicação (CF, art. 155, II; LC 87/1996). É <b>não cumulativo</b>. Sobre operações com energia elétrica, telecomunicações, derivados de petróleo, combustíveis e minerais, nenhum outro imposto pode incidir além de ICMS, imposto de importação e imposto de exportação (CF, art. 155, §3º). A tributação monofásica de combustíveis foi introduzida pela LC 192/2022 (confira o regramento vigente).</p>","CF, art. 155; LC 87/1996; LC 192/2022."],
["5. ISS","<p>Imposto <b>municipal e distrital</b> sobre serviços da lista da LC 116/2003, com alíquotas entre 2% e 5% (alíquota mínima e máxima definidas em lei complementar). Em regra, é devido no local do estabelecimento do prestador, com exceções previstas na lei (por exemplo, construção civil, no local da obra).</p>","LC 116/2003; CF, art. 156, III."],
["6. Contribuição previdenciária","<p>Contribuição patronal de <b>20% sobre a folha</b> (Lei 8.212/1991, art. 22, I), acrescida do RAT (1%, 2% ou 3%, conforme o risco) e de contribuições a terceiros. Na contratação de serviços mediante <b>cessão de mão de obra</b> ou empreitada, a contratante retém <b>11%</b> do valor da nota e recolhe em nome do prestador (art. 31). Confira as regras de desoneração vigentes.</p>","Lei 8.212/1991, arts. 22 e 31."],
["7. CIDE-combustíveis (Lei 10.336/2001)","<ul><li><b>Instituição</b>: Cide incidente sobre a importação e a comercialização de petróleo e derivados, gás natural e derivados e álcool etílico combustível (art. 1º; CF, arts. 149 e 177).</li><li><b>Contribuintes</b> (art. 2º): o <b>produtor</b>, o <b>formulador</b> e o <b>importador</b>, pessoa física ou jurídica, dos combustíveis líquidos listados.</li><li><b>Fatos geradores</b> (art. 3º): operações de <b>importação</b> e de <b>comercialização no mercado interno</b> de gasolinas e suas correntes; diesel e suas correntes; querosene de aviação e outros querosenes; óleos combustíveis (fuel-oil); GLP, inclusive o derivado de gás natural e de nafta; álcool etílico combustível. <b>Não incide</b> sobre receitas de exportação (§2º).</li><li><b>Base de cálculo</b>: a unidade de medida (m³ ou tonelada) adotada na lei (art. 4º), com <b>alíquotas específicas</b> em reais por unidade. Valores fixados no art. 5º (redação da Lei 10.636/2002): gasolina R$ 860,00/m³; diesel R$ 390,00/m³; querosene de aviação e outros querosenes R$ 92,10/m³; óleos combustíveis R$ 40,90/t; GLP R$ 250,00/t; álcool etílico combustível R$ 37,20/m³. O Poder Executivo pode <b>reduzir e restabelecer</b> as alíquotas até o valor do art. 5º (art. 9º), portanto esses valores são o teto legal, e não necessariamente o valor cobrado hoje.</li><li><b>Pagamento</b> (art. 6º): na importação, na data do registro da Declaração de Importação; na comercialização, apuração mensal e pagamento até o último dia útil da primeira quinzena do mês seguinte.</li><li><b>Deduções</b>: da Cide devida na comercialização pode-se deduzir a paga na importação ou embutida na aquisição de outro contribuinte (art. 7º); a Cide também pode ser deduzida de PIS/Pasep e Cofins, até limites por produto (art. 8º).</li><li><b>Isenção</b> (art. 10): venda a empresa comercial exportadora com fim específico de exportação; se não exportar em <b>180 dias</b>, paga a Cide.</li><li><b>Administração e fiscalização</b>: Secretaria da Receita Federal (art. 13).</li><li><b>Destinação</b> (art. 1º, §1º): (I) subsídios a preços ou transporte de álcool combustível, gás natural e derivados e derivados de petróleo; (II) projetos ambientais da indústria do petróleo e do gás; (III) programas de infraestrutura de transportes; (IV) auxílio para mitigar o efeito do preço do GLP no orçamento de famílias de baixa renda. A União repassa aos Estados e ao DF a parcela do art. 159, III, da CF, para infraestrutura de transportes, com critérios de 40% (malha viária), 30% (consumo dos combustíveis), 20% (população) e 10% (partes iguais) (art. 1º-A); 25% do valor de cada Estado vai aos Municípios (art. 1º-B).</li></ul><p>A versão consultada indica remissões a alterações recentes (Lei 15.432/2026 e LC 214/2025): confirme a redação vigente.</p>","Lei 10.336/2001 (texto atualizado, conferido no arquivo enviado)."],
["7-B. Aplicação dos recursos da Cide (Lei 10.636/2002)","<ul><li>Fixa critérios e diretrizes para aplicação da arrecadação da Cide e cria o <b>FNIT</b> (Fundo Nacional de Infraestrutura de Transportes) (art. 1º).</li><li><b>Projetos ambientais</b> da indústria do petróleo e do gás, administrados pelo <b>Ministério do Meio Ambiente</b>: monitoramento e fiscalização de atividades poluidoras, planos de contingência, estudos e educação ambiental, apoio a unidades de conservação, recuperação de áreas degradadas, gestão de florestas e recursos genéticos e produção de biocombustíveis (art. 4º).</li><li><b>Infraestrutura de transportes</b>: objetivos essenciais incluem a redução do consumo de combustíveis automotivos, o atendimento mais econômico da demanda de transporte, a segurança e o conforto dos usuários e a menor participação de fretes e custos portuários na formação dos preços (art. 6º).</li><li>É <b>vedada</b> a aplicação de recursos da Cide em investimentos de responsabilidade dos concessionários (arts. 4º, §1º, e 8º).</li><li><b>FNIT</b> (art. 10): vinculado ao Ministério dos Transportes, <b>fundo contábil de natureza financeira</b>, destinado a financiar programas de investimento em infraestrutura de transportes; aplicação <b>multimodal</b> (art. 11, §1º).</li></ul>","Lei 10.636/2002 (texto atualizado, conferido no arquivo enviado)."],
["8. Participações governamentais","<p>Previstas na Lei 9.478/1997, art. 45: <b>bônus de assinatura</b>, <b>royalties</b>, <b>participação especial</b> (sobre campos de grande produção ou rentabilidade) e <b>pagamento pela ocupação ou retenção de área</b>. Os royalties são a compensação financeira pela exploração, calculados sobre a produção (a lei fixa 10% como alíquota básica, reduzível em certas condições). Não são tributos em sentido estrito, mas receitas patrimoniais.</p>","Lei 9.478/1997, arts. 45 a 52."],
["9. Reforma tributária: EC 132/2023 e LC 214/2025","<p>A EC 132/2023 criou o <b>IBS</b> (imposto sobre bens e serviços, de competência de estados e municípios), a <b>CBS</b> (contribuição sobre bens e serviços, federal) e o <b>Imposto Seletivo</b> (sobre bens e serviços prejudiciais à saúde ou ao meio ambiente). O IBS substitui ICMS e ISS; a CBS substitui PIS e COFINS (e o IPI é reduzido). A LC 214/2025 regulamenta IBS, CBS e Imposto Seletivo. A transição é gradual (a partir de 2026, com fase de teste, e substituição progressiva até 2033). Princípios: não cumulatividade ampla, cobrança no destino e neutralidade.</p>","EC 132/2023; LC 214/2025 (confira o cronograma de transição)."]
],
mapa:`TRIBUTOS
├── Federais: IRPJ (15% + 10% adicional > R$ 20 mil/mês), CSLL (9%),
│             PIS/COFINS (não cumulativo 1,65% / 7,6%), CIDE, IRRF
├── Estadual: ICMS | Municipal: ISS (2% a 5%)
├── Previdência: 20% patronal + RAT; retenção de 11% (cessão de mão de obra)
├── CIDE-combustíveis: importação e comercialização (Lei 10.336)
├── Participações governamentais (art. 45, Lei 9.478):
│   bônus de assinatura, royalties, participação especial, ocupação de área
└── Reforma: CBS (federal) ← PIS/COFINS; IBS (estados/municípios) ← ICMS/ISS;
    Imposto Seletivo; transição até 2033`,
q:[
Q("Nos termos usuais da legislação do IRPJ, incide adicional de 10% sobre a parcela do lucro que exceder, por mês,",["R$ 2.000,00.","R$ 20.000,00.","R$ 200.000,00.","R$ 2.000.000,00.","não há adicional."],1,["Valor abaixo do limite legal.","O adicional incide sobre a parcela do lucro que exceder R$ 20 mil por mês (R$ 240 mil por ano).","Valor acima do limite legal.","Valor acima do limite legal.","Existe adicional de 10%."],"Lei 9.249/1995, art. 3º."),
Q("No regime não cumulativo, as alíquotas gerais de PIS/PASEP e COFINS são, respectivamente,",["0,65% e 3%.","1,65% e 7,6%.","9% e 15%.","2% e 5%.","7,6% e 1,65%."],1,["São as alíquotas do regime cumulativo.","São as alíquotas do regime não cumulativo (Leis 10.637/2002 e 10.833/2003).","Referem-se a CSLL e à alíquota-base do IRPJ.","2% a 5% é a faixa do ISS.","Inverte as alíquotas."],"Leis 10.637/2002 e 10.833/2003."),
Q("A CIDE-combustíveis, instituída pela Lei 10.336/2001, tem como contribuintes",["apenas os postos revendedores.","o produtor, o formulador e o importador dos combustíveis líquidos listados na lei.","o consumidor final.","apenas a Petrobras.","apenas o distribuidor de GLP."],1,["A revenda a varejo não é o contribuinte legal.","Art. 2º: produtor, formulador e importador.","O consumidor final não é contribuinte legal.","Qualquer produtor, formulador ou importador é contribuinte, não só a Petrobras.","O distribuidor não é o contribuinte definido no art. 2º."],"Lei 10.336/2001, art. 2º."),
Q("Segundo a Lei 10.336/2001, a Cide-combustíveis",["incide também sobre as receitas de exportação de petróleo bruto.","tem como fatos geradores a importação e a comercialização no mercado interno de gasolinas, diesel, querosenes, óleos combustíveis, GLP e álcool etílico combustível, e não incide sobre receitas de exportação.","incide sobre a folha de salários do setor.","é administrada pela ANP.","tem alíquota ad valorem única de 10%."],1,["O art. 3º, §2º afasta a incidência sobre receitas de exportação.","Art. 3º, caput e §2º.","Não incide sobre folha.","A administração e a fiscalização são da Secretaria da Receita Federal (art. 13).","As alíquotas são específicas, em reais por m³ ou tonelada (art. 5º)."],"Lei 10.336/2001, arts. 3º, 5º e 13."),
Q("A Lei 10.636/2002, que trata da aplicação dos recursos da Cide, criou o",["Fundo Social do pré-sal.","Fundo Nacional de Infraestrutura de Transportes (FNIT), vinculado ao Ministério dos Transportes.","Fundo de Garantia do Tempo de Serviço.","Fundo Nacional do Petróleo, vinculado à ANP.","Fundo Soberano do Brasil."],1,["O Fundo Social é citado na Lei 9.478 (art. 50), não na 10.636.","Art. 10: FNIT, fundo contábil de natureza financeira.","Não é fundo criado por essa lei.","Não existe esse fundo na lei.","Não é fundo criado por essa lei."],"Lei 10.636/2002, art. 10."),
Q("De acordo com a Lei 9.478/1997, NÃO integra o rol de participações governamentais",["bônus de assinatura.","royalties.","participação especial.","pagamento pela ocupação ou retenção de área.","imposto de importação."],4,["Integra o rol (art. 45).","Integra o rol.","Integra o rol.","Integra o rol.","O imposto de importação é tributo federal, sem relação com as participações do art. 45."],"Lei 9.478/1997, art. 45."),
Q("Após a regulamentação da reforma tributária (EC 132/2023 e LC 214/2025), a CBS e o IBS passam a substituir, respectivamente,",["ISS e ICMS.","PIS/COFINS e ICMS/ISS.","IRPJ e CSLL.","IPVA e IPTU.","CIDE e royalties."],1,["Inverte a lógica: ISS e ICMS serão substituídos pelo IBS, em conjunto.","A CBS (federal) substitui PIS e COFINS; o IBS substitui ICMS e ISS.","Tributos sobre a renda não são substituídos.","Impostos patrimoniais não são substituídos.","Não são substituídos por CBS/IBS."],"EC 132/2023; LC 214/2025.")
]});

MODS.push({n:7,t:"Matemática financeira e avaliação econômica (VPL e TIR)",edital:"Matemática financeira; métodos de avaliação econômica; VPL e TIR",
intro:"Base para análise de investimentos, contratos e financiamentos. As questões costumam pedir cálculo direto de juros compostos, taxas equivalentes, valor presente líquido e interpretação da TIR.",
obj:["Aplicar juros simples e compostos.","Converter taxas (equivalentes, nominal, efetiva e real).","Calcular séries uniformes e comparar SAC e Price.","Calcular e interpretar VPL e TIR, e o payback."],
secs:[
["1. Juros simples e compostos","<ul><li>Simples: <code>J = C·i·n</code>; <code>M = C(1 + i·n)</code>.</li><li>Compostos: <code>M = C(1 + i)ⁿ</code>. Desconto composto: <code>C = M/(1 + i)ⁿ</code>.</li><li>Taxas <b>equivalentes</b> (compostas): <code>(1 + i_a) = (1 + i_m)¹²</code>. Taxas <b>proporcionais</b> (juros simples) dividem a taxa pelo número de períodos.</li><li>Taxa <b>nominal</b> (capitalização diferente do período da taxa) × <b>efetiva</b>.</li><li>Taxa <b>real</b>: <code>(1 + r) = (1 + i)/(1 + π)</code>, com π a inflação.</li></ul>","ASSAF NETO, A. <i>Matemática Financeira e suas Aplicações</i>, Atlas."],
["2. Séries uniformes e amortização","<ul><li>Valor presente de série postecipada: <code>PV = PMT · [1 − (1 + i)⁻ⁿ]/i</code>. Valor futuro: <code>FV = PMT · [(1 + i)ⁿ − 1]/i</code>. Perpetuidade: <code>PV = PMT/i</code>.</li><li><b>SAC</b>: amortização constante; juros e prestações <b>decrescentes</b>.</li><li><b>Price (tabela Price)</b>: prestações constantes; amortização <b>crescente</b>, juros decrescentes.</li></ul>","ASSAF NETO."],
["3. Avaliação de investimentos","<ul><li><b>VPL</b> = Σ FCₜ/(1 + k)ᵗ − I₀, com k = taxa mínima de atratividade (TMA/custo de capital). VPL &gt; 0: projeto cria valor (aceitar).</li><li><b>TIR</b>: taxa que <b>zera o VPL</b>. Regra: aceitar se TIR &gt; TMA.</li><li><b>Payback</b> simples: tempo para recuperar o investimento (ignora o valor do dinheiro no tempo e o fluxo após a recuperação); descontado usa fluxos trazidos a valor presente.</li><li>Fluxos com várias inversões de sinal podem ter mais de uma TIR; para projetos mutuamente exclusivos o VPL é o critério preferível.</li></ul>","BREALEY, R.; MYERS, S.; ALLEN, F. <i>Princípios de Finanças Corporativas</i>, AMGH; GITMAN, L. <i>Princípios de Administração Financeira</i>."]
],
mapa:`MATEMÁTICA FINANCEIRA
├── Simples: M = C(1 + in)   Compostos: M = C(1 + i)^n
├── Taxas: equivalente (compostas) × proporcional (simples); real = (1+i)/(1+π) − 1
├── Séries: PV = PMT[1 − (1+i)^-n]/i;  SAC × Price
└── Projetos: VPL > 0 aceita | TIR = taxa que zera VPL | aceita se TIR > TMA | payback`,
q:[
Q("O montante obtido pela aplicação de R$ 1.000,00 a juros compostos de 10% ao ano, por 2 anos, é de",["R$ 1.100,00.","R$ 1.200,00.","R$ 1.210,00.","R$ 1.220,00.","R$ 1.331,00."],2,["Um ano de juros apenas.","Seria o montante a juros simples em 2 anos.","M = 1000 · 1,1² = 1210.","Erro de cálculo.","Corresponde a 3 anos."],"Assaf Neto."),
Q("A taxa anual equivalente, em juros compostos, a uma taxa de 1% ao mês é de aproximadamente",["12,00%.","12,68%.","13,00%.","11,50%.","10,00%."],1,["Seria a taxa proporcional (juros simples), não a equivalente.","1,01¹² − 1 ≈ 0,1268.","Sem base no cálculo.","Sem base no cálculo.","Sem base no cálculo."],"Assaf Neto."),
Q("Um projeto exige investimento inicial de R$ 1.000,00 e retorna R$ 600,00 ao final de cada um dos dois anos seguintes. Adotando taxa mínima de atratividade de 10% ao ano, o VPL é de aproximadamente",["R$ 200,00.","R$ 41,30.","−R$ 41,30.","R$ 100,00.","zero."],1,["Soma fluxos sem descontar (1200 − 1000).","VPL = 600/1,1 + 600/1,21 − 1000 ≈ 545,45 + 495,87 − 1000 ≈ 41,3.","Sinal invertido.","Sem base no cálculo.","VPL zero ocorreria se a TIR fosse exatamente 10%."],"Brealey; Myers; Allen."),
Q("Um investimento de R$ 100,00 gera um único retorno de R$ 121,00 ao final do segundo ano. A taxa interna de retorno (TIR) é de",["10% ao ano.","21% ao ano.","11% ao ano.","5% ao ano.","20% ao ano."],0,["100·(1 + i)² = 121, então 1 + i = 1,1 e i = 10%.","21% é o ganho total no período, não a taxa anual.","Sem base no cálculo.","Sem base no cálculo.","Sem base no cálculo."],"Definição de TIR (Brealey; Myers; Allen)."),
Q("Sobre os sistemas de amortização, é correto afirmar que",["no SAC as prestações são constantes e a amortização cresce.","na tabela Price as prestações são constantes e a parcela de juros decresce ao longo do tempo.","no SAC a amortização é decrescente.","na tabela Price a amortização é constante.","em ambos os sistemas a parcela de juros é constante."],1,["No SAC a amortização é constante e as prestações decrescem.","Na Price a prestação é constante; a amortização cresce e os juros decrescem.","No SAC a amortização é constante.","Na Price a amortização é crescente.","A parcela de juros decresce nos dois, pois incide sobre saldo devedor decrescente."],"Assaf Neto.")
]});

MODS.push({n:8,t:"Noções de micro e macroeconomia",edital:"Noções elementares de micro e macroeconomia",
intro:"Conceitos básicos: formação de preços, elasticidades, estruturas de mercado e indicadores e políticas macroeconômicas. Úteis para entender a comercialização de combustíveis e o ambiente de negócios.",
obj:["Analisar oferta, demanda e equilíbrio.","Calcular e interpretar elasticidades.","Distinguir estruturas de mercado.","Explicar PIB, inflação, política monetária e fiscal, câmbio e balanço de pagamentos."],
secs:[
["1. Demanda, oferta e equilíbrio","<ul><li>Lei da demanda: preço sobe, quantidade demandada cai (<i>ceteris paribus</i>). Lei da oferta: preço sobe, quantidade ofertada sobe.</li><li>Variação do <b>preço do próprio bem</b> = movimento <b>ao longo</b> da curva. Variação de renda, preços de outros bens, preferências ou expectativas = <b>deslocamento</b> da curva.</li><li>Bens normais (demanda sobe com a renda) e inferiores; <b>substitutos</b> (preço de um sobe, demanda do outro sobe) e <b>complementares</b>.</li><li>Equilíbrio: preço em que quantidade demandada = ofertada.</li></ul>","MANKIW, N. G. <i>Introdução à Economia</i>; VASCONCELLOS, M. A. S. <i>Economia: Micro e Macro</i>, Atlas."],
["2. Elasticidades","<ul><li><b>Elasticidade-preço da demanda</b>: E = %ΔQ / %ΔP. |E| &gt; 1: elástica; |E| &lt; 1: inelástica; |E| = 1: unitária.</li><li>Demanda <b>inelástica</b>: aumento de preço <b>eleva</b> a receita total. Demanda <b>elástica</b>: aumento de preço reduz a receita.</li><li>Elasticidade-renda e elasticidade cruzada (positiva entre substitutos, negativa entre complementares).</li></ul>","MANKIW; PINDYCK, R.; RUBINFELD, D. <i>Microeconomia</i>."],
["3. Estruturas de mercado e custos","<ul><li>Concorrência perfeita (muitos agentes, preço dado); monopólio (um vendedor); oligopólio (poucos vendedores, interdependência); concorrência monopolística (diferenciação).</li><li>Custos: fixos, variáveis, totais, médios e <b>marginal</b>. Empresas maximizam lucro onde receita marginal = custo marginal. Economias de escala: custo médio decresce com a produção.</li><li>Falhas de mercado: externalidades, bens públicos, assimetria de informação.</li></ul>","MANKIW; PINDYCK; RUBINFELD."],
["4. Macroeconomia","<ul><li><b>PIB</b>: valor dos bens e serviços finais produzidos. Ótica da despesa: <code>Y = C + I + G + X − M</code>.</li><li><b>Inflação</b>: aumento geral e persistente de preços (medida no Brasil por índices como o IPCA).</li><li><b>Política monetária</b>: controle de juros e liquidez (no Brasil, o Copom define a meta da taxa Selic). Alta de juros tende a conter demanda e inflação. <b>Política fiscal</b>: gastos e tributos do governo.</li><li><b>Câmbio</b>: depreciação da moeda local encarece importações e favorece exportações. <b>Balanço de pagamentos</b>: transações correntes, conta capital e conta financeira.</li></ul>","MANKIW, N. G. <i>Macroeconomia</i>; VASCONCELLOS."]
],
mapa:`ECONOMIA
├── Micro: demanda/oferta, equilíbrio; deslocamento × movimento
│   ├── Elasticidade: |E| > 1 elástica; inelástica → preço ↑ = receita ↑
│   └── Mercados: concorrência perfeita, monopólio, oligopólio

q:[
Q("Se o preço de um bem aumenta 10% e a quantidade demandada diminui 5%, a elasticidade-preço da demanda, em módulo, é",["0,5, e a demanda é inelástica.","2,0, e a demanda é elástica.","1,0, e a demanda é unitária.","0,5, e a demanda é elástica.","5,0, e a demanda é inelástica."],0,["|E| = 5/10 = 0,5 < 1: inelástica.","Seria o resultado de dividir 10 por 5.","Exigiria variações iguais.","0,5 indica demanda inelástica, não elástica.","Erro de cálculo."],"Mankiw; Pindyck e Rubinfeld."),
Q("Um aumento da renda dos consumidores, para um bem normal, tende a",["deslocar a curva de demanda para a direita.","deslocar a curva de demanda para a esquerda.","provocar movimento ao longo da curva de oferta apenas.","reduzir a quantidade de equilíbrio.","não afetar a demanda."],0,["Bens normais têm demanda crescente com a renda.","Seria o caso de um bem inferior.","O efeito primário é sobre a demanda.","Com demanda maior, a quantidade de equilíbrio tende a aumentar.","A renda é determinante da demanda."],"Mankiw."),
Q("Pela ótica da despesa, o PIB é dado por",["C + I + G + X − M.","C + I + G − X + M.","C + I − G + X − M.","C − I + G + X + M.","apenas C + G."],0,["Consumo + investimento + gastos do governo + exportações − importações.","Sinais de X e M invertidos.","G tem sinal positivo.","I tem sinal positivo e M, negativo.","Omite componentes."],"Mankiw; Vasconcellos."),
Q("Se o preço do etanol aumenta, mantidas as demais condições, tende a aumentar a demanda por gasolina, o que ilustra que os dois bens são",["complementares.","substitutos.","inferiores.","bens públicos.","de Giffen."],1,["Complementares teriam demanda que cai quando o preço do outro sobe.","Elasticidade cruzada positiva indica bens substitutos.","Bem inferior refere-se à relação com a renda.","Bem público refere-se a não rivalidade e não exclusão.","Bem de Giffen é caso particular de bem inferior."],"Mankiw."),
Q("Uma política monetária contracionista, como a elevação da taxa Selic, tende, em geral, a",["estimular a demanda agregada e a inflação.","reduzir a demanda agregada e conter a inflação.","reduzir tributos diretamente.","aumentar os gastos do governo.","depreciar automaticamente o real sem outros efeitos."],1,["Seria o efeito de política expansionista.","Juros maiores encarecem crédito e reduzem consumo e investimento.","Alterar tributos é política fiscal.","Gastos do governo são política fiscal.","Os efeitos cambiais dependem de vários fatores; o efeito principal é sobre demanda e inflação."],"Mankiw, Macroeconomia.")
]});

MODS.push({n:9,t:"Matemática: lógica, conjuntos, funções, logaritmos, trigonometria, matrizes e progressões",edital:"Lógica; conjuntos; relações; funções; logaritmos; trigonometria; cálculo vetorial e matricial; progressões; sistemas de numeração",
alerta:"Módulo de revisão. A profundidade cobrada não é informada no edital; pratique com muitas questões de provas anteriores da Cesgranrio.",
intro:"Resumo das ferramentas matemáticas listadas no edital, com foco nas fórmulas e propriedades mais cobradas.",
obj:["Negar e simplificar proposições.","Resolver problemas com conjuntos e classificar relações e funções.","Usar propriedades de logaritmos e relações trigonométricas.","Operar matrizes e vetores.","Aplicar PA e PG e converter entre bases de numeração."],
secs:[
["1. Lógica proposicional","<ul><li>Conectivos: ∧ (e), ∨ (ou), → (se...então), ↔ (se e somente se), ~ (não).</li><li>A condicional <code>p → q</code> só é falsa quando p é verdadeira e q é falsa.</li><li>Negação: <code>~(p → q) ≡ p ∧ ~q</code>; De Morgan: <code>~(p ∧ q) ≡ ~p ∨ ~q</code> e <code>~(p ∨ q) ≡ ~p ∧ ~q</code>.</li><li>Equivalência: <code>p → q ≡ ~q → ~p ≡ ~p ∨ q</code>.</li><li>Quantificadores: negar \"todo A é B\" resulta em \"algum A não é B\".</li></ul>","Matemática discreta (p. ex., GERSTING, J. <i>Fundamentos Matemáticos para a Ciência da Computação</i>, LTC)."],
["2. Conjuntos, relações e funções","<ul><li><code>|A ∪ B| = |A| + |B| − |A ∩ B|</code>; complemento; produto cartesiano.</li><li>Relação: reflexiva, simétrica, antissimétrica, transitiva. <b>Equivalência</b> = reflexiva + simétrica + transitiva. <b>Ordem parcial</b> = reflexiva + antissimétrica + transitiva.</li><li>Função: cada elemento do domínio tem <b>exatamente uma</b> imagem. Injetora, sobrejetora e bijetora (admite inversa). Afim <code>f(x) = ax + b</code>; quadrática com vértice em <code>x = −b/2a</code> e <code>Δ = b² − 4ac</code>; exponencial <code>aˣ</code>.</li></ul>","IEZZI, G.; MURAKAMI, C. <i>Fundamentos de Matemática Elementar</i>, Atual."],
["3. Logaritmos","<ul><li><code>log_b(xy) = log_b x + log_b y</code>; <code>log_b(x/y) = log_b x − log_b y</code>; <code>log_b xᵏ = k·log_b x</code>.</li><li>Mudança de base: <code>log_b x = log_c x / log_c b</code>. <code>log_b b = 1</code>; <code>log_b 1 = 0</code>.</li><li>Existência: base positiva e diferente de 1; logaritmando positivo.</li></ul>","IEZZI; MURAKAMI."],
["4. Trigonometria","<ul><li><code>sen²x + cos²x = 1</code>; <code>tg x = sen x/cos x</code>; π rad = 180°.</li><li>Valores notáveis: sen 30° = 1/2, sen 45° = √2/2, sen 60° = √3/2 (e cos nos ângulos complementares).</li><li>Lei dos senos e dos cossenos para triângulos quaisquer: <code>a² = b² + c² − 2bc·cos A</code>.</li></ul>","IEZZI et al."],
["5. Vetores e matrizes","<ul><li>Produto escalar: <code>u·v = Σ uᵢvᵢ = |u||v|cos θ</code>; vetores ortogonais têm produto escalar nulo. Módulo: <code>|u| = √(u·u)</code>.</li><li>Produto de matrizes: (m×n)·(n×p) resulta em m×p (linhas por colunas), não é comutativo.</li><li>Determinante 2×2: <code>ad − bc</code>. A matriz é invertível se det ≠ 0. <code>det(AB) = det A · det B</code>.</li></ul>","BOLDRINI, J. L. et al. <i>Álgebra Linear</i>, Harbra."],
["6. Progressões e sistemas de numeração","<ul><li><b>PA</b>: <code>aₙ = a₁ + (n − 1)r</code>; <code>Sₙ = (a₁ + aₙ)·n/2</code>.</li><li><b>PG</b>: <code>aₙ = a₁·qⁿ⁻¹</code>; <code>Sₙ = a₁(qⁿ − 1)/(q − 1)</code>; soma infinita com |q| &lt; 1: <code>a₁/(1 − q)</code>.</li><li><b>Numeração posicional</b>: em base b, cada dígito vale dígito × bᵖᵒˢⁱçãᵒ. Binário para decimal: some as potências de 2 dos bits 1. Decimal para binário: divisões sucessivas por 2. Hexadecimal usa 0 a 9 e A a F; 1 byte = 8 bits.</li></ul>","IEZZI et al."]
],

├── Conjuntos: |A∪B| = |A| + |B| − |A∩B|; relações e funções
├── Log: produto → soma; potência → coeficiente; mudança de base

q:[
Q("A negação da proposição \"Se o duto está pressurizado, então a válvula está fechada\" é",["Se o duto não está pressurizado, então a válvula não está fechada.","O duto está pressurizado e a válvula não está fechada.","O duto não está pressurizado e a válvula está fechada.","Se a válvula está fechada, então o duto está pressurizado.","O duto não está pressurizado ou a válvula está fechada."],1,["Não é a negação; é a inversa da condicional.","~(p → q) ≡ p ∧ ~q.","Não corresponde à negação.","É a recíproca, não a negação.","Esta é a forma equivalente à própria condicional (~p ∨ q)."],"Lógica proposicional."),
Q("Em um grupo de 100 clientes, 60 compram gasolina, 45 compram diesel e 20 compram ambos. O número de clientes que não compram nenhum dos dois é",["5.","10.","15.","20.","25."],2,["Erro de cálculo.","Erro de cálculo.","|A ∪ B| = 60 + 45 − 20 = 85; 100 − 85 = 15.","Corresponde ao número dos que compram ambos.","Erro de cálculo."],"Princípio da inclusão-exclusão."),
Q("O valor de log₂ 32 + log₃ 81 é",["7.","8.","9.","10.","12."],2,["Erro de cálculo.","Erro de cálculo.","log₂ 32 = 5 e log₃ 81 = 4, soma 9.","Erro de cálculo.","Erro de cálculo."],"Definição de logaritmo."),
Q("Em uma progressão aritmética com primeiro termo 5 e razão 3, a soma dos 20 primeiros termos é",["570.","600.","670.","700.","1140."],2,["Erro de cálculo.","Erro de cálculo.","a₂₀ = 5 + 19·3 = 62; S = (5 + 62)·20/2 = 670.","Erro de cálculo.","Erro de cálculo (dobro do valor de 570)."],"Progressão aritmética."),
Q("O número binário 101101 corresponde, na base decimal, a",["35.","41.","45.","49.","53."],2,["Erro de conversão.","Erro de conversão.","32 + 8 + 4 + 1 = 45.","Erro de conversão.","Erro de conversão."],"Sistemas de numeração posicionais.")
]});

MODS.push({n:10,t:"Estatística descritiva, análise combinatória e probabilidade",edital:"Análise combinatória; probabilidade; estatística descritiva",
intro:"Revisão das medidas de posição e dispersão, técnicas de contagem e regras de probabilidade mais cobradas em provas.",
obj:["Calcular média, mediana, moda, variância, desvio padrão e coeficiente de variação.","Prever o efeito de transformações lineares nos dados.","Aplicar arranjos, combinações e permutações.","Calcular probabilidades (união, condicional, independência, binomial)."],
secs:[
["1. Estatística descritiva","<ul><li><b>Média</b> <code>x̄ = Σxᵢ/n</code>; <b>mediana</b> (valor central); <b>moda</b> (mais frequente).</li><li><b>Variância populacional</b> <code>σ² = Σ(xᵢ − μ)²/N</code>; amostral divide por <code>n − 1</code>. <b>Desvio padrão</b> = √variância. <b>Coeficiente de variação</b> = desvio/média.</li><li>Média &gt; mediana sugere assimetria positiva (cauda à direita).</li><li>Transformação <code>y = a·x + b</code>: média → a·x̄ + b; desvio padrão → |a|·s; variância → a²·s². Somar constante não altera a dispersão.</li></ul>","BUSSAB, W.; MORETTIN, P. <i>Estatística Básica</i>, Saraiva."],
["2. Análise combinatória","<ul><li>Princípio multiplicativo: etapas independentes multiplicam-se.</li><li>Permutação: <code>n!</code>; com repetição: <code>n!/(a!·b!·...)</code>. Circular: <code>(n − 1)!</code>.</li><li>Arranjo (ordem importa): <code>A(n,p) = n!/(n − p)!</code>.</li><li>Combinação (ordem não importa): <code>C(n,p) = n!/[p!(n − p)!]</code>.</li></ul>","IEZZI et al., <i>Fundamentos de Matemática Elementar</i>, vol. 5."],
["3. Probabilidade","<ul><li><code>P(A) = casos favoráveis/casos possíveis</code> (espaço equiprovável). Complemento: <code>1 − P(A)</code>.</li><li>União: <code>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</code>.</li><li>Condicional: <code>P(A|B) = P(A ∩ B)/P(B)</code>. Independência: <code>P(A ∩ B) = P(A)·P(B)</code>.</li><li>Binomial: <code>P(X = k) = C(n,k)·pᵏ·(1 − p)ⁿ⁻ᵏ</code>; esperança <code>np</code>.</li></ul>","BUSSAB; MORETTIN; MEYER, P. <i>Probabilidade: Aplicações à Estatística</i>, LTC."]
],
mapa:`ESTATÍSTICA E PROBABILIDADE
├── Média, mediana, moda; variância, desvio padrão, CV

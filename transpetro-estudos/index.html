Q("Pela ótica da despesa, o PIB é dado por",["C + I + G + X − M.","C + I + G − X + M.","C + I − G + X − M.","C − I + G + X + M.","apenas C + G."],0,["Consumo + investimento + gastos do governo + exportações − importações.","Sinais de X e M invertidos.","G tem sinal positivo.","I tem sinal positivo e M, negativo.","Omite componentes."],"Mankiw; Vasconcellos."),
Q("Se o preço do etanol aumenta, mantidas as demais condições, tende a aumentar a demanda por gasolina, o que ilustra que os dois bens são",["complementares.","substitutos.","inferiores.","bens públicos.","de Giffen."],1,["Complementares teriam demanda que cai quando o preço do outro sobe.","Elasticidade cruzada positiva indica bens substitutos.","Bem inferior refere-se à relação com a renda.","Bem público refere-se a não rivalidade e não exclusão.","Bem de Giffen é caso particular de bem inferior."],"Mankiw."),
Q("Uma política monetária contracionista, como a elevação da taxa Selic, tende, em geral, a",["estimular a demanda agregada e a inflação.","reduzir a demanda agregada e conter a inflação.","reduzir tributos diretamente.","aumentar os gastos do governo.","depreciar automaticamente o real sem outros efeitos."],1,["Seria o efeito de política expansionista.","Juros maiores encarecem crédito e reduzem consumo e investimento.","Alterar tributos é política fiscal.","Gastos do governo são política fiscal.","Os efeitos cambiais dependem de vários fatores; o efeito principal é sobre demanda e inflação."],"Mankiw, Macroeconomia.")
]});

MODS.push({n:9,t:"Matemática: lógica, conjuntos, funções, logaritmos, trigonometria, matrizes e progressões",edital:"Lógica; conjuntos; relações; funções; logaritmos; trigonometria; cálculo vetorial e matricial; progressões; sistemas de numeração",
alerta:"Módulo de revisão. A profundidade cobrada não é informada no edital; pratique com muitas questões de provas anteriores da Cesgranrio.",
intro:"Resumo das ferramentas matemáticas listadas no edital, com foco nas fórmulas e propriedades mais cobradas.",
obj:["Negar e simplificar proposições.","Resolver problemas com conjuntos e classificar relações e funções.","Usar propriedades de logaritmos e relações trigonométricas.","Operar matrizes e vetores.","Aplicar PA e PG e converter entre bases de numeração."],
secs:[
["1. Lógica proposicional","<ul><li>Conectivos: ∧ (e), ∨ (ou), → (se...então), ↔ (se e somente se), ~ (não).</li><li>A condicional <code>p → q</code> só é falsa quando p é verdadeira e q é falsa.</li><li>Negação: <code>~(p → q) ≡ p ∧ ~q</code>; De Morgan: <code>~(p ∧ q) ≡ ~p ∨ ~q</code> e <code>~(p ∨ q) ≡ ~p ∧ ~q</code>.</li><li>Equivalência: <code>p → q ≡ ~q → ~p ≡ ~p ∨ q</code>.</li><li>Quantificadores: negar \"todo A é B\" resulta em \"algum A não é B\".</li></ul>","Matemática discreta (p. ex., GERSTING, J. <i>Fundamentos Matemáticos para a Ciência da Computação</i>, LTC)."],
["2. Conjuntos, relações e funções","<ul><li><code>|A ∪ B| = |A| + |B| − |A ∩ B|</code>; complemento; produto cartesiano.</li><li>Relação: reflexiva, simétrica, antissimétrica, transitiva. <b>Equivalência</b> = reflexiva + simétrica + transitiva. <b>Ordem parcial</b> = reflexiva + antissimétrica + transitiva.</li><li>Função: cada elemento do domínio tem <b>exatamente uma</b> imagem. Injetora, sobrejetora e bijetora (admite inversa). Afim <code>f(x) = ax + b</code>; quadrática com vértice em <code>x = −b/2a</code> e <code>Δ = b² − 4ac</code>; exponencial <code>aˣ</code>.</li></ul>","IEZZI, G.; MURAKAMI, C. <i>Fundamentos de Matemática Elementar</i>, Atual."],
["3. Logaritmos","<ul><li><code>log_b(xy) = log_b x + log_b y</code>; <code>log_b(x/y) = log_b x − log_b y</code>; <code>log_b xᵏ = k·log_b x</code>.</li><li>Mudança de base: <code>log_b x = log_c x / log_c b</code>. <code>log_b b = 1</code>; <code>log_b 1 = 0</code>.</li><li>Existência: base positiva e diferente de 1; logaritmando positivo.</li></ul>","IEZZI; MURAKAMI."],
["4. Trigonometria","<ul><li><code>sen²x + cos²x = 1</code>; <code>tg x = sen x/cos x</code>; π rad = 180°.</li><li>Valores notáveis: sen 30° = 1/2, sen 45° = √2/2, sen 60° = √3/2 (e cos nos ângulos complementares).</li><li>Lei dos senos e dos cossenos para triângulos quaisquer: <code>a² = b² + c² − 2bc·cos A</code>.</li></ul>","IEZZI et al."],
["5. Vetores e matrizes","<ul><li>Produto escalar: <code>u·v = Σ uᵢvᵢ = |u||v|cos θ</code>; vetores ortogonais têm produto escalar nulo. Módulo: <code>|u| = √(u·u)</code>.</li><li>Produto de matrizes: (m×n)·(n×p) resulta em m×p (linhas por colunas), não é comutativo.</li><li>Determinante 2×2: <code>ad − bc</code>. A matriz é invertível se det ≠ 0. <code>det(AB) = det A · det B</code>.</li></ul>","BOLDRINI, J. L. et al. <i>Álgebra Linear</i>, Harbra."],
["6. Progressões e sistemas de numeração","<ul><li><b>PA</b>: <code>aₙ = a₁ + (n − 1)r</code>; <code>Sₙ = (a₁ + aₙ)·n/2</code>.</li><li><b>PG</b>: <code>aₙ = a₁·qⁿ⁻¹</code>; <code>Sₙ = a₁(qⁿ − 1)/(q − 1)</code>; soma infinita com |q| &lt; 1: <code>a₁/(1 − q)</code>.</li><li><b>Numeração posicional</b>: em base b, cada dígito vale dígito × bᵖᵒˢⁱçãᵒ. Binário para decimal: some as potências de 2 dos bits 1. Decimal para binário: divisões sucessivas por 2. Hexadecimal usa 0 a 9 e A a F; 1 byte = 8 bits.</li></ul>","IEZZI et al."]
],

q:[
Q("A negação da proposição \"Se o duto está pressurizado, então a válvula está fechada\" é",["Se o duto não está pressurizado, então a válvula não está fechada.","O duto está pressurizado e a válvula não está fechada.","O duto não está pressurizado e a válvula está fechada.","Se a válvula está fechada, então o duto está pressurizado.","O duto não está pressurizado ou a válvula está fechada."],1,["Não é a negação; é a inversa da condicional.","~(p → q) ≡ p ∧ ~q.","Não corresponde à negação.","É a recíproca, não a negação.","Esta é a forma equivalente à própria condicional (~p ∨ q)."],"Lógica proposicional."),
Q("Em um grupo de 100 clientes, 60 compram gasolina, 45 compram diesel e 20 compram ambos. O número de clientes que não compram nenhum dos dois é",["5.","10.","15.","20.","25."],2,["Erro de cálculo.","Erro de cálculo.","|A ∪ B| = 60 + 45 − 20 = 85; 100 − 85 = 15.","Corresponde ao número dos que compram ambos.","Erro de cálculo."],"Princípio da inclusão-exclusão."),
Q("O valor de log₂ 32 + log₃ 81 é",["7.","8.","9.","10.","12."],2,["Erro de cálculo.","Erro de cálculo.","log₂ 32 = 5 e log₃ 81 = 4, soma 9.","Erro de cálculo.","Erro de cálculo."],"Definição de logaritmo."),
Q("Em uma progressão aritmética com primeiro termo 5 e razão 3, a soma dos 20 primeiros termos é",["570.","600.","670.","700.","1140."],2,["Erro de cálculo.","Erro de cálculo.","a₂₀ = 5 + 19·3 = 62; S = (5 + 62)·20/2 = 670.","Erro de cálculo.","Erro de cálculo (dobro do valor de 570)."],"Progressão aritmética."),
Q("O número binário 101101 corresponde, na base decimal, a",["35.","41.","45.","49.","53."],2,["Erro de conversão.","Erro de conversão.","32 + 8 + 4 + 1 = 45.","Erro de conversão.","Erro de conversão."],"Sistemas de numeração posicionais.")

MODS.push({n:10,t:"Estatística descritiva, análise combinatória e probabilidade",edital:"Análise combinatória; probabilidade; estatística descritiva",
intro:"Revisão das medidas de posição e dispersão, técnicas de contagem e regras de probabilidade mais cobradas em provas.",
obj:["Calcular média, mediana, moda, variância, desvio padrão e coeficiente de variação.","Prever o efeito de transformações lineares nos dados.","Aplicar arranjos, combinações e permutações.","Calcular probabilidades (união, condicional, independência, binomial)."],
secs:[
["1. Estatística descritiva","<ul><li><b>Média</b> <code>x̄ = Σxᵢ/n</code>; <b>mediana</b> (valor central); <b>moda</b> (mais frequente).</li><li><b>Variância populacional</b> <code>σ² = Σ(xᵢ − μ)²/N</code>; amostral divide por <code>n − 1</code>. <b>Desvio padrão</b> = √variância. <b>Coeficiente de variação</b> = desvio/média.</li><li>Média &gt; mediana sugere assimetria positiva (cauda à direita).</li><li>Transformação <code>y = a·x + b</code>: média → a·x̄ + b; desvio padrão → |a|·s; variância → a²·s². Somar constante não altera a dispersão.</li></ul>","BUSSAB, W.; MORETTIN, P. <i>Estatística Básica</i>, Saraiva."],
["2. Análise combinatória","<ul><li>Princípio multiplicativo: etapas independentes multiplicam-se.</li><li>Permutação: <code>n!</code>; com repetição: <code>n!/(a!·b!·...)</code>. Circular: <code>(n − 1)!</code>.</li><li>Arranjo (ordem importa): <code>A(n,p) = n!/(n − p)!</code>.</li><li>Combinação (ordem não importa): <code>C(n,p) = n!/[p!(n − p)!]</code>.</li></ul>","IEZZI et al., <i>Fundamentos de Matemática Elementar</i>, vol. 5."],
["3. Probabilidade","<ul><li><code>P(A) = casos favoráveis/casos possíveis</code> (espaço equiprovável). Complemento: <code>1 − P(A)</code>.</li><li>União: <code>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</code>.</li><li>Condicional: <code>P(A|B) = P(A ∩ B)/P(B)</code>. Independência: <code>P(A ∩ B) = P(A)·P(B)</code>.</li><li>Binomial: <code>P(X = k) = C(n,k)·pᵏ·(1 − p)ⁿ⁻ᵏ</code>; esperança <code>np</code>.</li></ul>","BUSSAB; MORETTIN; MEYER, P. <i>Probabilidade: Aplicações à Estatística</i>, LTC."]
],
mapa:`ESTATÍSTICA E PROBABILIDADE
├── Média, mediana, moda; variância, desvio padrão, CV
│   └── y = ax + b → média a·x̄ + b; DP |a|·s
├── Contagem: n!, arranjo, combinação, permutação com repetição
└── Probabilidade: união, condicional, independência, binomial`,
q:[
Q("Para o conjunto de dados 2, 4, 4, 4, 5, 5, 7, 9, o desvio padrão populacional é",["1.","2.","3.","4.","5."],1,["Erro de cálculo.","Média 5; soma dos quadrados dos desvios = 32; variância = 32/8 = 4; desvio padrão = 2.","Erro de cálculo.","4 é a variância, não o desvio padrão.","5 é a média."],"Bussab e Morettin."),
Q("Um conjunto de dados tem média 5 e desvio padrão 2. Se cada valor for multiplicado por 3 e acrescido de 2, a nova média e o novo desvio padrão serão, respectivamente,",["17 e 6.","17 e 8.","15 e 6.","15 e 8.","17 e 2."],0,["Média = 3·5 + 2 = 17; desvio padrão = 3·2 = 6 (somar constante não altera a dispersão).","O desvio padrão não recebe a constante somada.","A média inclui a constante somada.","Erro em ambos.","O desvio padrão é multiplicado por 3."],"Propriedades de transformação linear."),
Q("De um grupo de 8 pessoas será escolhida uma comissão de 3 membros, sem funções distintas. O número de comissões possíveis é",["24.","56.","112.","336.","512."],1,["Erro de cálculo.","C(8,3) = 8!/(3!·5!) = 56.","Erro de cálculo.","É A(8,3), que considera a ordem.","É 8³."],"Combinação simples."),
Q("O número de anagramas da palavra TRANSPETRO é",["3.628.800.","907.200.","1.814.400.","453.600.","10."],1,["Seria 10! sem considerar letras repetidas.","Há 10 letras, com T e R repetidas duas vezes: 10!/(2!·2!) = 907.200.","Corresponde a dividir por 2 apenas uma vez.","Erro de cálculo.","Erro de cálculo."],"Permutação com repetição."),
Q("Lançando-se uma moeda honesta 3 vezes, a probabilidade de obter exatamente duas caras é",["1/8.","3/8.","1/2.","5/8.","3/4."],1,["É a probabilidade de exatamente 3 caras.","C(3,2)·(1/2)³ = 3/8.","Erro de cálculo.","É o complemento de 3/8.","Erro de cálculo."],"Distribuição binomial.")
]});

MODS.push({n:11,t:"Gases, termologia, unidades e conversões",edital:"Relações entre volume, pressão e temperatura; termologia; sistemas de unidades; conversões",
intro:"Este módulo reúne a base física do edital: comportamento de gases, escalas de temperatura, calor e conversão de unidades típicas do setor de petróleo (barril, m³, atm, psi).",
obj:["Aplicar a equação dos gases ideais e as transformações isotérmica, isobárica e isocórica.","Converter escalas de temperatura (°C, °F, K).","Calcular calor sensível e latente.","Converter unidades de volume, pressão e energia."],
secs:[
["1. Gases ideais","<p><code>PV = nRT</code>, com T sempre em <b>kelvin</b> (K = °C + 273,15; na prática, +273). R ≈ 0,082 atm·L/(mol·K) ≈ 8,314 J/(mol·K).</p><ul><li><b>Boyle</b> (T constante): P₁V₁ = P₂V₂.</li><li><b>Charles</b> (P constante): V₁/T₁ = V₂/T₂.</li><li><b>Gay-Lussac</b> (V constante): P₁/T₁ = P₂/T₂.</li><li>Geral: P₁V₁/T₁ = P₂V₂/T₂.</li><li>Volume molar nas CNTP (0 °C, 1 atm): 22,4 L/mol.</li></ul>","Física básica do ensino médio e superior (p. ex., HALLIDAY; RESNICK; WALKER, <i>Fundamentos de Física</i>, LTC)."],
["2. Termologia","<ul><li>Escalas: <code>F = 1,8·C + 32</code>; <code>K = C + 273</code>.</li><li>Calor sensível: <code>Q = m·c·ΔT</code> (muda a temperatura). Água: c = 1 cal/(g·°C) ≈ 4,18 J/(g·K).</li><li>Calor latente: <code>Q = m·L</code> (muda o estado, temperatura constante).</li><li>Dilatação linear: <code>ΔL = L₀·α·ΔT</code>; superficial ≈ 2α; volumétrica ≈ 3α. Líquidos dilatam em tanques com a temperatura, o que importa na medição de volumes.</li><li>Transmissão de calor: condução, convecção e irradiação.</li></ul>","HALLIDAY; RESNICK; WALKER."],
["3. Sistemas de unidades e conversões","<table><tr><th>Grandeza</th><th>Conversão útil</th></tr><tr><td>Volume</td><td>1 bbl (barril) = 42 galões US ≈ 158,987 L ≈ 0,159 m³; 1 m³ = 1000 L ≈ 6,29 bbl; 1 galão US ≈ 3,785 L; 1 ft³ ≈ 28,317 L</td></tr><tr><td>Pressão</td><td>1 atm = 101 325 Pa = 760 mmHg ≈ 1,013 bar; 1 bar = 10⁵ Pa; 1 psi ≈ 6895 Pa; 1 kgf/cm² ≈ 98 066 Pa</td></tr><tr><td>Energia</td><td>1 cal = 4,1868 J; 1 kWh = 3,6 MJ; 1 BTU ≈ 1055 J</td></tr><tr><td>Comprimento e velocidade</td><td>1 milha náutica = 1852 m; 1 nó = 1 milha náutica/h ≈ 0,514 m/s</td></tr><tr><td>Massa e densidade</td><td>ρ = m/V; conversão volume ↔ massa depende da densidade do produto</td></tr></table><p>SI: metro, quilograma, segundo, ampère, kelvin, mol e candela. Prefixos: k (10³), M (10⁶), G (10⁹), m (10⁻³), µ (10⁻⁶).</p>","INMETRO (Sistema Internacional de Unidades); fatores de conversão padrão."]
],

Q("Dois mols de um gás ideal ocupam, a 300 K e 1 atm, um volume de (use R = 0,082 atm·L/mol·K)",["24,6 L.","49,2 L.","98,4 L.","4,92 L.","12,3 L."],1,["Corresponde a 1 mol.","V = nRT/P = 2·0,082·300/1 = 49,2 L.","Seria o resultado com 4 mols.","Erro de fator de 10.","Corresponde a 0,5 mol."],"Equação dos gases ideais."),
Q("Um gás ideal, mantido em volume constante, está a 27 °C e 2 atm. Ao ser aquecido até 127 °C, sua pressão, em atm, passa a ser aproximadamente",["2,67.","4,00.","9,41.","1,50.","2,00."],0,["P₂ = P₁·T₂/T₁ = 2·400/300 ≈ 2,67 atm (Gay-Lussac, com T em kelvin).","Resultaria de dobrar a pressão, sem base na relação em kelvin.","Resultaria do erro de usar as temperaturas em °C.","A pressão aumenta com o aquecimento a volume constante.","A pressão não permanece constante."],"Lei de Gay-Lussac."),
Q("Uma temperatura de 50 °C corresponde, nas escalas Kelvin e Fahrenheit, respectivamente, a",["323 K e 122 °F.","223 K e 122 °F.","323 K e 90 °F.","273 K e 50 °F.","373 K e 212 °F."],0,["K = 50 + 273 = 323; F = 1,8·50 + 32 = 122.","223 K seria −50 °C.","F = 1,8·50 + 32 = 122, não 90.","Ignora a conversão.","São os valores do ponto de ebulição da água (100 °C)."],"Conversão entre escalas termométricas."),
Q("Para aquecer 2 kg de água líquida de 20 °C a 70 °C, sem mudança de estado, considerando c = 1 cal/(g·°C), é necessária uma quantidade de calor de",["10 kcal.","50 kcal.","100 kcal.","140 kcal.","1000 kcal."],2,["Erro de escala na conta.","Usaria massa de 1 kg.","Q = m·c·ΔT = 2000·1·50 = 100 000 cal = 100 kcal.","Confunde ΔT com a soma das temperaturas (70 + 20 = 90) ou outro erro.","Erro de fator de 10."],"Calor sensível: Q = m·c·ΔT."),
Q("Considerando 1 barril ≈ 158,987 litros, um volume de 1000 barris equivale a aproximadamente",["63 m³.","159 m³.","1590 m³.","6,29 m³.","15,9 m³."],1,["Resultado de dividir por 15,9 em vez de multiplicar por 0,159.","1000 · 158,987 L = 158 987 L ≈ 159 m³.","Erro de fator de 10.","Corresponde a 1 m³ em barris (≈ 6,29), não o inverso.","Erro de fator de 10."],"Fatores de conversão padrão da indústria do petróleo.")

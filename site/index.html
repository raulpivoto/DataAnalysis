<title>Trilha do Analista</title>
<meta name="description" content="Curso gamificado de SQL e estatística para Analista de Dados Júnior: lições curtas, desafios com correção automática, XP e ofensiva.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root {
  --chao: #edf0f6;
  --superficie: #ffffff;
  --superficie-2: #f5f7fb;
  --tinta: #141d33;
  --tinta-2: #525d77;
  --tinta-3: #8b94aa;
  --linha: #d8deea;
  --azul: #2b59e0;
  --azul-fundo: #1c3fa6;
  --azul-suave: #e3eafc;
  --ouro: #e9a800;
  --ouro-suave: #fdf3d4;
  --fogo: #f2611d;
  --ok: #178a4f;
  --ok-suave: #ddf3e6;
  --erro: #cc3535;
  --erro-suave: #fbe3e3;
  --codigo-fundo: #111a2e;
  --codigo-tinta: #dfe6f5;
  --codigo-comentario: #7f8bab;
  --u1: #2b59e0; --u1-fundo: #1c3fa6;
  --u2: #7d4bd6; --u2-fundo: #5a2fad;
  --u3: #0d8b7d; --u3-fundo: #08645a;
  --u4: #d4592a; --u4-fundo: #a33f18;
  --bloqueado: #c9cfdc; --bloqueado-fundo: #aab2c4;
  --sombra: 0 1px 2px rgba(20, 29, 51, .06), 0 6px 20px rgba(20, 29, 51, .06);
  --raio: 14px;
  --fonte-titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --fonte-texto: "Figtree", "Segoe UI", system-ui, sans-serif;
  --fonte-codigo: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --chao: #0d1322; --superficie: #161e33; --superficie-2: #1c2540;
    --tinta: #e8edf8; --tinta-2: #aab3ca; --tinta-3: #717c98; --linha: #2a3452;
    --azul: #5b82f5; --azul-fundo: #3457c4; --azul-suave: #1f2b52;
    --ouro: #f5c030; --ouro-suave: #3a3218; --fogo: #ff7a36;
    --ok: #3ccf82; --ok-suave: #143726; --erro: #ff6b6b; --erro-suave: #3d1c22;
    --codigo-fundo: #0a0f1c; --codigo-tinta: #dfe6f5; --codigo-comentario: #7f8bab;
    --u1: #5b82f5; --u1-fundo: #3457c4; --u2: #9b70ea; --u2-fundo: #6d45bf;
    --u3: #22b09f; --u3-fundo: #127d70; --u4: #ec7443; --u4-fundo: #b4501f;
    --bloqueado: #313b58; --bloqueado-fundo: #232b44;
    --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --chao: #0d1322; --superficie: #161e33; --superficie-2: #1c2540;
  --tinta: #e8edf8; --tinta-2: #aab3ca; --tinta-3: #717c98; --linha: #2a3452;
  --azul: #5b82f5; --azul-fundo: #3457c4; --azul-suave: #1f2b52;
  --ouro: #f5c030; --ouro-suave: #3a3218; --fogo: #ff7a36;
  --ok: #3ccf82; --ok-suave: #143726; --erro: #ff6b6b; --erro-suave: #3d1c22;
  --codigo-fundo: #0a0f1c; --codigo-tinta: #dfe6f5; --codigo-comentario: #7f8bab;
  --u1: #5b82f5; --u1-fundo: #3457c4; --u2: #9b70ea; --u2-fundo: #6d45bf;
  --u3: #22b09f; --u3-fundo: #127d70; --u4: #ec7443; --u4-fundo: #b4501f;
  --bloqueado: #313b58; --bloqueado-fundo: #232b44;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--chao); color: var(--tinta);
  font: 16px/1.55 var(--fonte-texto);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
code { font-family: var(--fonte-codigo); font-size: .86em; background: var(--superficie-2); border: 1px solid var(--linha); padding: .05em .35em; border-radius: 5px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- barra superior ---------- */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--chao) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--linha);
}
.topo-interno { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.marca { font-family: var(--fonte-titulo); font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; margin-right: auto; white-space: nowrap; }
.marca svg { flex: none; }
.marca span { overflow: hidden; text-overflow: ellipsis; }
.stat { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat.fogo { color: var(--fogo); }
.stat.fogo.apagado { color: var(--tinta-3); }
.stat.xp { color: var(--ouro); }
.anel { position: relative; width: 34px; height: 34px; flex: none; }
.anel svg { transform: rotate(-90deg); }
.anel b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: var(--tinta-2); }
.btn-tabelas { border: 1px solid var(--linha); background: var(--superficie); border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }

/* ---------- layout ---------- */
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 110px; }
.navegacao {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--superficie); border-top: 1px solid var(--linha);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.navegacao-interna { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.navegacao button { background: none; border: 0; padding: 10px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--tinta-3); position: relative; }
.navegacao button[aria-current="page"] { color: var(--azul); }
.navegacao button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--azul); }
.bolinha { position: absolute; top: 6px; right: calc(50% - 20px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--fogo); color: #fff; font-size: 11px; line-height: 18px; padding: 0 5px; }

/* ---------- trilha ---------- */
.saudacao { display: grid; gap: 6px; margin-bottom: 22px; }
.saudacao h1 { font-size: clamp(26px, 6vw, 34px); font-weight: 800; }
.saudacao p { color: var(--tinta-2); max-width: 60ch; }
.unidade { margin-bottom: 26px; }
.faixa-unidade {
  background: var(--cor); color: #fff; border-radius: var(--raio);
  padding: 16px 18px; display: flex; gap: 14px; align-items: center;
  box-shadow: 0 4px 0 var(--cor-fundo);
}
.faixa-unidade .rotulo { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.faixa-unidade h2 { font-size: 21px; font-weight: 800; }
.faixa-unidade p { font-size: 14px; opacity: .9; }
.faixa-unidade .progresso-unidade { margin-left: auto; font-weight: 800; font-size: 14px; background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.caminho { display: grid; justify-items: center; gap: 18px; padding: 26px 0 8px; }
.no { display: grid; justify-items: center; gap: 6px; width: 170px; transform: translateX(var(--x, 0)); }
.no-botao {
  width: 74px; height: 70px; border-radius: 50%; border: 0;
  background: var(--cor); color: #fff; box-shadow: 0 6px 0 var(--cor-fundo);
  display: grid; place-items: center; font-family: var(--fonte-titulo); font-weight: 800; font-size: 19px;
  transition: transform .12s ease, box-shadow .12s ease; position: relative;
}
.no-botao:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 0 var(--cor-fundo); }
.no-botao:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--cor-fundo); }
.no-botao:disabled { background: var(--bloqueado); box-shadow: 0 6px 0 var(--bloqueado-fundo); color: var(--tinta-3); cursor: not-allowed; }
.no.feito .no-botao { background: var(--ouro); box-shadow: 0 6px 0 color-mix(in srgb, var(--ouro) 70%, #000); }
.no.atual .no-botao::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--cor); opacity: .45; }
.no.boss .no-botao { border-radius: 22px; width: 84px; }
.no-nome { font-weight: 800; font-size: 14px; text-align: center; line-height: 1.25; }
.no-tema { font-size: 12px; color: var(--tinta-2); text-align: center; line-height: 1.3; }
.balao { background: var(--superficie); border: 2px solid var(--cor); color: var(--cor); font-weight: 800; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 8px; }

/* ---------- cartões genéricos ---------- */
.painel { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; box-shadow: var(--sombra); }
.pilha { display: grid; gap: 14px; }
.titulo-secao { font-size: 22px; font-weight: 800; }
.sub { color: var(--tinta-2); font-size: 15px; }
.grade-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.metrica { background: var(--superficie); border: 1px solid var(--linha); border-radius: 12px; padding: 14px; display: grid; gap: 2px; }
.metrica b { font-family: var(--fonte-titulo); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.metrica span { font-size: 13px; color: var(--tinta-2); font-weight: 600; }

.botao {
  border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 800; letter-spacing: .02em;
  background: var(--azul); color: #fff; box-shadow: 0 4px 0 var(--azul-fundo);
  transition: transform .1s ease, box-shadow .1s ease; text-transform: uppercase; font-size: 14px;
}
.botao:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--azul-fundo); }
.botao:disabled { opacity: .5; cursor: not-allowed; }
.botao.ok { background: var(--ok); box-shadow: 0 4px 0 color-mix(in srgb, var(--ok) 65%, #000); }
.botao.erro { background: var(--erro); box-shadow: 0 4px 0 color-mix(in srgb, var(--erro) 65%, #000); }
.botao.secundario { background: var(--superficie); color: var(--tinta); border: 2px solid var(--linha); box-shadow: 0 3px 0 var(--linha); }
.botao.largo { width: 100%; }
.link { background: none; border: 0; color: var(--azul); font-weight: 700; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- lição ---------- */
.licao-topo { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.fechar { width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--tinta-3); display: grid; place-items: center; flex: none; }
.fechar:hover { background: var(--superficie); color: var(--tinta); }
.barra { flex: 1; height: 14px; background: var(--linha); border-radius: 999px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.cronometro { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--tinta-2); display: inline-flex; gap: 5px; align-items: center; }
.cronometro.urgente { color: var(--erro); }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--azul); }
.conceito { display: grid; gap: 12px; font-size: 16px; }
.conceito ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.conceito pre, pre.codigo {
  margin: 0; background: var(--codigo-fundo); color: var(--codigo-tinta);
  font: 13.5px/1.6 var(--fonte-codigo); padding: 14px 16px; border-radius: 12px; overflow-x: auto; white-space: pre;
}
.conceito table.mini { border-collapse: collapse; font-size: 14px; width: 100%; }
.conceito table.mini th, .conceito table.mini td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }
.tabela-rolagem { overflow-x: auto; }
.enunciado { font-size: 18px; line-height: 1.5; font-weight: 500; }
.enunciado-id { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); }
.xp-pilula { background: var(--ouro-suave); color: color-mix(in srgb, var(--ouro) 70%, var(--tinta)); border-radius: 999px; padding: 1px 8px; letter-spacing: 0; }

.editor { border: 2px solid var(--linha); border-radius: 14px; overflow: hidden; background: var(--codigo-fundo); }
.editor:focus-within { border-color: var(--azul); }
.editor textarea {
  width: 100%; min-height: 150px; resize: vertical; border: 0; display: block;
  background: var(--codigo-fundo); color: var(--codigo-tinta);
  font: 15px/1.6 var(--fonte-codigo); padding: 14px 16px; tab-size: 2;
}
.editor textarea:focus { outline: none; }
.atalhos { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background: color-mix(in srgb, var(--codigo-fundo) 85%, #fff); scrollbar-width: none; }
.atalhos button { flex: none; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: var(--codigo-tinta); font: 12.5px var(--fonte-codigo); padding: 5px 9px; border-radius: 7px; }
.atalhos button:hover { background: rgba(255,255,255,.14); }
.acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.acoes .botao { flex: 1 1 140px; }
.ajuda { display: flex; gap: 14px; flex-wrap: wrap; }
.dica { background: var(--ouro-suave); border-radius: 10px; padding: 10px 14px; font-size: 15px; }
.solucao { display: grid; gap: 8px; }
.tecla { font-size: 12px; color: var(--tinta-3); }

.resultado { border: 1px solid var(--linha); border-radius: 12px; overflow: hidden; background: var(--superficie); }
.resultado-cab { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--tinta-2); background: var(--superficie-2); border-bottom: 1px solid var(--linha); }
.resultado .tabela-rolagem { max-height: 320px; overflow: auto; }
.resultado table { border-collapse: collapse; font: 13px/1.4 var(--fonte-codigo); width: max-content; min-width: 100%; }
.resultado th { position: sticky; top: 0; background: var(--superficie); text-align: left; padding: 7px 12px; border-bottom: 2px solid var(--linha); font-weight: 700; color: var(--tinta-2); }
.resultado td { padding: 6px 12px; border-bottom: 1px solid var(--linha); white-space: nowrap; font-variant-numeric: tabular-nums; }
.resultado td.nulo { color: var(--tinta-3); font-style: italic; }
.resultado td.numero { text-align: right; }
.erro-sql { background: var(--erro-suave); color: var(--erro); font: 13.5px/1.5 var(--fonte-codigo); padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- retorno (feedback) ---------- */
.retorno {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  border-top: 2px solid; animation: sobe .22s ease;
}
.retorno.ok { background: var(--ok-suave); border-color: var(--ok); }
.retorno.erro { background: var(--erro-suave); border-color: var(--erro); }
.retorno-interno { max-width: 760px; margin: 0 auto; display: grid; gap: 10px; }
.retorno h3 { font-size: 20px; font-weight: 800; }
.retorno.ok h3 { color: var(--ok); }
.retorno.erro h3 { color: var(--erro); }
.retorno p { font-size: 15px; }
.comparacao { font: 12.5px/1.5 var(--fonte-codigo); display: grid; gap: 2px; overflow-x: auto; }
@keyframes sobe { from { transform: translateY(100%); } to { transform: none; } }

/* ---------- fim de lição ---------- */
.celebracao { text-align: center; display: grid; gap: 16px; justify-items: center; padding-top: 24px; }
.celebracao h1 { font-size: 32px; font-weight: 800; }
.trofeu { width: 120px; height: 120px; }
.caixas-fim { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; width: 100%; max-width: 460px; }
.caixa-fim { border: 2px solid var(--c); border-radius: 14px; overflow: hidden; }
.caixa-fim span { display: block; background: var(--c); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px; }
.caixa-fim b { display: block; padding: 10px; font-family: var(--fonte-titulo); font-size: 24px; color: var(--c); font-variant-numeric: tabular-nums; }
.confete { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* ---------- cartões (flashcards) ---------- */
.flash {
  min-height: 230px; display: grid; align-content: center; gap: 14px; text-align: center;
  background: var(--superficie); border: 2px solid var(--linha); border-bottom-width: 6px; border-radius: 20px; padding: 26px 22px;
}
.flash .frente { font-family: var(--fonte-titulo); font-size: 22px; font-weight: 700; }
.flash .verso { font-size: 17px; color: var(--tinta-2); border-top: 2px dashed var(--linha); padding-top: 14px; }
.caixinhas { display: flex; gap: 6px; flex-wrap: wrap; }
.caixinha { flex: 1 1 60px; background: var(--superficie); border: 1px solid var(--linha); border-radius: 10px; padding: 8px; text-align: center; }
.caixinha b { display: block; font-family: var(--fonte-titulo); font-size: 20px; font-variant-numeric: tabular-nums; }
.caixinha span { font-size: 11px; color: var(--tinta-2); font-weight: 700; }

/* ---------- listas ---------- */
.lista { display: grid; gap: 8px; }
.item { display: flex; gap: 12px; align-items: center; background: var(--superficie); border: 1px solid var(--linha); border-radius: 12px; padding: 12px 14px; }
.item .rotulo-id { font: 700 13px var(--fonte-codigo); color: var(--tinta-2); min-width: 44px; }
.item p { flex: 1; font-size: 14.5px; min-width: 0; }
.item-texto { flex: 1; min-width: 0; font-size: 14.5px; }
.conquista { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--linha); background: var(--superficie); }
.conquista.bloqueada { opacity: .45; filter: grayscale(1); }
.medalha { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ouro-suave); color: var(--ouro); flex: none; font-weight: 800; }
.conquista b { display: block; font-size: 15px; }
.conquista span { font-size: 13px; color: var(--tinta-2); }
.nivel-barra { height: 12px; border-radius: 999px; background: var(--linha); overflow: hidden; }
.nivel-barra i { display: block; height: 100%; background: var(--ouro); border-radius: 999px; }
.opcoes { display: flex; gap: 8px; flex-wrap: wrap; }
.opcoes button { border: 2px solid var(--linha); background: var(--superficie); border-radius: 10px; padding: 8px 14px; font-weight: 700; }
.opcoes button[aria-pressed="true"] { border-color: var(--azul); color: var(--azul); background: var(--azul-suave); }
.status-salvo { font-size: 13px; color: var(--tinta-2); display: flex; gap: 6px; align-items: center; }
.calendario { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.calendario i { aspect-ratio: 1; border-radius: 5px; background: var(--linha); display: block; }
.calendario i.n1 { background: color-mix(in srgb, var(--ok) 40%, var(--linha)); }
.calendario i.n2 { background: color-mix(in srgb, var(--ok) 70%, var(--linha)); }
.calendario i.n3 { background: var(--ok); }
.calendario i.hoje { outline: 2px solid var(--azul); outline-offset: 1px; }

/* ---------- gaveta de tabelas ---------- */
.fundo-gaveta { position: fixed; inset: 0; background: rgba(8, 12, 24, .45); z-index: 60; }
.gaveta {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 61;
  background: var(--superficie); border-left: 1px solid var(--linha); overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  display: grid; align-content: start; gap: 14px;
}
.gaveta-cab { display: flex; justify-content: space-between; align-items: center; }
.esquema { border: 1px solid var(--linha); border-radius: 12px; overflow: hidden; }
.esquema h3 { font: 700 14px var(--fonte-codigo); padding: 9px 12px; background: var(--superficie-2); border-bottom: 1px solid var(--linha); display: flex; justify-content: space-between; }
.esquema h3 span { font-family: var(--fonte-texto); font-weight: 600; color: var(--tinta-3); font-size: 12px; }
.esquema ul { list-style: none; margin: 0; padding: 6px 12px 10px; display: grid; gap: 3px; }
.esquema li { font: 13px var(--fonte-codigo); display: flex; justify-content: space-between; gap: 10px; }
.esquema li em { font-style: normal; color: var(--tinta-3); font-size: 12px; }
.esquema li.chave::before { content: "🔑"; font-size: 10px; margin-right: 4px; }

.carregando { min-height: 60vh; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; color: var(--tinta-2); }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--linha); border-top-color: var(--azul); animation: gira 0.9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .marca span { display: none; }
  .no { width: 140px; }
  .enunciado { font-size: 17px; }
  .faixa-unidade { flex-wrap: wrap; }
  .faixa-unidade .progresso-unidade { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- tabelas do desafio ---------- */
.tabelas-desafio { display: grid; gap: 10px; background: var(--superficie); border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; }
.tabelas-titulo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 800; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--tinta-2); }
.tabelas-titulo .tecla { text-transform: none; letter-spacing: 0; font-weight: 600; }
.tabela-rapida { display: grid; gap: 8px; }
.tabela-rapida + .tabela-rapida { border-top: 1px dashed var(--linha); padding-top: 10px; }
.tabela-rapida-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--linha); background: var(--superficie-2); color: var(--tinta); font: 13px/1.2 var(--fonte-codigo); padding: 6px 9px; border-radius: 8px; }
.chip:hover { border-color: var(--azul); color: var(--azul); }
.chip-tabela { background: var(--azul-suave); border-color: transparent; color: var(--azul); font-weight: 700; font-size: 14px; }
.licao-topo .btn-tabelas { flex: none; }
@media (max-width: 480px) { .licao-topo .btn-tabelas { padding: 6px 8px; } }

<script type="application/json" id="dados-gabarito">{"1.1":{"sql":"SELECT * FROM produtos;","xp":10},"1.2":{"sql":"SELECT nome, categoria, preco FROM produtos;","xp":10},"1.3":{"sql":"SELECT nome, estado, canal_aquisicao FROM clientes;","xp":10},"1.4":{"sql":"SELECT nome, preco FROM produtos WHERE categoria = 'Periféricos';","xp":10},"1.5":{"sql":"SELECT nome, preco FROM produtos WHERE preco > 1000;","xp":10},"1.6":{"sql":"SELECT pedido_id, data_pedido\nFROM pedidos\nWHERE status = 'cancelado' AND forma_pagamento = 'pix';","xp":10},"1.7":{"sql":"SELECT cliente_id, nome, estado\nFROM clientes\nWHERE (estado = 'SP' OR estado = 'RJ') AND canal_aquisicao = 'instagram';","xp":20},"1.8":{"sql":"SELECT cliente_id, nome, estado FROM clientes WHERE estado IN ('PR', 'SC', 'RS');","xp":10},"1.9":{"sql":"SELECT pedido_id, data_pedido\nFROM pedidos\nWHERE data_pedido BETWEEN '2025-11-01' AND '2025-11-30';","xp":10},"1.10":{"sql":"SELECT nome FROM produtos WHERE nome LIKE 'Smart%';","xp":10},"1.11":{"sql":"SELECT cliente_id, nome FROM clientes WHERE email IS NULL;","xp":10},"1.12":{"sql":"SELECT nome, preco FROM produtos ORDER BY preco DESC LIMIT 5;","xp":10},"1.13":{"sql":"SELECT DISTINCT categoria FROM produtos ORDER BY categoria;","xp":10},"1.14":{"sql":"SELECT pedido_id, data_pedido\nFROM pedidos\nORDER BY data_pedido DESC, pedido_id DESC\nLIMIT 10;","xp":20},"1.15":{"sql":"SELECT DISTINCT canal_aquisicao FROM clientes;","xp":10},"1.16":{"sql":"SELECT nome, preco, custo, preco - custo AS margem\nFROM produtos\nORDER BY margem DESC\nLIMIT 10;","xp":10},"1.17":{"sql":"SELECT nome, ROUND((preco - custo) / preco * 100, 1) AS margem_pct\nFROM produtos\nORDER BY margem_pct DESC, nome;","xp":20},"1.18":{"sql":"SELECT pedido_id, produto_id, quantidade * preco_unitario AS valor_total\nFROM itens_pedido\nWHERE pedido_id = 10;","xp":10},"1.19":{"sql":"SELECT nome, ROUND((preco - custo) / preco * 100, 1) AS margem_pct\nFROM produtos\nWHERE (preco - custo) / preco > 0.60;\n\n-- ================= BOSS FIGHT 1 =================","xp":20},"B1.1":{"sql":"SELECT nome, cidade, data_cadastro\nFROM clientes\nWHERE estado = 'MG'\n  AND data_cadastro >= '2025-01-01'\n  AND email IS NOT NULL\nORDER BY data_cadastro, cliente_id;","xp":30},"B1.2":{"sql":"SELECT pedido_id, data_pedido, forma_pagamento\nFROM pedidos\nWHERE data_pedido BETWEEN '2024-12-01' AND '2024-12-31'\n  AND frete = 0\n  AND forma_pagamento IN ('boleto', 'cartao_debito')\nORDER BY pedido_id;","xp":30},"B1.3":{"sql":"SELECT nome, preco\nFROM produtos\nWHERE categoria = 'Acessórios'\nORDER BY preco\nLIMIT 3;","xp":30},"B1.4":{"sql":"SELECT pedido_id, produto_id, quantidade, desconto_pct,\n       quantidade * preco_unitario AS valor\nFROM itens_pedido\nWHERE desconto_pct > 0 AND quantidade >= 2\nORDER BY valor DESC, pedido_id\nLIMIT 10;","xp":30},"B1.5":{"sql":"SELECT cliente_id, nome, estado\nFROM clientes\nWHERE nome LIKE '%Silva%' AND estado <> 'SP';","xp":30},"2.1":{"sql":"SELECT COUNT(*) AS total_clientes FROM clientes;","xp":10},"2.2":{"sql":"SELECT COUNT(*) AS total, COUNT(email) AS com_email FROM clientes;","xp":20},"2.3":{"sql":"SELECT MIN(preco) AS minimo, MAX(preco) AS maximo, ROUND(AVG(preco), 2) AS media\nFROM produtos;","xp":10},"2.4":{"sql":"SELECT ROUND(SUM(quantidade * preco_unitario), 2) AS faturamento_bruto FROM itens_pedido;","xp":10},"2.5":{"sql":"SELECT estado, COUNT(*) AS clientes\nFROM clientes\nGROUP BY estado\nORDER BY clientes DESC, estado;","xp":10},"2.6":{"sql":"SELECT status, COUNT(*) AS pedidos FROM pedidos GROUP BY status;","xp":10},"2.7":{"sql":"SELECT categoria, COUNT(*) AS qtd_produtos, ROUND(AVG(preco), 2) AS preco_medio\nFROM produtos\nGROUP BY categoria\nORDER BY preco_medio DESC;","xp":20},"2.8":{"sql":"SELECT produto_id, SUM(quantidade * preco_unitario) AS receita\nFROM itens_pedido\nGROUP BY produto_id\nORDER BY receita DESC\nLIMIT 5;","xp":20},"2.9":{"sql":"SELECT categoria, COUNT(*) AS qtd_produtos\nFROM produtos\nGROUP BY categoria\nHAVING COUNT(*) > 4;","xp":10},"2.10":{"sql":"SELECT cliente_id, COUNT(*) AS pedidos\nFROM pedidos\nGROUP BY cliente_id\nHAVING COUNT(*) >= 20\nORDER BY pedidos DESC, cliente_id;","xp":20},"2.11":{"sql":"SELECT pedido_id, COUNT(*) AS itens\nFROM itens_pedido\nGROUP BY pedido_id\nHAVING COUNT(*) >= 4\nORDER BY pedido_id;","xp":20},"2.12":{"sql":"SELECT YEAR(data_pedido) AS ano, COUNT(*) AS pedidos\nFROM pedidos\nGROUP BY ano\nORDER BY ano;","xp":10},"2.13":{"sql":"SELECT MONTH(data_pedido) AS mes, COUNT(*) AS pedidos\nFROM pedidos\nWHERE YEAR(data_pedido) = 2025\nGROUP BY mes\nORDER BY mes;","xp":10},"2.14":{"sql":"SELECT ISODOW(data_pedido) AS dia_semana, COUNT(*) AS pedidos\nFROM pedidos\nGROUP BY dia_semana\nORDER BY dia_semana;","xp":20},"2.15":{"sql":"SELECT DATE_TRUNC('month', data_pedido) AS mes, COUNT(*) AS pedidos\nFROM pedidos\nWHERE YEAR(data_pedido) = 2024\nGROUP BY mes\nORDER BY mes;","xp":20},"2.16":{"sql":"SELECT ROUND(AVG(quantidade * preco_unitario), 2) AS media,\n       ROUND(MEDIAN(quantidade * preco_unitario), 2) AS mediana\nFROM itens_pedido;","xp":20},"2.17":{"sql":"SELECT ROUND(AVG(frete), 2) AS media,\n       ROUND(MEDIAN(frete), 2) AS mediana,\n       ROUND(STDDEV_SAMP(frete), 2) AS desvio_padrao\nFROM pedidos\nWHERE frete > 0;","xp":20},"2.18":{"sql":"SELECT nota, COUNT(*) AS avaliacoes FROM avaliacoes GROUP BY nota ORDER BY nota;","xp":10},"2.19":{"sql":"SELECT forma_pagamento, COUNT(*) AS pedidos\nFROM pedidos\nGROUP BY forma_pagamento\nORDER BY pedidos DESC\nLIMIT 1;\n\n-- ================= BOSS FIGHT 2 =================","xp":10},"B2.1":{"sql":"SELECT forma_pagamento, status, COUNT(*) AS pedidos\nFROM pedidos\nGROUP BY forma_pagamento, status\nHAVING COUNT(*) >= 20\nORDER BY forma_pagamento, pedidos DESC;","xp":30},"B2.2":{"sql":"SELECT MONTH(data_pedido) AS mes, COUNT(*) AS pedidos\nFROM pedidos\nWHERE YEAR(data_pedido) = 2025\nGROUP BY mes\nORDER BY pedidos DESC\nLIMIT 1;","xp":30},"B2.3":{"sql":"SELECT canal_aquisicao, COUNT(*) AS clientes,\n       MIN(data_cadastro) AS primeiro_cadastro, MAX(data_cadastro) AS ultimo_cadastro\nFROM clientes\nGROUP BY canal_aquisicao\nORDER BY clientes DESC;","xp":30},"B2.4":{"sql":"SELECT produto_id, SUM(quantidade) AS unidades\nFROM itens_pedido\nGROUP BY produto_id\nORDER BY unidades DESC\nLIMIT 3;","xp":30},"B2.5":{"sql":"SELECT ROUND(QUANTILE_CONT(preco, 0.25), 2) AS q1,\n       ROUND(MEDIAN(preco), 2) AS mediana,\n       ROUND(QUANTILE_CONT(preco, 0.75), 2) AS q3\nFROM produtos;","xp":30},"3.1":{"sql":"SELECT COUNT(*) AS linhas, COUNT(DISTINCT pedido_id) AS pedidos_distintos\nFROM itens_pedido;","xp":10},"3.2":{"sql":"SELECT COUNT(DISTINCT cliente_id) AS clientes_que_compraram FROM pedidos;","xp":10},"3.3":{"sql":"SELECT p.pedido_id, p.data_pedido, c.nome\nFROM pedidos AS p\nINNER JOIN clientes AS c ON c.cliente_id = p.cliente_id\nWHERE p.pedido_id <= 5\nORDER BY p.pedido_id;","xp":10},"3.4":{"sql":"SELECT pr.nome, i.quantidade, i.preco_unitario\nFROM itens_pedido AS i\nJOIN produtos AS pr ON pr.produto_id = i.produto_id\nWHERE i.pedido_id = 42;","xp":10},"3.5":{"sql":"SELECT pr.categoria, SUM(i.quantidade * i.preco_unitario) AS receita\nFROM itens_pedido AS i\nJOIN produtos AS pr ON pr.produto_id = i.produto_id\nGROUP BY pr.categoria\nORDER BY receita DESC;","xp":20},"3.6":{"sql":"SELECT c.estado, COUNT(*) AS pedidos\nFROM pedidos AS p\nJOIN clientes AS c ON c.cliente_id = p.cliente_id\nGROUP BY c.estado\nORDER BY pedidos DESC, c.estado;","xp":20},"3.7":{"sql":"SELECT pr.nome\nFROM produtos AS pr\nLEFT JOIN itens_pedido AS i ON i.produto_id = pr.produto_id\nWHERE i.produto_id IS NULL;","xp":20},"3.8":{"sql":"SELECT COUNT(*) AS clientes_sem_pedido\nFROM clientes AS c\nLEFT JOIN pedidos AS p ON p.cliente_id = c.cliente_id\nWHERE p.pedido_id IS NULL;","xp":20},"3.9":{"sql":"SELECT COUNT(*) AS entregues_sem_avaliacao\nFROM pedidos AS p\nLEFT JOIN avaliacoes AS a ON a.pedido_id = p.pedido_id\nWHERE p.status = 'entregue' AND a.pedido_id IS NULL;","xp":20},"3.10":{"sql":"SELECT pr.nome, COALESCE(SUM(i.quantidade), 0) AS unidades\nFROM produtos AS pr\nLEFT JOIN itens_pedido AS i ON i.produto_id = pr.produto_id\nGROUP BY pr.nome\nORDER BY unidades, pr.nome\nLIMIT 5;","xp":20},"3.11":{"sql":"SELECT c.estado, SUM(i.quantidade * i.preco_unitario) AS receita\nFROM clientes AS c\nJOIN pedidos AS p ON p.cliente_id = c.cliente_id\nJOIN itens_pedido AS i ON i.pedido_id = p.pedido_id\nWHERE p.status = 'entregue'\nGROUP BY c.estado\nORDER BY receita DESC\nLIMIT 5;","xp":20},"3.12":{"sql":"SELECT pr.categoria, ROUND(AVG(a.nota), 2) AS nota_media\nFROM avaliacoes AS a\nJOIN itens_pedido AS i ON i.pedido_id = a.pedido_id\nJOIN produtos AS pr ON pr.produto_id = i.produto_id\nGROUP BY pr.categoria\nORDER BY nota_media DESC, pr.categoria;","xp":20},"3.13":{"sql":"SELECT c.cliente_id, c.nome, SUM(i.quantidade * i.preco_unitario) AS total_gasto\nFROM clientes AS c\nJOIN pedidos AS p ON p.cliente_id = c.cliente_id\nJOIN itens_pedido AS i ON i.pedido_id = p.pedido_id\nWHERE p.status = 'entregue'\nGROUP BY c.cliente_id, c.nome\nORDER BY total_gasto DESC\nLIMIT 5;","xp":20},"3.14":{"sql":"SELECT c.canal_aquisicao, SUM(i.quantidade * i.preco_unitario) AS receita\nFROM clientes AS c\nJOIN pedidos AS p ON p.cliente_id = c.cliente_id\nJOIN itens_pedido AS i ON i.pedido_id = p.pedido_id\nWHERE YEAR(p.data_pedido) = 2025 AND p.status <> 'cancelado'\nGROUP BY c.canal_aquisicao\nORDER BY receita DESC;","xp":20},"3.15":{"sql":"SELECT CASE\n         WHEN preco < 100 THEN 'Barato'\n         WHEN preco < 1000 THEN 'Médio'\n         ELSE 'Caro'\n       END AS faixa,\n       COUNT(*) AS produtos\nFROM produtos\nGROUP BY faixa;","xp":20},"3.16":{"sql":"SELECT forma_pagamento,\n       ROUND(100.0 * SUM(CASE WHEN status = 'cancelado' THEN 1 ELSE 0 END) / COUNT(*), 1)\n         AS taxa_cancelamento\nFROM pedidos\nGROUP BY forma_pagamento\nORDER BY taxa_cancelamento DESC;","xp":20},"3.17":{"sql":"SELECT CASE MONTH(data_pedido)\n         WHEN 11 THEN 'Black Friday'\n         WHEN 12 THEN 'Natal'\n         ELSE 'Resto do ano'\n       END AS periodo,\n       COUNT(*) AS pedidos\nFROM pedidos\nGROUP BY periodo;","xp":20},"3.18":{"sql":"SELECT CASE\n         WHEN nota = 5 THEN 'Promotor'\n         WHEN nota = 4 THEN 'Neutro'\n         ELSE 'Detrator'\n       END AS perfil,\n       COUNT(*) AS avaliacoes\nFROM avaliacoes\nGROUP BY perfil;\n\n-- ================= BOSS FIGHT 3 =================","xp":20},"B3.1":{"sql":"SELECT pr.categoria,\n       SUM(CASE WHEN YEAR(p.data_pedido) = 2024 THEN i.quantidade * i.preco_unitario ELSE 0 END) AS receita_2024,\n       SUM(CASE WHEN YEAR(p.data_pedido) = 2025 THEN i.quantidade * i.preco_unitario ELSE 0 END) AS receita_2025\nFROM itens_pedido AS i\nJOIN pedidos AS p ON p.pedido_id = i.pedido_id\nJOIN produtos AS pr ON pr.produto_id = i.produto_id\nWHERE p.status <> 'cancelado'\nGROUP BY pr.categoria\nORDER BY pr.categoria;","xp":30},"B3.2":{"sql":"SELECT DISTINCT c.cliente_id, c.nome\nFROM clientes AS c\nJOIN pedidos AS p ON p.cliente_id = c.cliente_id\nJOIN itens_pedido AS i ON i.pedido_id = p.pedido_id\nJOIN produtos AS pr ON pr.produto_id = i.produto_id\nWHERE c.estado = 'RJ' AND pr.nome LIKE 'Smart TV%'\nORDER BY c.cliente_id;","xp":30},"B3.3":{"sql":"SELECT pr.categoria, COUNT(DISTINCT a.pedido_id) AS avaliacoes_negativas\nFROM avaliacoes AS a\nJOIN itens_pedido AS i ON i.pedido_id = a.pedido_id\nJOIN produtos AS pr ON pr.produto_id = i.produto_id\nWHERE a.nota <= 2\nGROUP BY pr.categoria\nHAVING COUNT(DISTINCT a.pedido_id) > 20;","xp":30},"B3.4":{"sql":"SELECT CASE\n         WHEN c.estado IN ('SP', 'RJ', 'MG') THEN 'Sudeste'\n         WHEN c.estado IN ('PR', 'SC', 'RS') THEN 'Sul'\n         WHEN c.estado IN ('BA', 'PE', 'CE') THEN 'Nordeste'\n         ELSE 'Centro-Oeste'\n       END AS regiao,\n       ROUND(AVG(p.frete), 2) AS frete_medio\nFROM pedidos AS p\nJOIN clientes AS c ON c.cliente_id = p.cliente_id\nGROUP BY regiao\nORDER BY regiao;","xp":30},"4.1":{"sql":"SELECT nome, preco\nFROM produtos\nWHERE preco > (SELECT AVG(preco) FROM produtos)\nORDER BY preco DESC;","xp":10},"4.2":{"sql":"SELECT COUNT(*) AS clientes\nFROM clientes\nWHERE cliente_id IN (\n    SELECT cliente_id FROM pedidos\n    WHERE data_pedido BETWEEN '2025-12-01' AND '2025-12-31'\n);","xp":20},"4.3":{"sql":"SELECT ROUND(AVG(valor_pedido), 2) AS ticket_medio\nFROM (\n    SELECT i.pedido_id, SUM(i.quantidade * i.preco_unitario) AS valor_pedido\n    FROM itens_pedido AS i\n    JOIN pedidos AS p ON p.pedido_id = i.pedido_id\n    WHERE p.status <> 'cancelado'\n    GROUP BY i.pedido_id\n) AS t;","xp":20},"4.4":{"sql":"SELECT pedido_id, SUM(quantidade * preco_unitario) AS total\nFROM itens_pedido\nGROUP BY pedido_id\nORDER BY total DESC\nLIMIT 1;","xp":20},"4.5":{"sql":"WITH valor_por_pedido AS (\n    SELECT pedido_id, SUM(quantidade * preco_unitario) AS valor\n    FROM itens_pedido\n    GROUP BY pedido_id\n)\nSELECT CASE\n         WHEN valor < 200 THEN '1. até R$199'\n         WHEN valor < 1000 THEN '2. R$200 a R$999'\n         ELSE '3. R$1000+'\n       END AS faixa,\n       COUNT(*) AS pedidos\nFROM valor_por_pedido\nGROUP BY faixa\nORDER BY faixa;","xp":20},"4.6":{"sql":"WITH gasto AS (\n    SELECT p.cliente_id, SUM(i.quantidade * i.preco_unitario) AS total\n    FROM pedidos AS p\n    JOIN itens_pedido AS i ON i.pedido_id = p.pedido_id\n    WHERE p.status = 'entregue'\n    GROUP BY p.cliente_id\n)\nSELECT CASE\n         WHEN total >= 10000 THEN 'VIP'\n         WHEN total >= 3000 THEN 'Recorrente'\n         ELSE 'Ocasional'\n       END AS segmento,\n       COUNT(*) AS clientes\nFROM gasto\nGROUP BY segmento;","xp":30},"4.7":{"sql":"WITH receita_mensal AS (\n    SELECT MONTH(p.data_pedido) AS mes, SUM(i.quantidade * i.preco_unitario) AS receita\n    FROM pedidos AS p\n    JOIN itens_pedido AS i ON i.pedido_id = p.pedido_id\n    WHERE YEAR(p.data_pedido) = 2025 AND p.status <> 'cancelado'\n    GROUP BY mes\n)\nSELECT mes, receita\nFROM receita_mensal\nWHERE receita > (SELECT AVG(receita) FROM receita_mensal)\nORDER BY mes;","xp":30},"4.8":{"sql":"WITH compradores_2024 AS (\n    SELECT DISTINCT cliente_id FROM pedidos WHERE YEAR(data_pedido) = 2024\n),\ncompradores_2025 AS (\n    SELECT DISTINCT cliente_id FROM pedidos WHERE YEAR(data_pedido) = 2025\n)\nSELECT COUNT(*) AS clientes_retidos\nFROM compradores_2024 AS a\nJOIN compradores_2025 AS b ON a.cliente_id = b.cliente_id;","xp":30},"4.9":{"sql":"WITH valor_por_pedido AS (\n    SELECT pedido_id, SUM(quantidade * preco_unitario) AS valor\n    FROM itens_pedido\n    GROUP BY pedido_id\n)\nSELECT ROUND(QUANTILE_CONT(valor, 0.25), 2) AS q1,\n       ROUND(MEDIAN(valor), 2) AS mediana,\n       ROUND(QUANTILE_CONT(valor, 0.75), 2) AS q3\nFROM valor_por_pedido;","xp":20},"4.10":{"sql":"WITH valor_por_pedido AS (\n    SELECT pedido_id, SUM(quantidade * preco_unitario) AS valor\n    FROM itens_pedido\n    GROUP BY pedido_id\n),\nquartis AS (\n    SELECT QUANTILE_CONT(valor, 0.25) AS q1, QUANTILE_CONT(valor, 0.75) AS q3\n    FROM valor_por_pedido\n)\nSELECT ROUND(q1, 2) AS q1, ROUND(q3, 2) AS q3,\n       ROUND(q3 - q1, 2) AS iqr,\n       ROUND(q3 + 1.5 * (q3 - q1), 2) AS limite_superior\nFROM quartis;","xp":30},"4.11":{"sql":"WITH valor_por_pedido AS (\n    SELECT pedido_id, SUM(quantidade * preco_unitario) AS valor\n    FROM itens_pedido\n    GROUP BY pedido_id\n),\nlimite AS (\n    SELECT QUANTILE_CONT(valor, 0.75)\n           + 1.5 * (QUANTILE_CONT(valor, 0.75) - QUANTILE_CONT(valor, 0.25)) AS lim\n    FROM valor_por_pedido\n)\nSELECT COUNT(*) AS pedidos_outliers\nFROM valor_por_pedido, limite\nWHERE valor > lim;","xp":30},"4.12":{"sql":"WITH valor_por_pedido AS (\n    SELECT p.pedido_id, p.forma_pagamento, SUM(i.quantidade * i.preco_unitario) AS valor\n    FROM pedidos AS p\n    JOIN itens_pedido AS i ON i.pedido_id = p.pedido_id\n    GROUP BY p.pedido_id, p.forma_pagamento\n)\nSELECT forma_pagamento,\n       ROUND(AVG(valor), 2) AS media,\n       ROUND(MEDIAN(valor), 2) AS mediana\nFROM valor_por_pedido\nGROUP BY forma_pagamento\nORDER BY forma_pagamento;\n\n-- ================= BOSS FINAL — PROVA DO MÊS =================","xp":20},"B4.1":{"sql":"SELECT QUARTER(p.data_pedido) AS trimestre,\n       COUNT(DISTINCT p.pedido_id) AS pedidos,\n       SUM(i.quantidade * i.preco_unitario) AS receita\nFROM pedidos AS p\nJOIN itens_pedido AS i ON i.pedido_id = p.pedido_id\nWHERE YEAR(p.data_pedido) = 2025 AND p.status = 'entregue'\nGROUP BY trimestre\nORDER BY trimestre;","xp":40},"B4.2":{"sql":"SELECT pr.categoria,\n       SUM((i.preco_unitario - pr.custo) * i.quantidade) AS margem_bruta\nFROM itens_pedido AS i\nJOIN produtos AS pr ON pr.produto_id = i.produto_id\nJOIN pedidos AS p ON p.pedido_id = i.pedido_id\nWHERE p.status = 'entregue'\nGROUP BY pr.categoria\nORDER BY margem_bruta DESC\nLIMIT 3;","xp":40},"B4.3":{"sql":"WITH pedidos_por_cliente AS (\n    SELECT cliente_id, COUNT(*) AS pedidos\n    FROM pedidos\n    GROUP BY cliente_id\n)\nSELECT ROUND(100.0 * SUM(CASE WHEN pedidos >= 2 THEN 1 ELSE 0 END) / COUNT(*), 1)\n         AS taxa_recompra\nFROM pedidos_por_cliente;","xp":40},"B4.4":{"sql":"SELECT c.canal_aquisicao,\n       COUNT(DISTINCT c.cliente_id) AS clientes,\n       COUNT(DISTINCT p.cliente_id) AS compradores,\n       ROUND(100.0 * COUNT(DISTINCT p.cliente_id) / COUNT(DISTINCT c.cliente_id), 1) AS conversao\nFROM clientes AS c\nLEFT JOIN pedidos AS p ON p.cliente_id = c.cliente_id\nGROUP BY c.canal_aquisicao\nORDER BY conversao DESC;","xp":40},"B4.5":{"sql":"SELECT pr.nome, COUNT(*) AS avaliacoes_ruins\nFROM avaliacoes AS a\nJOIN itens_pedido AS i ON i.pedido_id = a.pedido_id\nJOIN produtos AS pr ON pr.produto_id = i.produto_id\nWHERE a.nota <= 2\nGROUP BY pr.nome\nORDER BY avaliacoes_ruins DESC, pr.nome\nLIMIT 3;","xp":40},"B4.6":{"sql":"WITH valor_por_pedido AS (\n    SELECT p.pedido_id, ISODOW(p.data_pedido) AS dia_semana,\n           SUM(i.quantidade * i.preco_unitario) AS valor\n    FROM pedidos AS p\n    JOIN itens_pedido AS i ON i.pedido_id = p.pedido_id\n    WHERE p.status <> 'cancelado'\n    GROUP BY p.pedido_id, dia_semana\n)\nSELECT dia_semana, ROUND(AVG(valor), 2) AS ticket_medio\nFROM valor_por_pedido\nGROUP BY dia_semana\nORDER BY ticket_medio DESC\nLIMIT 1;","xp":40}}</script>
<script type="application/json" id="dados-cartoes">[{"f":"O que faz SELECT *?","v":"Retorna todas as colunas da tabela. Útil para explorar, evite em produção.","licao":"L1"},{"f":"Qual a ordem de ESCRITA de uma query?","v":"SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT","licao":"L4"},{"f":"Qual a ordem de EXECUÇÃO de uma query?","v":"FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT","licao":"L8"},{"f":"AND ou OR: qual é avaliado primeiro?","v":"AND. Use parênteses para deixar a intenção explícita.","licao":"L2"},{"f":"Por que \"coluna = NULL\" não funciona?","v":"NULL significa \"desconhecido\"; qualquer comparação com ele resulta em NULL. Use IS NULL / IS NOT NULL.","licao":"L3"},{"f":"BETWEEN inclui os extremos?","v":"Sim, BETWEEN a AND b equivale a >= a AND <= b.","licao":"L3"},{"f":"No LIKE, o que significam % e _?","v":"% = qualquer sequência de caracteres (inclusive vazia); _ = exatamente um caractere.","licao":"L3"},{"f":"Para que serve DISTINCT?","v":"Remove linhas duplicadas do resultado.","licao":"L4"},{"f":"Por que usar um critério de desempate no ORDER BY?","v":"Sem ele, linhas empatadas podem aparecer em ordem diferente a cada execução (resultado não determinístico).","licao":"L4"},{"f":"Posso usar um alias do SELECT no WHERE?","v":"No SQL padrão, não: o WHERE é executado antes do SELECT. No ORDER BY pode.","licao":"L5"},{"f":"Fórmula da margem percentual?","v":"(preço − custo) / preço × 100","licao":"L5"},{"f":"COUNT(*) vs COUNT(coluna)?","v":"COUNT(*) conta todas as linhas; COUNT(coluna) ignora NULLs.","licao":"L6"},{"f":"Funções de agregação consideram NULL?","v":"Não, SUM/AVG/MIN/MAX/COUNT(coluna) ignoram NULL.","licao":"L6"},{"f":"Regra de ouro do GROUP BY?","v":"Toda coluna do SELECT que não está dentro de uma agregação precisa estar no GROUP BY.","licao":"L7"},{"f":"WHERE vs HAVING?","v":"WHERE filtra linhas antes de agrupar; HAVING filtra grupos depois de agrupar.","licao":"L8"},{"f":"Para que serve DATE_TRUNC('month', data)?","v":"Leva a data ao primeiro dia do mês, ideal para agrupar séries temporais mensais.","licao":"L9"},{"f":"Quando preferir mediana à média?","v":"Quando há outliers ou assimetria (renda, preços, tempos); a mediana é robusta a extremos.","licao":"L10"},{"f":"O que significa média muito maior que a mediana?","v":"Assimetria à direita: poucos valores altos puxam a média para cima.","licao":"L10"},{"f":"O que é desvio padrão, em uma frase?","v":"A distância típica dos valores em relação à média (dispersão).","licao":"L10"},{"f":"O que são Q1, Q2 e Q3?","v":"Os valores que cortam os dados ordenados em 25%, 50% (mediana) e 75%.","licao":"L18"},{"f":"O que é IQR?","v":"Intervalo interquartil = Q3 − Q1; mostra onde estão os 50% centrais dos dados.","licao":"L18"},{"f":"Regra do boxplot para outlier superior?","v":"Valor > Q3 + 1,5 × IQR","licao":"L18"},{"f":"Devo remover outliers automaticamente?","v":"Não. Investigue primeiro: podem ser erro, fraude ou um cliente legítimo muito relevante.","licao":"L18"},{"f":"O que é chave primária (PK)?","v":"Coluna(s) que identificam cada linha de forma única e não nula.","licao":"L11"},{"f":"O que é chave estrangeira (FK)?","v":"Coluna que referencia a PK de outra tabela, criando o relacionamento.","licao":"L11"},{"f":"O que é cardinalidade 1:N?","v":"Um registro de uma tabela se relaciona com vários da outra (1 cliente → N pedidos).","licao":"L11"},{"f":"Qual o risco de juntar tabelas 1:N e somar uma coluna do lado 1?","v":"Duplicação: o valor se repete para cada linha do lado N e a soma fica inflada.","licao":"L14"},{"f":"INNER JOIN vs LEFT JOIN?","v":"INNER: só linhas com correspondência nos dois lados. LEFT: todas da esquerda + correspondência (ou NULL).","licao":"L13"},{"f":"Como encontrar registros sem correspondência (anti-join)?","v":"LEFT JOIN + WHERE tabela_direita.chave IS NULL","licao":"L13"},{"f":"Para que serve COALESCE(x, 0)?","v":"Retorna o primeiro valor não nulo; troca NULL por 0 (ou outro padrão).","licao":"L13"},{"f":"Como calcular uma taxa com CASE?","v":"100.0 * SUM(CASE WHEN condição THEN 1 ELSE 0 END) / COUNT(*)","licao":"L15"},{"f":"Em um CASE WHEN com várias condições verdadeiras, qual vence?","v":"A primeira condição verdadeira, na ordem em que foi escrita.","licao":"L15"},{"f":"O que é fato e dimensão (star schema)?","v":"Fato = eventos/medidas (vendas, itens). Dimensão = contexto descritivo (cliente, produto, data).","licao":"L11"},{"f":"Como calcular ticket médio corretamente?","v":"Primeiro somar o valor por pedido, depois tirar a média desses totais (não é AVG do preço do item).","licao":"L16"},{"f":"Subquery vs CTE?","v":"Mesmo poder; a CTE (WITH) nomeia etapas, deixa a query legível e pode ser referenciada várias vezes.","licao":"L17"},{"f":"O que é taxa de recompra?","v":"% de clientes (que compraram) com 2 ou mais pedidos.","licao":"L18"},{"f":"O que é taxa de conversão de um canal?","v":"Compradores ÷ clientes cadastrados vindos daquele canal.","licao":"L18"}]</script>
<script>
/* Motor SQL do site: SQLite (sql.js) + funções no estilo DuckDB/PostgreSQL,
   e o corretor que compara o resultado do aluno com o do gabarito.
   Funciona no navegador (window.Motor) e no Node (module.exports), para teste. */
(function (raiz) {
  "use strict";

  const TIPOS = { INTEGER: "INTEGER", VARCHAR: "TEXT", DATE: "TEXT" };
  const tipoSqlite = (t) => TIPOS[t] || (t.startsWith("DECIMAL") ? "REAL" : "TEXT");

  const texto = (d) => (d == null ? null : String(d));
  const parteData = (d, ini, fim) => (d == null ? null : Number(String(d).slice(ini, fim)));

  function isodow(d) {
    if (d == null) return null;
    const [a, m, dia] = String(d).slice(0, 10).split("-").map(Number);
    const js = new Date(Date.UTC(a, m - 1, dia)).getUTCDay(); // 0 = domingo
    return js === 0 ? 7 : js;
  }

  function dateTrunc(parte, d) {
    if (d == null) return null;
    const s = String(d).slice(0, 10);
    const p = String(parte).toLowerCase();
    if (p === "year") return s.slice(0, 4) + "-01-01";
    if (p === "month") return s.slice(0, 7) + "-01";
    if (p === "quarter") {
      const m = Number(s.slice(5, 7));
      const q = String(Math.floor((m - 1) / 3) * 3 + 1).padStart(2, "0");
      return s.slice(0, 4) + "-" + q + "-01";
    }
    if (p === "week") {
      const [a, m, dia] = s.split("-").map(Number);
      const dt = new Date(Date.UTC(a, m - 1, dia - (isodow(s) - 1)));
      return dt.toISOString().slice(0, 10);
    }
    return s;
  }

  function quantil(valores, q) {
    if (!valores.length) return null;
    const v = valores.slice().sort((a, b) => a - b);
    const pos = (v.length - 1) * q;
    const base = Math.floor(pos);
    const resto = pos - base;
    return v[base + 1] !== undefined ? v[base] + resto * (v[base + 1] - v[base]) : v[base];
  }

  function desvio(valores) {
    const n = valores.length;
    if (n < 2) return null;
    const media = valores.reduce((a, b) => a + b, 0) / n;
    return Math.sqrt(valores.reduce((a, b) => a + (b - media) ** 2, 0) / (n - 1));
  }

  const coleta = { init: () => [], step: (s, v) => { if (v != null) s.push(Number(v)); return s; } };

  function registrarFuncoes(db) {
    db.create_function("year", (d) => parteData(d, 0, 4));
    db.create_function("month", (d) => parteData(d, 5, 7));
    db.create_function("day", (d) => parteData(d, 8, 10));
    db.create_function("quarter", (d) => (d == null ? null : Math.floor((parteData(d, 5, 7) - 1) / 3) + 1));
    db.create_function("isodow", isodow);
    db.create_function("date_trunc", dateTrunc);
    db.create_aggregate("median", { ...coleta, finalize: (s) => quantil(s, 0.5) });
    db.create_aggregate("quantile_cont", {
      init: () => ({ v: [], q: 0.5 }),
      step: (s, v, q) => { if (v != null) s.v.push(Number(v)); s.q = Number(q); return s; },
      finalize: (s) => quantil(s.v, s.q),
    });
    db.create_aggregate("stddev_samp", { ...coleta, finalize: desvio });
    db.create_aggregate("stddev", { ...coleta, finalize: desvio });
    db.create_aggregate("mode", {
      init: () => new Map(),
      step: (s, v) => { if (v != null) s.set(v, (s.get(v) || 0) + 1); return s; },
      finalize: (s) => { let melhor = null, n = 0; s.forEach((c, v) => { if (c > n) { n = c; melhor = v; } }); return melhor; },
    });
    db.run("PRAGMA case_sensitive_like = ON");
  }

  /** Cria o banco a partir do JSON exportado e devolve os bytes (cópia intocada). */
  function montarBanco(SQL, dados) {
    const db = new SQL.Database();
    db.run("BEGIN");
    for (const [tabela, { colunas, linhas }] of Object.entries(dados)) {
      db.run(`CREATE TABLE ${tabela} (${colunas.map(([n, t]) => `${n} ${tipoSqlite(t)}`).join(", ")})`);
      const stmt = db.prepare(`INSERT INTO ${tabela} VALUES (${colunas.map(() => "?").join(",")})`);
      for (const l of linhas) stmt.run(l);
      stmt.free();
    }
    db.run("COMMIT");
    const bytes = db.export();
    db.close();
    return bytes;
  }

  function abrirBanco(SQL, bytes) {
    const db = new SQL.Database(bytes);
    registrarFuncoes(db);
    return db;
  }

  /** Executa e devolve o ÚLTIMO resultado ({colunas, linhas}). Lança em erro. */
  function executar(db, sql) {
    const res = db.exec(sql);
    if (!res.length) return { colunas: [], linhas: [] };
    const r = res[res.length - 1];
    return { colunas: r.columns, linhas: r.values };
  }

  const normalizar = (v) => (typeof v === "number" ? Math.round(v * 100) / 100 + 0 : v);
  const iguais = (a, b) =>
    typeof a === "number" && typeof b === "number" ? Math.abs(a - b) <= 0.0101 : a === b;
  const linhasIguais = (a, b) => a.length === b.length && a.every((v, i) => iguais(v, b[i]));

  function compararValor(a, b) {
    if (a === b) return 0;
    if (a == null) return -1;
    if (b == null) return 1;
    if (typeof a === "number" && typeof b === "number") return iguais(a, b) ? 0 : a - b;
    return String(a) < String(b) ? -1 : 1;
  }
  const compararLinha = (a, b) => {
    for (let i = 0; i < Math.min(a.length, b.length); i++) {
      const c = compararValor(a[i], b[i]);
      if (c) return c;
    }
    return 0;
  };

  const ehOrdenado = (sql) => /\border\s+by\b/i.test(sql);

  /** Compara resultados. Devolve {ok, msg, esperado?, obtido?}. */
  function comparar(esperado, obtido, ordenado) {
    const e = esperado.map((l) => l.map(normalizar));
    const o = obtido.map((l) => l.map(normalizar));
    if (e.length && o.length && e[0].length !== o[0].length)
      return { ok: false, msg: `Esperava ${e[0].length} coluna(s), sua consulta trouxe ${o[0].length}. Confira quais colunas o enunciado pede, e em que ordem.` };
    if (e.length !== o.length)
      return { ok: false, msg: `Esperava ${e.length} linha(s), sua consulta trouxe ${o.length}. Confira os filtros (WHERE/HAVING) e o LIMIT.` };
    const [ee, oo] = ordenado ? [e, o] : [e.slice().sort(compararLinha), o.slice().sort(compararLinha)];
    for (let i = 0; i < ee.length; i++) {
      if (!linhasIguais(ee[i], oo[i])) {
        const dica = ordenado
          ? "Os valores ou a ORDEM das linhas não batem. Confira o ORDER BY e o critério de desempate."
          : "Os valores não batem. Confira os cálculos, filtros e arredondamentos.";
        return { ok: false, msg: dica, esperado: ee[i], obtido: oo[i] };
      }
    }
    return { ok: true };
  }

  const Motor = { montarBanco, abrirBanco, executar, comparar, ehOrdenado, normalizar };
  if (typeof module !== "undefined" && module.exports) module.exports = Motor;
  else raiz.Motor = Motor;
})(typeof window !== "undefined" ? window : globalThis);

</script>

<p>Isso também resolve a armadilha da duplicação: agregue cada coisa no seu nível numa CTE e <b>depois</b> junte.</p>`,

<script>
(function () {
  "use strict";

  /* ================= dados embutidos ================= */
  const lerJSON = (id) => JSON.parse(document.getElementById(id).textContent);
  const DADOS = lerJSON("dados-loja");
  const GAB = lerJSON("dados-gabarito");
  const CARTOES = lerJSON("dados-cartoes");
  const CURSO = window.CURSO;
  const SQLJS_URL = "https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm.js";

  const LICOES = [];
  const EXERCICIOS = {};
  CURSO.forEach((u, ui) => {
    u.num = ui + 1;
    u.cor = `var(--u${ui + 1})`;
    u.corFundo = `var(--u${ui + 1}-fundo)`;
    u.licoes.forEach((l) => {
      l.unidade = u;
      LICOES.push(l);
      l.exercicios.forEach((e) => Object.assign(e, GAB[e.id], { origem: l }));
      l.exercicios.forEach((e) => (EXERCICIOS[e.id] = e));
    });
    u.boss.unidade = u;
    u.boss.exercicios.forEach((e) => { Object.assign(e, GAB[e.id], { origem: u.boss, boss: true }); EXERCICIOS[e.id] = e; });
  });
  const TOTAL_EX = Object.keys(EXERCICIOS).length;

  /* ================= utilidades ================= */
  function h(tag, attrs, ...filhos) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "text") el.textContent = v;
      else if (k === "style") el.setAttribute("style", v);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, v);
    }
    for (const f of filhos.flat()) if (f != null && f !== false) el.append(f.nodeType ? f : document.createTextNode(String(f)));
    return el;
  }
  const svg = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
  const I = {
    chama: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5-1.3 5.2-2.4 7.1C8.4 11 8 12.3 8 13.5 8 15.99 10 18 12 18s4-2 4-4.5c0-1.5-.6-2.5-1.3-3.4 2.6.7 4.3 3.3 4.3 6.2A7 7 0 0 1 12 23a7 7 0 0 1-7-6.7C5 10 12 7.5 12 2z"/></svg>',
    raio: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.6L13.5 2z"/></svg>',
    check: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    coroa: '<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 7.5 7.5 11 12 4l4.5 7L21 7.5 19.5 18h-15L3 7.5zM4.5 19.5h15V21h-15z"/></svg>',
    cadeado: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1.5A1.5 1.5 0 0 1 20 11.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 20.5v-9A1.5 1.5 0 0 1 5.5 10H7zm2 0h6V7a3 3 0 0 0-6 0v3z"/></svg>',
    fechar: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    tabela: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M9 9.5V20"/></svg>',
    trilha: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>',
    alvo: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>',
    cartas: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="13" height="16" rx="2"/><path d="M4 7v11a3 3 0 0 0 3 3h9"/></svg>',
    pessoa: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    relogio: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>',
    logo: '<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--azul)"/><ellipse cx="16" cy="10" rx="8" ry="3.2" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M8 10v11c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2V10M8 15.5c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2" fill="none" stroke="#fff" stroke-width="2.2"/></svg>',
  };

  const pad = (n) => String(n).padStart(2, "0");
  const dataStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const hoje = () => dataStr(new Date());
  function addDias(s, n) { const [a, m, d] = s.split("-").map(Number); return dataStr(new Date(a, m - 1, d + n)); }
  function semanaISO(s) {
    const [a, m, d] = s.split("-").map(Number);
    const dt = new Date(Date.UTC(a, m - 1, d));
    const dia = dt.getUTCDay() || 7;
    dt.setUTCDate(dt.getUTCDate() + 4 - dia);
    const inicio = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
    return dt.getUTCFullYear() + "-" + Math.ceil(((dt - inicio) / 864e5 + 1) / 7);
  }
  const chave = (id) => id.replace(/\./g, "_");
  const embaralhar = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ================= estado e persistência ================= */
  const CHAVE_LOCAL = "trilha-analista-v1";
  const INTERVALO = { 1: 1, 2: 3, 3: 7, 4: 21 };
  const NIVEIS = [
    [0, "Estagiário de Planilha"], [500, "Aprendiz de SELECT"], [1500, "Domador de JOINs"],
    [3000, "Mestre dos Agregados"], [5000, "Treinador de Pandas"], [8000, "Contador de Histórias com Dados"],
    [12000, "Analista Júnior Pronto"],
  ];

  const novoEstado = () => ({ v: 1, dias: {}, ex: {}, boss: {}, cartoes: {}, cartoesDia: null, cartoesTotal: 0, revisoes: 0, meta: 30, atualizado: 0 });
  function normalizar(e) { return Object.assign(novoEstado(), e || {}); }
  function carregarLocal() { try { const s = localStorage.getItem(CHAVE_LOCAL); return s ? normalizar(JSON.parse(s)) : null; } catch { return null; } }
  function salvarLocal() { try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify(estado)); } catch { /* sem armazenamento local */ } }

  function mesclar(a, b) {
    const [novo, velho] = (a.atualizado || 0) >= (b.atualizado || 0) ? [a, b] : [b, a];
    const r = normalizar(JSON.parse(JSON.stringify(novo)));
    const v = normalizar(velho);
    for (const [d, xp] of Object.entries(v.dias)) r.dias[d] = Math.max(r.dias[d] || 0, xp);
    for (const [k, e] of Object.entries(v.ex)) if (!r.ex[k] || (r.ex[k].status !== "ok" && e.status === "ok")) r.ex[k] = e;
    for (const [k, bo] of Object.entries(v.boss)) if (!r.boss[k] || bo.melhor > r.boss[k].melhor) r.boss[k] = bo;
    for (const [k, c] of Object.entries(v.cartoes)) if (!r.cartoes[k]) r.cartoes[k] = c;
    r.cartoesTotal = Math.max(r.cartoesTotal, v.cartoesTotal);
    r.revisoes = Math.max(r.revisoes, v.revisoes);
    return r;
  }

  let estado = carregarLocal() || novoEstado();
  const nuvem = { ref: null, status: "local", salvando: false, pendente: false, timer: null };

  function salvar() {
    estado.atualizado = Date.now();
    salvarLocal();
    clearTimeout(nuvem.timer);
    nuvem.timer = setTimeout(salvarNuvem, 1200);
  }
  async function salvarNuvem() {
    if (!nuvem.ref) return;
    if (nuvem.salvando) { nuvem.pendente = true; return; }
    nuvem.salvando = true;
    try {
      await nuvem.ref.set(JSON.parse(JSON.stringify(estado)));
      nuvem.status = "nuvem";
    } catch (e) {
      const codigo = e && e.code;
      if (codigo === "unavailable") setTimeout(salvarNuvem, 2500 + Math.random() * 2500);
      else { nuvem.ref = null; nuvem.status = "local"; }
    } finally {
      nuvem.salvando = false;
      if (nuvem.pendente) { nuvem.pendente = false; salvarNuvem(); }
    }
  }
  async function iniciarNuvem() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc("data/users/" + id + "/progresso");
      const snap = await ref.get();
      nuvem.ref = ref;
      nuvem.status = "nuvem";
      if (snap.exists) {
        const antes = JSON.stringify(estado);
        estado = mesclar(estado, snap.data());
        salvarLocal();
        if (JSON.stringify(estado) !== antes && !sessao) render();
        if ((estado.atualizado || 0) > (snap.data().atualizado || 0)) salvarNuvem();
      } else if (estado.atualizado) {
        salvarNuvem();
      }
      if (vista === "perfil" && !sessao) render();
    } catch { nuvem.ref = null; nuvem.status = "local"; }
  }

  /* ================= regras do jogo ================= */
  const xpTotal = () => Object.values(estado.dias).reduce((a, b) => a + b, 0);
  const xpHoje = () => estado.dias[hoje()] || 0;
  function ganharXP(n) { if (n <= 0) return; const d = hoje(); estado.dias[d] = (estado.dias[d] || 0) + n; }
  function ofensiva() {
    const dias = new Set(Object.keys(estado.dias).filter((d) => estado.dias[d] > 0));
    if (!dias.size) return 0;
    const primeiro = [...dias].sort()[0];
    let dia = dias.has(hoje()) ? hoje() : addDias(hoje(), -1);
    let n = 0;
    const folgas = new Set();
    for (;;) {
      if (dias.has(dia)) n++;
      else {
        const s = semanaISO(dia);
        if (folgas.has(s) || dia < primeiro) break;
        folgas.add(s);
      }
      dia = addDias(dia, -1);
    }
    return n;
  }
  function nivel(xp = xpTotal()) {
    let i = 0;
    while (i + 1 < NIVEIS.length && xp >= NIVEIS[i + 1][0]) i++;
    return { i, nome: NIVEIS[i][1], base: NIVEIS[i][0], proximo: NIVEIS[i + 1] || null };
  }
  const exEstado = (id) => estado.ex[chave(id)];
  const exFeito = (id) => !!exEstado(id);
  const licaoFeita = (l) => l.exercicios.every((e) => exFeito(e.id));
  const unidadeFeita = (u) => u.licoes.every(licaoFeita);
  function licaoLiberada(l) { const i = LICOES.indexOf(l); return i === 0 || licaoFeita(LICOES[i - 1]); }
  const licaoAtual = () => LICOES.find((l) => !licaoFeita(l));
  const exCorretos = () => Object.values(estado.ex).filter((e) => e.status === "ok").length;
  function vencidos() {
    const d = hoje();
    return Object.keys(EXERCICIOS).filter((id) => { const e = exEstado(id); return e && e.prox && e.prox <= d; });
  }
  function cartoesLiberados() { return CARTOES.map((c, i) => ({ ...c, i })).filter((c) => { const l = LICOES.find((x) => x.id === c.licao); return l && licaoFeita(l); }); }
  function cartoesVencidos() { const d = hoje(); return cartoesLiberados().filter((c) => { const s = estado.cartoes["c" + c.i]; return !s || (s.prox && s.prox <= d); }); }

  function conquistas() {
    const corretos = exCorretos();
    const st = ofensiva();
    const bosses = CURSO.filter((u) => estado.boss[u.boss.id] && estado.boss[u.boss.id].passou).length;
    return [
      [corretos >= 1, "Primeira consulta certa", "Acertou o primeiro desafio"],
      [corretos >= 25, "25 desafios", "Acertou 25 desafios"],
      [LICOES.every(licaoFeita), "Mês 1 concluído", "Terminou todas as 18 lições"],
      [bosses >= 1, "Derrotou um chefão", "Passou em um desafio de sábado"],
      [bosses >= 4, "Prova do Mês", "Passou nos 4 chefões"],
      [st >= 7, "Ofensiva de 7 dias", "Uma semana sem quebrar a corrente"],
      [st >= 30, "Ofensiva de 30 dias", "Um mês inteiro de hábito"],
      [estado.revisoes >= 1, "Primeira revisão", "Refez um desafio antigo no Treino"],
      [estado.cartoesTotal >= 100, "100 cartões", "Revisou 100 cartões de memória"],
    ];
  }

  /* ================= motor SQL ================= */
  const motor = { SQL: null, bytes: null, erro: null, cache: {} };
  function carregarMotor() {
    const s = document.createElement("script");
    s.src = SQLJS_URL;
    s.onload = async () => {
